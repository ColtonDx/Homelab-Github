---
# Tells ansible/playbooks/terraform/build-project.yaml where this project's inputs come from; locations only, never values

# State file in Garage; tf_backend=local replaces it with local state for a bootstrap run
state_key: gitlab.tfstate

# Secrets, passed to Terraform as TF_VAR_* environment variables and never logged
vault:
  - { path: proxmox, field: PROXMOX_API_URL, var: proxmox_api_url }
  - { path: proxmox, field: PROXMOX_API_TOKEN_ID, var: proxmox_api_token_id }
  - { path: proxmox, field: PROXMOX_API_TOKEN_SECRET, var: proxmox_api_token_secret }

# Site values: this dict in the private inventory supplies any variable it names
inventory: terraform_gitlab

# Fallbacks for anything the inventory does not set; set both ip_address and ip_prefix in the inventory to keep GitLab independent of NetBox
netbox:
  ip_address: { find: ip, dns_name: "gitlab.{{ domain }}" }
  ip_prefix: { find: prefix_length, dns_name: "gitlab.{{ domain }}" }
