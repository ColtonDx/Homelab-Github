---
# Semaphore task template Uptime Kuma | Inventory Sync; see semaphore/README.md for the project resources it names
name: Uptime Kuma | Inventory Sync
description: 'Keeps Uptime Kuma in step with the inventory: adds or updates a monitor for every host with kuma_monitor; meant to run on a schedule, and never deletes monitors'
app: ansible
playbook: ansible/playbooks/uptime-kuma/inventory-sync.yaml
repository: Github-Homelab
inventory: Gitlab Ansible Inventory
environments:
  - Hashicorp Secrets
survey_vars:
  - name: sync_group
    title: Default group
    description: Kuma group for hosts with no kuma_monitor_group or entry group; empty for none
