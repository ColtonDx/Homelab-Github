---
# Semaphore task template TLS | Renew Certificates; see semaphore/README.md for the project resources it names
name: TLS | Renew Certificates
description: Renews the acme.sh certificates that expire within acme_renew_days, or all with acme_force; each service's app playbook issues them first
app: ansible
playbook: ansible/playbooks/tls/renew-certificates.yaml
repository: Github-Homelab
inventory: Gitlab Ansible Inventory
environments:
  - Empty
survey_vars:
  - name: target_hosts
    title: Hosts
    type: enum
    required: true
    default_value: acme
    values:
      - name: All ACME hosts
        value: acme
      - name: 'Host: gitlab'
        value: gitlab
      - name: 'Host: kasm'
        value: kasm
      - name: 'Host: hashicorp-vault'
        value: hashicorp-vault
  - name: acme_force
    title: Force renewal
    description: Renew now whatever the expiry; counts toward Let's Encrypt's limit of 5 identical certificates a week
    type: enum
    required: true
    default_value: 'false'
    values:
      - name: 'No'
        value: 'false'
      - name: 'Yes'
        value: 'true'
  - name: acme_renew_days
    title: Renew within days
    description: Renew certificates that expire within this many days (default 30)
    type: int
    default_value: '30'
