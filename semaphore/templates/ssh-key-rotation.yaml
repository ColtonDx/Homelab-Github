---
# Semaphore task template SSH Key Rotation; see docs/semaphore/templates.md for the project resources it names
# Keys come only from the inventory (ssh_public_key_<user>), so there is no field to paste one in
name: SSH Key Rotation
app: ansible
playbook: ansible/playbooks/maintenance/rotate-ssh-keys.yaml
repository: Github-Homelab
inventory: Gitlab Ansible Inventory
environments:
  - Hashicorp Secrets
survey_vars:
  - name: target_user
    title: User
    type: enum
    required: true
    values:
      - name: admin
        value: admin
      - name: ansible
        value: ansible
