---
# Semaphore task template Uptime Kuma | GitOps + Socket Proxy; see semaphore/README.md for the project resources it names
name: Uptime Kuma | GitOps + Socket Proxy
description: The Uptime Kuma GitOps sync, plus the read-only Docker socket proxy on the docker group hosts over SSH; run when a Docker host is added
app: ansible
playbook: ansible/playbooks/uptime-kuma/sync-monitors.yaml
repository: Github-Homelab
inventory: Gitlab Ansible Inventory
environments:
  - Hashicorp Secrets
arguments:
  - -e
  - deploy_socket_proxy=true
