---
# Semaphore task template OPNsense | Reserve IP; see docs/semaphore/templates.md for the project resources it names
name: OPNsense | Reserve IP
description: Writes a Dnsmasq DHCP reservation and DNS record in OPNsense for each named inventory host that sets dnsmasq_reservation, plus a wildcard DNS record per domain in its dnsmasq_wildcards; re-runs update the records in place
app: ansible
playbook: ansible/playbooks/opnsense/dnsmasq-reserve-ip.yaml
repository: Github-Homelab
inventory: Gitlab Ansible Inventory
# A task may run another branch, for check-mode runs of a PR before merge; real runs use main
allow_override_branch_in_task: true
environments:
  - Hashicorp Secrets
survey_vars:
  - name: reserve_hosts
    title: Hosts
    description: Inventory host names to reserve, comma-separated; each needs dnsmasq_reservation or dnsmasq_wildcards in the inventory
    required: true
