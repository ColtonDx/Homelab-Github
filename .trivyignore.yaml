# Accepted trivy config findings, each limited to the files it covers and with the reason it is accepted
# The same finding anywhere else still fails CI
misconfigurations:
  # Flux's own install manifest, generated by flux bootstrap: its controllers apply everything in the cluster, so they need these rights.
  # Editing the generated file would be overwritten; what Flux applies is controlled by verifying the commits it pulls instead
  - id: KSV-0046
    paths: ["kubernetes/clusters/talos-cluster/flux-system/gotk-components.yaml"]
  - id: KSV-0041
    paths: ["kubernetes/clusters/talos-cluster/flux-system/gotk-components.yaml"]
