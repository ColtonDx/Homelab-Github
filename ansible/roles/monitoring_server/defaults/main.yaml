---
# Folder holding the Compose project and every service's configuration
monitoring_server_dir: /opt/monitoring

# Image versions, pinned so upgrades are deliberate changes
monitoring_server_grafana_version: "13.3.1"
monitoring_server_loki_version: "3.7.10"
monitoring_server_prometheus_version: "v3.16.0"
monitoring_server_alloy_version: "v1.22.0"
monitoring_server_pve_exporter_version: "3.12.0"
# nginx for the gateway in front of Loki and Prometheus, pinned by digest
monitoring_server_gateway_image: "nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94"

# How long logs and metrics are kept
monitoring_server_retention_days: 30

# Name Grafana is served at over HTTPS, using the certificate installed in monitoring_server_tls_dir; empty serves plain HTTP
monitoring_server_grafana_domain: ""
# Folder holding Grafana's certificate (tls.crt) and key (tls.key), mounted read-only into the container
monitoring_server_tls_dir: "{{ monitoring_server_dir }}/tls"

# Published ports; Grafana moves to 443 when it serves HTTPS, and clients push logs to Loki and metrics to Prometheus's remote-write receiver
monitoring_server_grafana_port: "{{ 443 if monitoring_server_grafana_domain | length > 0 else 3000 }}"
monitoring_server_loki_port: 3100
monitoring_server_prometheus_port: 9090

# With a Grafana domain, Loki and Prometheus are reachable only through a gateway on those same ports, over HTTPS with Grafana's certificate
# and basic auth: user "push" may only send metrics and logs, user "read" may only query. Grafana itself reads them inside the stack.
# The passwords come from Vault (app-monitoring.yaml loads MONITORING_PUSH_PASSWORD and MONITORING_READ_PASSWORD)
monitoring_server_gateway: "{{ monitoring_server_grafana_domain | length > 0 }}"
monitoring_server_push_password: ""
monitoring_server_read_password: ""

# Grafana's first administrator; the password comes from Vault and only takes effect on the first start, after which it lives in Grafana's database
monitoring_server_grafana_admin_user: admin

# Syslog listeners for devices that can't run an agent: most network gear sends RFC 3164 over UDP 514, and RFC 5424 senders use 5514
monitoring_server_syslog_listeners:
  - { port: 514, protocol: udp, format: rfc3164 }
  - { port: 5514, protocol: udp, format: rfc5424 }
  - { port: 5514, protocol: tcp, format: rfc5424 }

# Extra Prometheus scrape jobs for services outside the stack, each {name, targets, metrics_path (default /metrics), scheme (default http)}
# A job that needs a bearer token also sets vault_path and vault_field; app-monitoring.yaml loads the token into monitoring_server_scrape_tokens[name]
monitoring_server_scrape_jobs: []

# Proxmox VE node addresses; when set, a Proxmox exporter reports CPU, memory, disk and network for every node and guest
# Needs a read-only (PVEAuditor) API token, loaded by app-monitoring.yaml into monitoring_server_pve_token_id (user@realm!name) and monitoring_server_pve_token_secret
# Cluster-wide and guest metrics come from the first address, node metrics from each
monitoring_server_pve_targets: []
# Check the nodes' certificates; turn off only for nodes on Proxmox's self-signed certificate
monitoring_server_pve_verify_ssl: true
