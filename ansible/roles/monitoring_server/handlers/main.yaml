---
# Restarts only the services whose configuration changed; each is notified by its own template
# Plain docker compose commands, so the role needs no collection beyond ansible-core
- name: Restart grafana
  ansible.builtin.command:
    argv: [docker, compose, restart, grafana]
    chdir: "{{ monitoring_server_dir }}"
  changed_when: true

- name: Restart loki
  ansible.builtin.command:
    argv: [docker, compose, restart, loki]
    chdir: "{{ monitoring_server_dir }}"
  changed_when: true

- name: Restart prometheus
  ansible.builtin.command:
    argv: [docker, compose, restart, prometheus]
    chdir: "{{ monitoring_server_dir }}"
  changed_when: true

- name: Restart alloy
  ansible.builtin.command:
    argv: [docker, compose, restart, alloy]
    chdir: "{{ monitoring_server_dir }}"
  changed_when: true

# Reloads the gateway's routes, credentials or certificate
- name: Restart gateway
  ansible.builtin.command:
    argv: [docker, compose, restart, gateway]
    chdir: "{{ monitoring_server_dir }}"
  changed_when: true
