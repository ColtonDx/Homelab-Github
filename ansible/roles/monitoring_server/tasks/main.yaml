---
# Fail before changing anything when a secret the stack needs is missing
- name: Check the secrets are loaded
  ansible.builtin.assert:
    that:
      - monitoring_server_grafana_admin_password | default('') | length > 0
      - monitoring_server_discord_webhook_url | default('') | length > 0
      - monitoring_server_scrape_jobs | selectattr('vault_path', 'defined') | map(attribute='name')
        | reject('in', monitoring_server_scrape_tokens | default({})) | list | length == 0
      - monitoring_server_pve_targets | length == 0 or '!' in monitoring_server_pve_token_id | default('')
      - monitoring_server_pve_targets | length == 0 or monitoring_server_pve_token_secret | default('') | length > 0
      - not monitoring_server_gateway | bool or (monitoring_server_push_password | length > 0 and monitoring_server_read_password | length > 0)
      - monitoring_server_opnsense_address | length == 0
        or (monitoring_server_opnsense_api_key | default('') | length > 0 and monitoring_server_opnsense_api_secret | default('') | length > 0)
      - not monitoring_server_geoip | bool
        or (monitoring_server_maxmind_account_id | default('') | string | length > 0 and monitoring_server_maxmind_license_key | default('') | length > 0)
    fail_msg: >-
      Load monitoring_server_grafana_admin_password, monitoring_server_discord_webhook_url, each scrape job's token, with Proxmox targets the Proxmox token id
      (user@realm!name) and secret, with the gateway the push and read passwords, with an OPNsense address its API key and secret, and with GeoIP the
      MaxMind account ID and license key (from Vault) before applying this role."
    quiet: true

# The country label is only added on the WAN interfaces, so GeoIP without them would download a database nothing uses
- name: Check the WAN interfaces are set for GeoIP
  ansible.builtin.assert:
    that: monitoring_server_filterlog_wan_interfaces | length > 0
    fail_msg: "Set monitoring_server_filterlog_wan_interfaces to the firewall's WAN interface names when monitoring_server_geoip is on."
    quiet: true
  when: monitoring_server_geoip | bool

# Grafana won't start over HTTPS without its certificate, so stop here rather than leave it restarting
- name: Check Grafana's certificate is installed
  ansible.builtin.stat:
    path: "{{ monitoring_server_tls_dir }}/{{ item }}"
  register: monitoring_server_tls_files
  loop: [tls.crt, tls.key]
  when: monitoring_server_grafana_domain | length > 0

- name: Fail when the certificate is missing
  ansible.builtin.assert:
    that: monitoring_server_tls_files.results | selectattr('stat.exists') | list | length == 2
    fail_msg: "Install tls.crt and tls.key in {{ monitoring_server_tls_dir }} before serving Grafana as {{ monitoring_server_grafana_domain }}; app-monitoring.yaml issues them with ACME."
    quiet: true
  when: monitoring_server_grafana_domain | length > 0 and not ansible_check_mode

# Compose project folder with one subfolder per service's configuration; data lives in named volumes
- name: Create the configuration folders
  ansible.builtin.file:
    path: "{{ monitoring_server_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: ["", loki, prometheus, alloy, grafana, grafana/datasources, grafana/alerting, gateway, geoip]

# Secrets for the containers, readable by root only; a change recreates Grafana at the compose step, since a restart would keep the old values
- name: Write the environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ monitoring_server_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

# The Proxmox exporter's token, kept in its own file so only that container sees it; a change recreates it at the compose step
- name: Write the Proxmox exporter's environment file
  ansible.builtin.template:
    src: pve.env.j2
    dest: "{{ monitoring_server_dir }}/pve.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: monitoring_server_pve_targets | length > 0

# The OPNsense exporter's API key and secret, kept in their own file so only that container sees them
- name: Write the OPNsense exporter's environment file
  ansible.builtin.template:
    src: opnsense.env.j2
    dest: "{{ monitoring_server_dir }}/opnsense.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: monitoring_server_opnsense_address | length > 0

# The MaxMind account the GeoIP updater downloads with
- name: Write the GeoIP updater's environment file
  ansible.builtin.template:
    src: geoip.env.j2
    dest: "{{ monitoring_server_dir }}/geoip.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: monitoring_server_geoip | bool

- name: Write the Compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ monitoring_server_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Write Loki's configuration
  ansible.builtin.template:
    src: loki.yaml.j2
    dest: "{{ monitoring_server_dir }}/loki/config.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart loki

# Bearer tokens for extra scrape jobs, one file each, readable by Prometheus (uid 65534) and kept out of its configuration file
- name: Create the scrape token folder
  ansible.builtin.file:
    path: "{{ monitoring_server_dir }}/prometheus/tokens"
    state: directory
    owner: root
    group: "65534"
    mode: "0750"

- name: Write the scrape tokens
  ansible.builtin.copy:
    content: "{{ monitoring_server_scrape_tokens[item.name] }}"
    dest: "{{ monitoring_server_dir }}/prometheus/tokens/{{ item.name }}"
    owner: root
    group: "65534"
    mode: "0640"
  loop: "{{ monitoring_server_scrape_jobs | selectattr('vault_path', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Write Prometheus's configuration
  ansible.builtin.template:
    src: prometheus.yaml.j2
    dest: "{{ monitoring_server_dir }}/prometheus/prometheus.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart prometheus

# Alloy here only receives syslog from devices that can't run an agent, and forwards it to Loki
- name: Write the syslog receiver's configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: "{{ monitoring_server_dir }}/alloy/config.alloy"
    owner: root
    group: root
    mode: "0644"
  notify: Restart alloy

# Data sources are provisioned, so Grafana is rebuilt from code with no clicking
# The gateway's routes and credentials; readable by root only, since it holds both passwords
- name: Write the gateway's configuration
  ansible.builtin.template:
    src: gateway.conf.j2
    dest: "{{ monitoring_server_dir }}/gateway/gateway.conf"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart gateway
  when: monitoring_server_gateway | bool

# Grafana reads Loki and Prometheus inside the stack, so it needs no gateway credentials
- name: Write Grafana's data sources
  ansible.builtin.template:
    src: grafana/datasources.yaml.j2
    dest: "{{ monitoring_server_dir }}/grafana/datasources/datasources.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart grafana

# The Discord contact point and default policy; the webhook comes from the environment file, not this file
- name: Write Grafana's alert routing
  ansible.builtin.template:
    src: grafana/alerting.yaml.j2
    dest: "{{ monitoring_server_dir }}/grafana/alerting/alerting.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart grafana

# Host, disk, scrape, journal and SSH alert rules, sent through the Discord route above
- name: Write Grafana's alert rules
  ansible.builtin.template:
    src: grafana/alert-rules.yaml.j2
    dest: "{{ monitoring_server_dir }}/grafana/alerting/alert-rules.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart grafana

# Alloy cannot start its GeoIP stage without the database, so the first download happens before the stack starts
- name: Download the GeoIP database
  ansible.builtin.command:
    argv: [docker, compose, run, --rm, geoipupdate]
    chdir: "{{ monitoring_server_dir }}"
    creates: "{{ monitoring_server_dir }}/geoip/GeoLite2-City.mmdb"
  when: monitoring_server_geoip | bool and not ansible_check_mode

# Weekly refresh: downloads a newer database if there is one and restarts Alloy only when the file changed, since Alloy reads it at start.
# A failed refresh leaves a failed systemd unit, which the failed-unit alert reports
- name: Install the GeoIP refresh service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [monitoring-geoip-update.service, monitoring-geoip-update.timer]
  when: monitoring_server_geoip | bool

- name: Enable the GeoIP refresh timer
  ansible.builtin.systemd_service:
    name: monitoring-geoip-update.timer
    enabled: true
    state: started
    daemon_reload: true
  when: monitoring_server_geoip | bool

# Pulls missing images and starts or recreates any service whose Compose definition changed; reports a change only when a container was created or started
- name: Start the monitoring stack
  ansible.builtin.command:
    argv: [docker, compose, up, --detach, --remove-orphans]
    chdir: "{{ monitoring_server_dir }}"
  register: monitoring_server_up
  changed_when: monitoring_server_up.stderr is search('Creat|Recreat|Start|Remov')
  when: not ansible_check_mode

# Apply any configuration change before the readiness checks
- name: Apply changed configuration
  ansible.builtin.meta: flush_handlers

# Fails the run if a service does not come up, rather than leaving it broken unnoticed
- name: Wait for each service to report ready
  ansible.builtin.uri:
    url: "{{ item.scheme | default('http') }}://127.0.0.1:{{ item.port }}{{ item.path }}"
    status_code: 200
    # Grafana's certificate names its domain, not the loopback address checked here
    validate_certs: false
    # Behind the gateway, Loki and Prometheus answer only the read user
    url_username: "{{ 'read' if item.gateway | default(false) else omit }}"
    url_password: "{{ monitoring_server_read_password if item.gateway | default(false) else omit }}"
    force_basic_auth: "{{ item.gateway | default(false) }}"
  register: monitoring_server_ready
  until: monitoring_server_ready.status == 200
  retries: 30
  delay: 5
  loop:
    - { port: "{{ monitoring_server_grafana_port }}", path: /api/health, scheme: "{{ 'https' if monitoring_server_grafana_domain else 'http' }}" }
    - { port: "{{ monitoring_server_loki_port }}", path: /ready, scheme: "{{ 'https' if monitoring_server_gateway | bool else 'http' }}",
        gateway: "{{ monitoring_server_gateway | bool }}" }
    - { port: "{{ monitoring_server_prometheus_port }}", path: /-/ready, scheme: "{{ 'https' if monitoring_server_gateway | bool else 'http' }}",
        gateway: "{{ monitoring_server_gateway | bool }}" }
  loop_control:
    label: "{{ item.path }} on {{ item.port }}"
  when: not ansible_check_mode
