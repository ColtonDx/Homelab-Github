# SSH client settings for old network gear (e.g. FastIron 08.0.30) that only offers the 1024-bit diffie-hellman-group1-sha1
# key exchange and ssh-rsa host keys; read by the libssh connection only for hosts with network_legacy_kex: true
Host *
  KexAlgorithms +diffie-hellman-group1-sha1
  HostKeyAlgorithms +ssh-rsa
