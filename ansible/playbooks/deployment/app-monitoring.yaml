---
# Installs Docker and the central monitoring stack (Grafana, Loki, Prometheus and a syslog receiver) on a dedicated VM; safe to re-run
# Vault: GRAFANA_ADMIN_PASSWORD at monitoring and DISCORD_WEBHOOK_URL at discord (vault_monitoring_path and vault_discord_path rename them); connection from VAULT_ADDR, VAULT_TOKEN and VAULT_KV_MOUNT
# Inventory: hosts in monitoring_servers (or target_hosts); every setting is in ansible/roles/monitoring_server/defaults/main.yaml
- name: Install the monitoring stack
  hosts: "{{ target_hosts | default('monitoring_servers') }}"
  become: true
  gather_facts: true

  vars:
    vault_secrets:
      - path: "{{ vault_monitoring_path | default('monitoring') }}"
        field: GRAFANA_ADMIN_PASSWORD
        var: monitoring_server_grafana_admin_password
      - path: "{{ vault_discord_path | default('discord') }}"
        field: DISCORD_WEBHOOK_URL
        var: monitoring_server_discord_webhook_url

  pre_tasks:
    # Grafana's first password and the Discord webhook for alerts
    - name: Load Vault secrets
      ansible.builtin.include_tasks: ../../tasks/var_lookup.yaml

    - name: Install Docker
      ansible.builtin.include_tasks: ../../tasks/docker_install.yaml

  roles:
    # Settings live in the role's defaults, so inventory values always win over them
    # A path rather than a name, so the role resolves however Semaphore or build-project.yaml starts the run
    - role: ../../roles/monitoring_server  # noqa: role-name[path]
