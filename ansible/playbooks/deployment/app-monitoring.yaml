---
# Installs Docker and the central monitoring stack (Grafana, Loki, Prometheus and a syslog receiver) on a dedicated VM; safe to re-run
# Vault: GRAFANA_ADMIN_PASSWORD at grafana and DISCORD_WEBHOOK_URL at discord (vault_grafana_path and vault_discord_path rename them); connection from VAULT_ADDR, VAULT_TOKEN and VAULT_KV_MOUNT
# Inventory: hosts in monitoring_servers (or target_hosts); every setting is in ansible/roles/monitoring_server/defaults/main.yaml
# With a Grafana domain: MONITORING_PUSH_PASSWORD and MONITORING_READ_PASSWORD at monitoring (vault_monitoring_path renames it) for the Loki/Prometheus gateway
# Proxmox metrics: set monitoring_server_pve_targets; needs PROXMOX_GRAFANA_TOKEN_ID and PROXMOX_GRAFANA_TOKEN_SECRET (a read-only PVEAuditor token) at proxmox
# OPNsense metrics: set monitoring_server_opnsense_address; needs grafana/API_KEY and grafana/API_SECRET (a read-only API user) at opnsense
# GeoIP for firewall logs: set monitoring_server_geoip; needs MAXMIND_ACCOUNT_ID and MAXMIND_LICENSE_KEY at maxmind
# Extra scrape jobs (monitoring_server_scrape_jobs) can name a bearer token by vault_path and vault_field
# HTTPS: set monitoring_server_grafana_domain and this issues Grafana's certificate with ACME, which also needs CF_API and CF_EMAIL at cloudflare
- name: Install the monitoring stack
  hosts: "{{ target_hosts | default('monitoring_servers') }}"
  become: true
  gather_facts: true

  vars:
    # The Cloudflare credentials for the certificate's DNS challenge are only read when Grafana serves HTTPS
    vault_secrets: >-
      {{ monitoring_vault_secrets
         + (monitoring_acme_secrets + monitoring_gateway_secrets if monitoring_server_grafana_domain | default('') | length > 0 else [])
         + (monitoring_pve_secrets if monitoring_server_pve_targets | default([]) | length > 0 else [])
         + (monitoring_opnsense_secrets if monitoring_server_opnsense_address | default('') | length > 0 else [])
         + (monitoring_maxmind_secrets if monitoring_server_geoip | default(false) | bool else [])
         + monitoring_scrape_secrets | default([]) }}
    monitoring_pve_secrets:
      - path: "{{ vault_proxmox_path | default('proxmox') }}"
        field: PROXMOX_GRAFANA_TOKEN_ID
        var: monitoring_server_pve_token_id
      - path: "{{ vault_proxmox_path | default('proxmox') }}"
        field: PROXMOX_GRAFANA_TOKEN_SECRET
        var: monitoring_server_pve_token_secret
    # A separate read-only OPNsense API user for the exporter, not the automation user
    monitoring_opnsense_secrets:
      - path: "{{ vault_opnsense_path | default('opnsense') }}"
        field: grafana/API_KEY
        var: monitoring_server_opnsense_api_key
      - path: "{{ vault_opnsense_path | default('opnsense') }}"
        field: grafana/API_SECRET
        var: monitoring_server_opnsense_api_secret
    monitoring_maxmind_secrets:
      - path: "{{ vault_maxmind_path | default('maxmind') }}"
        field: MAXMIND_ACCOUNT_ID
        var: monitoring_server_maxmind_account_id
      - path: "{{ vault_maxmind_path | default('maxmind') }}"
        field: MAXMIND_LICENSE_KEY
        var: monitoring_server_maxmind_license_key
    monitoring_vault_secrets:
      - path: "{{ vault_grafana_path | default('grafana') }}"
        field: GRAFANA_ADMIN_PASSWORD
        var: monitoring_server_grafana_admin_password
      - path: "{{ vault_discord_path | default('discord') }}"
        field: DISCORD_WEBHOOK_URL
        var: monitoring_server_discord_webhook_url
    # The gateway's push and read passwords, needed whenever Grafana has a domain (the gateway then fronts Loki and Prometheus)
    monitoring_gateway_secrets:
      - path: "{{ vault_monitoring_path | default('monitoring') }}"
        field: MONITORING_PUSH_PASSWORD
        var: monitoring_server_push_password
      - path: "{{ vault_monitoring_path | default('monitoring') }}"
        field: MONITORING_READ_PASSWORD
        var: monitoring_server_read_password
    monitoring_acme_secrets:
      - path: "{{ vault_cloudflare_path | default('cloudflare') }}"
        field: CF_API
        var: cloudflare_api_token
      - path: "{{ vault_cloudflare_path | default('cloudflare') }}"
        field: CF_EMAIL
        var: acme_email
    monitoring_tls_dir: "{{ monitoring_server_tls_dir | default(monitoring_dir ~ '/tls') }}"
    monitoring_dir: "{{ monitoring_server_dir | default('/opt/monitoring') }}"

  pre_tasks:
    # Scrape jobs that name a Vault token add it to the secrets loaded below, as monitoring_scrape_token_<job name>
    - name: List the scrape job tokens to load
      ansible.builtin.set_fact:
        monitoring_scrape_secrets: "{{ monitoring_scrape_secrets | default([]) + [{'path': item.vault_path, 'field': item.vault_field, 'var': 'monitoring_scrape_token_' ~ item.name}] }}"
      loop: "{{ monitoring_server_scrape_jobs | default([]) | selectattr('vault_path', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"

    # Grafana's first password, the Discord webhook for alerts, and any scrape tokens
    - name: Load Vault secrets
      ansible.builtin.include_tasks: ../../tasks/var_lookup.yaml

    # The role takes the tokens as one map keyed by job name
    - name: Collect the scrape tokens
      ansible.builtin.set_fact:
        monitoring_server_scrape_tokens: "{{ monitoring_server_scrape_tokens | default({}) | combine({item.name: lookup('ansible.builtin.vars', 'monitoring_scrape_token_' ~ item.name)}) }}"
      loop: "{{ monitoring_server_scrape_jobs | default([]) | selectattr('vault_path', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Install Docker
      ansible.builtin.include_tasks: ../../tasks/docker_install.yaml

    # Issued before the stack starts, since Grafana needs it to serve HTTPS; Grafana runs as uid 472, so each install hands it the files,
    # and renewals restart Grafana and the gateway once the stack exists (renew-certificates.yaml and acme.sh's cron reuse this command);
    # the service list is piped to xargs rather than substituted with $(...), which the shell would expand before acme.sh stores the command
    - name: Issue and install Grafana's certificate
      ansible.builtin.include_tasks: ../tls/tasks/issue_certificate.yaml
      vars:
        acme_domain: "{{ monitoring_server_grafana_domain }}"
        acme_ssl_dir: "{{ monitoring_tls_dir }}"
        acme_key_path: "{{ monitoring_tls_dir }}/tls.key"
        acme_fullchain_path: "{{ monitoring_tls_dir }}/tls.crt"
        acme_reloadcmd: >-
          chown 472:0 {{ monitoring_tls_dir }}/tls.key {{ monitoring_tls_dir }}/tls.crt
          && chmod 0600 {{ monitoring_tls_dir }}/tls.key
          && (test ! -f {{ monitoring_dir }}/compose.yaml || docker compose --project-directory {{ monitoring_dir }} ps --services | grep -xE 'grafana|gateway' | xargs -r docker compose --project-directory {{ monitoring_dir }} restart)
        acme_ssl_owner: "472"
        acme_ssl_group: root
      when: monitoring_server_grafana_domain | default('') | length > 0

  roles:
    # Settings live in the role's defaults, so inventory values always win over them
    # A path rather than a name, so the role resolves however Semaphore or build-project.yaml starts the run
    - role: ../../roles/monitoring_server  # noqa: role-name[path]
