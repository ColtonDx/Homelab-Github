---
# Installs Docker and GitLab Runner on a dedicated VM and connects the runner to GitLab with a runner authentication token
# The token (glrt-...) is created in GitLab under the group or project's Build > Runners > New runner, then stored in Vault
# Vault: GITLAB_RUNNER_TOKEN at gitlab-runner (gitlab_runner_vault_path and gitlab_runner_vault_field rename them); connection from VAULT_ADDR, VAULT_TOKEN and VAULT_KV_MOUNT
# Inventory: hosts in gitlab_runners (or target_hosts), gitlab_runner_url (required, GitLab's address); every other setting is in ansible/roles/gitlab_runner/defaults/main.yaml
- name: Install and configure GitLab Runner
  hosts: "{{ target_hosts | default('gitlab_runners') }}"
  become: true
  gather_facts: true

  vars:
    vault_secrets:
      - path: "{{ gitlab_runner_vault_path | default('gitlab-runner') }}"
        field: "{{ gitlab_runner_vault_field | default('GITLAB_RUNNER_TOKEN') }}"
        var: gitlab_runner_token

  pre_tasks:
    # Fail before changing anything when GitLab's address is missing
    - name: Check GitLab's address is set
      ansible.builtin.assert:
        that:
          - gitlab_runner_url | default('') | length > 0
        fail_msg: "Set gitlab_runner_url in the inventory to GitLab's address, e.g. https://gitlab.example.com."

    # The runner authentication token
    - name: Load Vault secrets
      ansible.builtin.include_tasks: ../../tasks/var_lookup.yaml

  roles:
    # Settings live in the role's defaults, so inventory values always win over them
    # A path rather than a name, so the role resolves however Semaphore or build-project.yaml starts the run
    - role: ../../roles/gitlab_runner  # noqa: role-name[path]
