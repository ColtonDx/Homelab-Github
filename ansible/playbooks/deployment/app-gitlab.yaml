---
# Installs GitLab from GitLab's apt repository, or updates it to gitlab_version, starts it, then issues its certificate and switches it to HTTPS; safe to re-run
# Inventory: gitlab_domain (required), gitlab_edition (ce or ee, default ce), gitlab_version (e.g. 18.4.1) to install or move to that release
# Without gitlab_version an installed GitLab is left alone; upgrades must follow GitLab's upgrade path, so step through its required stops
# The certificate needs the Vault connection and Vault fields CF_API and CF_EMAIL at cloudflare; gitlab_rb_path and gitlab_ssl_dir override the default locations
# The first install writes a random root password to /etc/gitlab/initial_root_password, which GitLab deletes after 24 hours
- name: Install GitLab on Debian/Ubuntu
  hosts: gitlab
  become: true
  gather_facts: true

  vars:
    # A separate name, so gitlab_edition can come from the inventory without recursing
    gitlab_ed: "{{ gitlab_edition | default('ce') }}"
    gitlab_pkg_name: "gitlab-{{ gitlab_ed }}"
    gitlab_keyring_path: /etc/apt/keyrings/gitlab.asc
    gitlab_repo_filename: "gitlab_{{ gitlab_ed }}"
    gitlab_wait_host: "127.0.0.1"
    gitlab_wait_port: 80

  pre_tasks:
    # The apt repository and package steps below only work on Debian-family hosts
    - name: Validate supported OS family
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
        fail_msg: "This playbook supports Debian/Ubuntu hosts only."

    # Stop before installing anything when the inputs are missing or wrong
    - name: Validate the GitLab inputs
      ansible.builtin.assert:
        that:
          - gitlab_ed in ["ce", "ee"]
          - gitlab_domain | default('') | length > 0
        fail_msg: "gitlab_domain must be set, and gitlab_edition must be either 'ce' or 'ee'."

  tasks:
    # Packages GitLab's installer expects to find
    - name: Install GitLab prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, openssh-server, tzdata, perl]
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Holds the repository signing key referenced by the source entry
    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    # Downloaded once; force: false keeps re-runs from fetching it again
    - name: Add GitLab repository signing key
      ansible.builtin.get_url:
        url: "https://packages.gitlab.com/gitlab/gitlab-{{ gitlab_ed }}/gpgkey"
        dest: "{{ gitlab_keyring_path }}"
        mode: "0644"
        force: false

    # Refreshes the package cache only when the source entry is added or changes
    - name: Add GitLab apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by={{ gitlab_keyring_path }}]
          https://packages.gitlab.com/gitlab/gitlab-{{ gitlab_ed }}/{{ ansible_facts.distribution | lower }}/
          {{ ansible_facts.distribution_release }} main
        filename: "{{ gitlab_repo_filename }}"
        state: present
        update_cache: true

    # A pinned version installs or upgrades to exactly that release, and GitLab backs up its database first; without one an installed version is left alone
    - name: Install GitLab package
      ansible.builtin.apt:
        name: "{{ gitlab_pkg_name ~ '=' ~ gitlab_version ~ '-' ~ gitlab_ed ~ '.0' if gitlab_version | default('') | length > 0 else gitlab_pkg_name }}"
        state: present

    # A fresh host needs a URL before GitLab can start; once the HTTPS play below has run, it owns the URL
    - name: Check whether the URL is already managed
      ansible.builtin.command: grep -q "BEGIN ANSIBLE MANAGED URL AND TLS CONFIG" {{ gitlab_rb_path | default('/etc/gitlab/gitlab.rb') }}
      register: gitlab_url_managed
      changed_when: false
      failed_when: gitlab_url_managed.rc not in [0, 1]

    # An existing certificate means the HTTPS play below will write HTTPS, so install must not write HTTP over it
    - name: Check whether a GitLab certificate exists
      ansible.builtin.stat:
        path: "{{ gitlab_ssl_dir | default('/etc/gitlab/ssl') }}/{{ gitlab_domain }}.crt"
      register: gitlab_install_cert

    # Plain HTTP only on a fresh host; the HTTPS play below replaces it at the end of this run
    - name: Set the initial HTTP URL on a fresh host
      ansible.builtin.blockinfile:
        path: "{{ gitlab_rb_path | default('/etc/gitlab/gitlab.rb') }}"
        marker: "# {mark} ANSIBLE MANAGED URL AND TLS CONFIG"
        block: |
          external_url "http://{{ gitlab_domain }}"
      when:
        - gitlab_url_managed.rc == 1
        - not gitlab_install_cert.stat.exists
      notify: Reconfigure GitLab

    # Apply the configuration now so the service checks below see the configured GitLab
    - name: Flush handlers to apply config before service checks
      ansible.builtin.meta: flush_handlers

    # GitLab's services all run under runsvdir
    - name: Ensure GitLab service is enabled and running
      ansible.builtin.service:
        name: gitlab-runsvdir
        enabled: true
        state: started

    # Reconfigure can take minutes, so wait for the web server before finishing
    - name: Wait for GitLab local endpoint
      ansible.builtin.wait_for:
        host: "{{ gitlab_wait_host }}"
        port: "{{ gitlab_wait_port }}"
        timeout: 300

  handlers:
    # Applies gitlab.rb changes; runs at most once per flush however many tasks changed the file
    - name: Reconfigure GitLab
      ansible.builtin.command: gitlab-ctl reconfigure
      changed_when: true

# Finish the install on HTTPS: issue the certificate, then point gitlab.rb at it; renewals are tls/renew-certificates.yaml's job
- name: Switch GitLab to HTTPS
  hosts: gitlab
  become: true
  gather_facts: true

  vars:
    vault_secrets:
      - path: "{{ vault_cloudflare_path | default('cloudflare') }}"
        field: CF_API
        var: cloudflare_api_token
      - path: "{{ vault_cloudflare_path | default('cloudflare') }}"
        field: CF_EMAIL
        var: acme_email

  tasks:
    # The Cloudflare credentials the DNS challenge needs
    - name: Load Vault secrets
      ansible.builtin.include_tasks: ../../tasks/var_lookup.yaml

    # One place for every path, so the certificate lands where the URL block points
    - name: Set GitLab config and certificate paths
      ansible.builtin.set_fact:
        gitlab_rb_file: "{{ gitlab_rb_path | default('/etc/gitlab/gitlab.rb') }}"
        gitlab_cert_file: "{{ gitlab_ssl_dir | default('/etc/gitlab/ssl') }}/{{ gitlab_domain }}.crt"
        gitlab_key_file: "{{ gitlab_ssl_dir | default('/etc/gitlab/ssl') }}/{{ gitlab_domain }}.key"

    # Installed at the paths the URL block expects; every renewal reloads nginx only, so GitLab stays up
    - name: Issue and install GitLab's certificate
      ansible.builtin.include_tasks: ../tls/tasks/issue_certificate.yaml
      vars:
        acme_domain: "{{ gitlab_domain }}"
        acme_ssl_dir: "{{ gitlab_ssl_dir | default('/etc/gitlab/ssl') }}"
        acme_key_path: "{{ gitlab_key_file }}"
        acme_fullchain_path: "{{ gitlab_cert_file }}"
        acme_reloadcmd: "gitlab-ctl hup nginx"

    # Earlier versions wrote TLS settings in a separate block, which the managed block below replaces
    - name: Remove the TLS block written by earlier versions
      ansible.builtin.blockinfile:
        path: "{{ gitlab_rb_file }}"
        marker: "# {mark} ANSIBLE MANAGED SSL CONFIG"
        state: absent
      notify: Reconfigure GitLab

    # This play owns the URL once it has run; written at the end of gitlab.rb so it overrides any earlier external_url
    - name: Point GitLab at the certificate
      ansible.builtin.blockinfile:
        path: "{{ gitlab_rb_file }}"
        marker: "# {mark} ANSIBLE MANAGED URL AND TLS CONFIG"
        block: |
          external_url "https://{{ gitlab_domain }}"
          letsencrypt['enable'] = false
          nginx['ssl_certificate'] = "{{ gitlab_cert_file }}"
          nginx['ssl_certificate_key'] = "{{ gitlab_key_file }}"
      notify: Reconfigure GitLab

    # Comment out any other external_url so gitlab.rb has exactly one; the before match keeps the managed block untouched
    - name: Disable external_url lines outside the managed block
      ansible.builtin.replace:
        path: "{{ gitlab_rb_file }}"
        regexp: '^(external_url\s.*)$'
        replace: '# \1  # superseded by the managed block below'
        before: "# BEGIN ANSIBLE MANAGED URL AND TLS CONFIG"
      notify: Reconfigure GitLab

  handlers:
    # Applies gitlab.rb changes; runs once at the end of the play if anything changed
    - name: Reconfigure GitLab
      ansible.builtin.command: gitlab-ctl reconfigure
      changed_when: true
