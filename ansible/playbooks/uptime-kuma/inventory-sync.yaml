---
# Keeps Uptime Kuma in step with the inventory: adds or updates a monitor for every host with a kuma_monitor variable; meant to run on a schedule, and covers hosts no install playbook does, such as the firewall, NAS and hypervisors
# The forms kuma_monitor takes and its defaults are in host_monitors.yaml; each entry's fields are in add_monitors.yaml
# Hosts with no group set get none, unless sync_group names one
# Monitors are matched by name, so re-runs update them; a host whose kuma_monitor is removed keeps its monitor until it is deleted in Kuma
# Connection and Vault settings are in connect.yaml
- name: Sync Uptime Kuma monitors from the inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    kuma_default_group: "{{ sync_group | default('') }}"

  tasks:
    # Every host in the inventory, filtered to the ones with kuma_monitor
    - name: Work out the inventory's monitors
      ansible.builtin.include_tasks: host_monitors.yaml
      vars:
        kuma_hosts: "{{ groups['all'] }}"

    # A sync with nothing to do is almost always a missing inventory change, so it says so instead of passing silently
    - name: Require at least one monitor
      ansible.builtin.assert:
        that:
          - kuma_host_monitors | length > 0
        fail_msg: "No inventory host sets kuma_monitor, so there is nothing to sync."
        quiet: true

    # Shown before any change, so the run log lists exactly what was asked for
    - name: Show the monitors to sync
      ansible.builtin.debug:
        msg: "{{ kuma_host_monitors | map(attribute='name') | zip(kuma_host_monitors | map(attribute='type')) | map('join', ' (') | map('regex_replace', '$', ')') | list }}"

    # Validates every entry, logs in once and adds or updates each monitor
    - name: Add the monitors
      ansible.builtin.include_tasks: add_monitors.yaml
      vars:
        kuma_monitors: "{{ kuma_host_monitors }}"
