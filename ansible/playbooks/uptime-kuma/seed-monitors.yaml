---
# Adds or updates an Uptime Kuma monitor for every inventory host with a kuma_monitor variable, for hosts no install playbook covers, such as the firewall, NAS and hypervisors
# kuma_monitor: true pings the host's ansible_host; a mapping is one monitor; a list is several, e.g. the firewall's web UI and its DNS
# Each entry takes the fields listed in tasks/uptime_kuma_monitor.yaml; type defaults to http when url is set and ping otherwise, and ping and port default hostname to ansible_host
# Names default to the host name, with the type added when a host has several; groups default to Core (kuma_monitor_group overrides)
# Monitors are matched by name, so re-runs update them; a host whose kuma_monitor is removed keeps its monitor until it is deleted in Kuma
# Connection and Vault settings are listed in tasks/uptime_kuma_monitor.yaml
- name: Seed Uptime Kuma from the inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    kuma_monitor_group: "{{ seed_group | default('Core') }}"

  tasks:
    # true, a mapping or a list all become a list, each entry tagged with its host so defaults can be filled in next
    - name: Collect the kuma_monitor entries
      ansible.builtin.set_fact:
        seed_raw: "{{ seed_raw | default([]) + (seed_entries | map('combine', {'_host': item, '_count': seed_entries | length}) | list) }}"
      loop: "{{ groups['all'] | sort }}"
      vars:
        seed_value: "{{ hostvars[item].kuma_monitor }}"
        seed_entries: "{{ [{}] if seed_value is sameas true else ([seed_value] if seed_value is mapping else seed_value) }}"
      when:
        - hostvars[item].kuma_monitor is defined
        - hostvars[item].kuma_monitor is not sameas false

    # Fills in type, name and hostname, then drops the tags, leaving entries in the shape uptime_kuma_monitor.yaml takes
    - name: Fill in the defaults
      ansible.builtin.set_fact:
        seed_monitors: "{{ seed_monitors | default([]) + [seed_final] }}"
      loop: "{{ seed_raw | default([]) }}"
      loop_control:
        label: "{{ item._host }}"
      vars:
        seed_type: "{{ item.type | default('http' if item.url is defined else 'ping') }}"
        seed_name: "{{ item.name | default(item._host if item._count == 1 else item._host ~ ' ' ~ seed_type | upper) }}"
        seed_address: "{{ hostvars[item._host].ansible_host | default(item._host) }}"
        seed_hostname: "{{ {'hostname': item.hostname | default(seed_address)} if seed_type in ['ping', 'port'] else {} }}"
        seed_final: "{{ item | combine({'type': seed_type, 'name': seed_name}, seed_hostname) | dict2items | rejectattr('key', 'match', '^_') | items2dict }}"

    # A seed with nothing to do is almost always a missing inventory change, so it says so instead of passing silently
    - name: Require at least one monitor
      ansible.builtin.assert:
        that:
          - seed_monitors | default([]) | length > 0
        fail_msg: "No inventory host sets kuma_monitor, so there is nothing to seed."
        quiet: true

    # Shown before any change, so the run log lists exactly what was asked for
    - name: Show the monitors to seed
      ansible.builtin.debug:
        msg: "{{ seed_monitors | map(attribute='name') | zip(seed_monitors | map(attribute='type')) | map('join', ' (') | map('regex_replace', '$', ')') | list }}"

    # Validates every entry, logs in once and adds or updates each monitor
    - name: Add the monitors
      ansible.builtin.include_tasks: ../../tasks/uptime_kuma_monitor.yaml
      vars:
        kuma_monitors: "{{ seed_monitors }}"
