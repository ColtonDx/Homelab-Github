---
# Sets Uptime Kuma up for container checks: runs the read-only Docker socket proxy on every host in the docker group, then registers each as a Kuma Docker host
# Also registers kuma_default_docker_host from the inventory (the host the compose stacks run on); its proxy is deployed through Portainer as the docker-socket-proxy stack
# Kuma reaches each host at tcp://<ansible_host>:<kuma_docker_port, default 2375>; kuma_docker_url on a host overrides that
# Each Docker host is named kuma_docker_name on its inventory host (default the inventory name), which is also its group under Containers; a Kuma.DockerHost label uses the inventory name; safe to re-run
# First, since it needs nothing from the hosts; an unreachable host then only fails its own proxy step below
- name: Register the Docker hosts in Uptime Kuma
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    # The docker group plus the host the compose stacks run on, each with the address Kuma connects to
    - name: List the Docker hosts
      ansible.builtin.set_fact:
        kuma_docker_hosts: "{{ kuma_docker_hosts | default([]) + [{'name': hostvars[item].kuma_docker_name | default(item), 'url': hostvars[item].kuma_docker_url | default('tcp://' ~ (hostvars[item].ansible_host | default(item)) ~ ':' ~ (hostvars[item].kuma_docker_port | default(2375)))}] }}"
      loop: "{{ (groups['docker'] | default([]) + ([kuma_default_docker_host] if kuma_default_docker_host | default('') | length > 0 else [])) | unique }}"

    # Sets kuma_connected, and stays quiet when Kuma is not configured
    - name: Connect to Uptime Kuma
      ansible.builtin.include_tasks: connect.yaml

    # The name compose_monitors.yaml points container checks at
    - name: Register each Docker host
      lucasheld.uptime_kuma.docker_host:
        api_url: "{{ kuma_api_url }}"
        api_token: "{{ kuma_login.token }}"
        name: "{{ item.name }}"
        dockerType: tcp
        dockerDaemon: "{{ item.url }}"
        state: present
      loop: "{{ kuma_docker_hosts | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: kuma_connected

    # Shown so the run log says what Kuma can now check containers on
    - name: Report the Docker hosts
      ansible.builtin.debug:
        msg: "Docker hosts in Uptime Kuma: {{ kuma_docker_hosts | default([]) | map(attribute='name') | join(', ') }}"

# The proxy on each docker host; Kuma's checks on a host start working once its proxy runs
- name: Run the Docker socket proxy
  hosts: docker
  become: true
  gather_facts: false

  vars:
    proxy_dir: /opt/docker-socket-proxy

  tasks:
    # The same compose file Portainer deploys on the Docker host the stacks run on
    - name: Create the proxy's folder
      ansible.builtin.file:
        path: "{{ proxy_dir }}"
        state: directory
        mode: "0755"

    # Copied from this repo, so every host runs the same read-only settings
    - name: Copy the proxy's compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../docker/docker-socket-proxy/docker-compose.yaml"
        dest: "{{ proxy_dir }}/docker-compose.yaml"
        mode: "0644"

    # Starts the proxy, or recreates it when the compose file changed; compose reports what it did on stderr
    - name: Start the proxy
      ansible.builtin.command:
        argv: [docker, compose, --project-directory, "{{ proxy_dir }}", up, --detach, --remove-orphans]
      register: proxy_up
      changed_when: proxy_up.stderr is search('(Creat|Recreat|Start)(ed|ing)')
