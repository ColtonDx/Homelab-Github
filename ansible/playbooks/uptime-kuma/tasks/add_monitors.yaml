---
# Task file: adds or updates Uptime Kuma monitors; used by sync-monitors.yaml after connect_kuma.yaml and register_docker_hosts.yaml
# Needs kuma_monitors, a list; each entry has name and type (default http) plus that type's fields, and monitors are matched by name so re-runs update them
# http: url, optional accepted_codes (['200-299']) and ignore_tls (false); ping: hostname; port: hostname and port; dns: hostname (the name to look up), dns_resolve_server, optional dns_resolve_type (A) and port (53)
# docker: container (the container name) and docker_host (a Kuma Docker host, as register_docker_hosts.yaml registers them)
# Every type: optional group and interval (default 60 seconds); the group is the entry's own, else kuma_monitor_group from the inventory, else the caller's kuma_default_group, else Applications; empty means none
# A group can be nested with >, such as Containers > TrueNAS: each part is a group inside the one before it, and the monitor goes in the last; / is an ordinary character, as in CI/CD
# Optional: uptime_kuma_notifications in the inventory, names of Kuma notifications attached to every monitor

# Catches a malformed entry before logging in, naming the entry
- name: Validate the monitors
  ansible.builtin.assert:
    that:
      - item.name | default('') | length > 0
      - kuma_type in ['http', 'ping', 'port', 'dns', 'docker']
      - kuma_type != 'http' or (item.url | default('') is match('^https?://'))
      - kuma_type in ['http', 'docker'] or (item.hostname | default('') | length > 0)
      - kuma_type != 'docker' or (item.container | default('') | length > 0 and item.docker_host | default('') | length > 0)
      - kuma_type != 'port' or (item.port | default('') | string | length > 0)
      - kuma_type != 'dns' or (item.dns_resolve_server | default('') | length > 0)
    fail_msg: "Monitor {{ item.name | default('(no name)') }}: needs a name and a type of http (with an http(s) url), ping (hostname), port (hostname and port), dns (hostname and dns_resolve_server) or docker (container and docker_host)."
    quiet: true
  loop: "{{ kuma_monitors }}"
  loop_control:
    label: "{{ item.name | default('(no name)') }}"
  vars:
    kuma_type: "{{ item.type | default('http') }}"

# Two entries with one name would overwrite each other in Kuma; case counts, as it does in Kuma, so Homepage and homepage are different monitors
- name: Require unique monitor names
  ansible.builtin.assert:
    that:
      - kuma_monitors | map(attribute='name') | unique(case_sensitive=true) | length == kuma_monitors | length
    fail_msg: "Monitor names must be unique; repeated: {{ kuma_monitors | map(attribute='name') | community.general.counter | dict2items | selectattr('value', 'gt', 1) | map(attribute='key') | join(', ') }}"
    quiet: true

# Everything below needs Kuma
- name: Add the Uptime Kuma monitors
  when: kuma_connected
  # Every call in here runs from the controller without privilege escalation
  delegate_to: localhost
  become: false
  block:
    # Container checks need their Docker host registered in Kuma; the collection fails with an unhelpful error otherwise
    - name: List Kuma's Docker hosts
      lucasheld.uptime_kuma.docker_host_info:
        api_url: "{{ kuma_api_url }}"
        api_token: "{{ kuma_login.token }}"
      register: kuma_docker_info
      when: kuma_monitors | selectattr('type', 'defined') | selectattr('type', 'equalto', 'docker') | list | length > 0

    # Container checks on an unknown Docker host are set aside so the rest still sync
    - name: Set aside container checks on unknown Docker hosts
      ansible.builtin.set_fact:
        kuma_ready: "{{ kuma_monitors | rejectattr('docker_host', 'defined') | list + (kuma_docker_checks | selectattr('docker_host', 'in', kuma_known_hosts) | list) }}"
        kuma_skipped_hosts: "{{ kuma_docker_checks | rejectattr('docker_host', 'in', kuma_known_hosts) | map(attribute='docker_host') | unique | list }}"
      vars:
        kuma_docker_checks: "{{ kuma_monitors | selectattr('docker_host', 'defined') | list }}"
        kuma_known_hosts: "{{ kuma_docker_info.docker_hosts | default([]) | map(attribute='name') | list }}"

    # Normally register_docker_hosts.yaml has just registered them, so this means the host could not be reached or named
    - name: Warn about unknown Docker hosts
      ansible.builtin.debug:
        msg: "Kuma has no Docker host named {{ kuma_skipped_hosts | join(', ') }}, so the container checks on it were skipped; check its kuma_docker_name and address in the inventory."
      when: kuma_skipped_hosts | length > 0

    # Facts persist between includes, so each call starts with no groups
    - name: Start the group list
      ansible.builtin.set_fact:
        kuma_group_pairs: []

    # Each group path becomes parent and child pairs, parents first, so a nested group always has its parent to go in
    - name: List the groups and their parents
      ansible.builtin.set_fact:
        kuma_group_pairs: "{{ kuma_group_pairs + (kuma_segments | zip([''] + kuma_segments[:-1]) | map('join', '|') | list) }}"
      loop: "{{ kuma_ready | map(attribute='group', default=kuma_monitor_group | default(kuma_default_group | default('Applications'))) | select | unique | list }}"
      vars:
        kuma_segments: "{{ item.split('>') | map('trim') | select | list }}"

    # Groups keep the dashboard sorted; each is created the first time a monitor uses it, inside its parent when it has one
    # No notifications on groups, so an outage alerts once from the service itself; this also clears any a default-enabled Kuma notification added
    - name: Ensure the monitor groups exist
      lucasheld.uptime_kuma.monitor:
        api_url: "{{ kuma_api_url }}"
        api_token: "{{ kuma_login.token }}"
        name: "{{ item.split('|')[0] }}"
        type: group
        parent_name: "{{ item.split('|')[1] if item.split('|')[1] | length > 0 else omit }}"
        notificationIDList: []
        state: present
      loop: "{{ kuma_group_pairs | default([]) | unique }}"
      loop_control:
        label: "{{ item.split('|') | reverse | select | join(' > ') }}"

    # Fields that do not apply to a monitor's type are left out, so Kuma keeps its own defaults for them
    - name: Add or update the monitors
      lucasheld.uptime_kuma.monitor:
        api_url: "{{ kuma_api_url }}"
        api_token: "{{ kuma_login.token }}"
        name: "{{ item.name }}"
        type: "{{ kuma_type }}"
        url: "{{ item.url if kuma_type == 'http' else omit }}"
        hostname: "{{ item.hostname if kuma_type in ['ping', 'port', 'dns'] else omit }}"
        docker_container: "{{ item.container if kuma_type == 'docker' else omit }}"
        docker_host_name: "{{ item.docker_host if kuma_type == 'docker' else omit }}"
        port: "{{ item.port | default(53) | int if kuma_type in ['port', 'dns'] else omit }}"
        dns_resolve_server: "{{ item.dns_resolve_server if kuma_type == 'dns' else omit }}"
        dns_resolve_type: "{{ item.dns_resolve_type | default('A') if kuma_type == 'dns' else omit }}"
        accepted_statuscodes: "{{ item.accepted_codes | default(['200-299']) if kuma_type == 'http' else omit }}"
        ignoreTls: "{{ item.ignore_tls | default(false) | bool if kuma_type == 'http' else omit }}"
        expiryNotification: "{{ item.url is match('^https://') if kuma_type == 'http' else omit }}"
        interval: "{{ item.interval | default(60) | int }}"
        parent_name: "{{ kuma_group.split('>') | map('trim') | select | last if kuma_group | length > 0 else omit }}"
        notification_names: "{{ uptime_kuma_notifications | default(omit) }}"
        state: present
      loop: "{{ kuma_ready }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        kuma_type: "{{ item.type | default('http') }}"
        kuma_group: "{{ item.group | default(kuma_monitor_group | default(kuma_default_group | default('Applications'))) }}"

    # Shown so the run log says what is being watched
    - name: Report the monitors
      ansible.builtin.debug:
        msg: "Uptime Kuma is monitoring: {{ kuma_ready | map(attribute='name') | join(', ') }}"
