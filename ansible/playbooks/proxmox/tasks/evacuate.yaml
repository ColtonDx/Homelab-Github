---
# Empties one node before its reboot, for update_node.yaml: moves the running guests that can move, and shuts down the ones that should stay
# A guest stays when it has a tag in proxmox_stay_tags (default talos), is listed in proxmox_stay_names (by name or VM ID), or uses PCI or USB passthrough; the rest move, HA-managed ones through ha-manager
# A VM only moves to a node that has every storage its disks are on; the whole plan is checked before anything moves

# Running VMs on this node
- name: List the node's VMs
  ansible.builtin.command:
    argv: [pvesh, get, "/nodes/{{ proxmox_node }}/qemu", --output-format, json]
  register: proxmox_vms
  changed_when: false
  check_mode: false

# Running containers on this node
- name: List the node's containers
  ansible.builtin.command:
    argv: [pvesh, get, "/nodes/{{ proxmox_node }}/lxc", --output-format, json]
  register: proxmox_cts
  changed_when: false
  check_mode: false

# HA-managed guests are moved by ha-manager, since HA would otherwise move them back
- name: List the HA-managed guests
  ansible.builtin.command:
    argv: [pvesh, get, /cluster/ha/resources, --output-format, json]
  register: proxmox_ha
  changed_when: false
  failed_when: false
  check_mode: false

# Every running guest, with its type, so the tasks below treat VMs and containers alike
- name: Gather the running guests
  ansible.builtin.set_fact:
    proxmox_running: >-
      {{ (proxmox_vms.stdout | from_json | selectattr('status', 'equalto', 'running') | rejectattr('template', 'defined') | map('combine', {'type': 'qemu'}) | list)
         + (proxmox_vms.stdout | from_json | selectattr('status', 'equalto', 'running') | selectattr('template', 'defined') | rejectattr('template', 'in', [1, '1']) | map('combine', {'type': 'qemu'}) | list)
         + (proxmox_cts.stdout | from_json | selectattr('status', 'equalto', 'running') | map('combine', {'type': 'lxc'}) | list) }}
    proxmox_ha_sids: "{{ (proxmox_ha.stdout | default('[]', true) | from_json) | map(attribute='sid') | list if proxmox_ha.rc == 0 else [] }}"

# Passthrough devices tie a VM to this host, so their configs are read to find them
- name: Read the running VMs' configs
  ansible.builtin.command:
    argv: [pvesh, get, "/nodes/{{ proxmox_node }}/qemu/{{ item.vmid }}/config", --output-format, json]
  loop: "{{ proxmox_running | selectattr('type', 'equalto', 'qemu') | list }}"
  loop_control:
    label: "{{ item.name | default(item.vmid) }}"
  register: proxmox_vm_configs
  changed_when: false
  check_mode: false

# Local disks can only move to a node with a storage of the same name, so each VM's disk storages are noted (CD drives skipped)
- name: Note the storages each VM's disks are on
  ansible.builtin.set_fact:
    proxmox_guest_storages: >-
      {{ proxmox_guest_storages | default({}) | combine({(item.item.vmid | string): (item.stdout | from_json | dict2items
         | selectattr('key', 'match', '^((scsi|virtio|sata|ide)[0-9]+|efidisk0|tpmstate0)$') | map(attribute='value') | map('string')
         | reject('search', 'media=cdrom') | select('search', ':') | map('regex_replace', ':.*$', '') | unique | list)}) }}
  loop: "{{ proxmox_vm_configs.results | selectattr('stdout', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.name | default(item.item.vmid) }}"

# Which storages each node can use right now
- name: Read the storages on each node
  ansible.builtin.command:
    argv: [pvesh, get, /cluster/resources, --type, storage, --output-format, json]
  register: proxmox_storage_list
  changed_when: false
  check_mode: false

- name: Note the storages on each node
  ansible.builtin.set_fact:
    proxmox_node_storages: >-
      {{ proxmox_node_storages | default({}) | combine({item: (proxmox_storage_list.stdout | from_json | selectattr('node', 'equalto', item)
         | selectattr('status', 'equalto', 'available') | map(attribute='storage') | list)}) }}
  loop: "{{ proxmox_storage_list.stdout | from_json | map(attribute='node') | unique | list }}"

# Split into what moves and what stays; tags come as a semicolon-separated list
- name: Decide which guests move and which stay
  ansible.builtin.set_fact:
    proxmox_pinned_ids: >-
      {{ proxmox_vm_configs.results | selectattr('stdout', 'defined')
         | selectattr('stdout', 'search', '"(hostpci|usb)[0-9]+"') | map(attribute='item.vmid') | list }}
    proxmox_stay_tag_ids: >-
      {{ proxmox_running | selectattr('tags', 'defined')
         | selectattr('tags', 'search', '(^|;)(' ~ (proxmox_stay_tags | default(['talos']) | join('|')) ~ ')(;|$)')
         | map(attribute='vmid') | list }}
    # Entries are guest names or VM IDs
    proxmox_stay_name_ids: >-
      {{ (proxmox_running | selectattr('name', 'defined') | selectattr('name', 'in', proxmox_stay_names | default([])) | map(attribute='vmid') | list)
         + (proxmox_running | selectattr('vmid', 'in', proxmox_stay_names | default([]) | map('string') | select('match', '^[0-9]+$') | map('int') | list)
            | map(attribute='vmid') | list) }}

# The two lists, with the reason each stays
- name: List the guests to move and to stay
  ansible.builtin.set_fact:
    proxmox_movers: "{{ proxmox_running | rejectattr('vmid', 'in', proxmox_pinned_ids + proxmox_stay_tag_ids + proxmox_stay_name_ids) | list }}"
    proxmox_stayed: "{{ proxmox_running | selectattr('vmid', 'in', proxmox_pinned_ids + proxmox_stay_tag_ids + proxmox_stay_name_ids) | list }}"

# The other online nodes' free memory, to be sure everything fits before anything moves
- name: Read the other nodes' free memory
  ansible.builtin.command:
    argv: [pvesh, get, /cluster/resources, --type, node, --output-format, json]
  register: proxmox_nodes_now
  changed_when: false
  check_mode: false

# Starting point for the plan: each other online node's memory size and what is in use now
- name: Start the plan
  ansible.builtin.set_fact:
    proxmox_plan_max: "{{ dict(proxmox_others | map(attribute='node') | zip(proxmox_others | map(attribute='maxmem') | map('int'))) }}"
    proxmox_plan_used: "{{ dict(proxmox_others | map(attribute='node') | zip(proxmox_others | map(attribute='mem') | map('int'))) }}"
    proxmox_unplaced: []
  vars:
    proxmox_others: "{{ proxmox_nodes_now.stdout | from_json | selectattr('status', 'equalto', 'online') | rejectattr('node', 'equalto', proxmox_node) | list }}"

# Places each guest the way migrate_guest.yaml will (in order, most free memory among nodes with its storages), so a guest
# that fits nowhere stops the run here instead of leaving guests half-moved
- name: Plan where each guest goes
  ansible.builtin.set_fact:
    proxmox_plan_used: >-
      {{ proxmox_plan_used | combine({proxmox_plan_target: proxmox_plan_used[proxmox_plan_target] + (item.maxmem | int)}) if proxmox_plan_target | length > 0 else proxmox_plan_used }}
    proxmox_unplaced: "{{ proxmox_unplaced + ([] if proxmox_plan_target | length > 0 else [item.name | default(item.vmid)]) }}"
  vars:
    proxmox_plan_storages: "{{ proxmox_guest_storages[item.vmid | string] | default([]) }}"
    proxmox_plan_target: >-
      {%- set ns = namespace(best='', free=-1) -%}
      {%- for node in proxmox_plan_max -%}
      {%- set free = proxmox_plan_max[node] - proxmox_plan_used[node] -%}
      {%- if free >= (item.maxmem | int) and free > ns.free
            and (proxmox_plan_storages | difference(proxmox_node_storages[node] | default([]))) | length == 0 -%}
      {%- set ns.best = node -%}
      {%- set ns.free = free -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.best }}
  loop: "{{ proxmox_movers }}"
  loop_control:
    label: "{{ item.name | default(item.vmid) }}"

- name: Require a place for every guest
  ansible.builtin.assert:
    that:
      - proxmox_unplaced | length == 0
    fail_msg: >-
      {{ proxmox_unplaced | join(', ') }} cannot move off {{ proxmox_node }}: no other online node has both the memory and the storage its disks are on.
      Add them to proxmox_stay_names so they shut down for the reboot instead, or make room first. Nothing was moved.
  when: proxmox_movers | length > 0

# Names only, so the run log shows the plan before anything moves
- name: Report the plan for this node
  ansible.builtin.debug:
    msg: >-
      {{ proxmox_node }}: moving {{ proxmox_movers | map(attribute='name') | join(', ') or 'nothing' }};
      shutting down for the reboot {{ proxmox_stayed | map(attribute='name') | join(', ') or 'nothing' }}.

# One guest at a time, each to whichever node has the most free memory at that moment
- name: Move each guest
  ansible.builtin.include_tasks: migrate_guest.yaml
  loop: "{{ proxmox_movers }}"
  loop_control:
    loop_var: proxmox_guest
    label: "{{ proxmox_guest.name | default(proxmox_guest.vmid) }}"

# A clean shutdown, so the guest's own services stop properly; it is started again after the reboot
- name: Shut down the guests that stay
  ansible.builtin.command:
    argv: ["{{ 'qm' if item.type == 'qemu' else 'pct' }}", shutdown, "{{ item.vmid }}", --timeout, "{{ proxmox_shutdown_timeout | default(300) }}"]
  loop: "{{ proxmox_stayed }}"
  loop_control:
    label: "{{ item.name | default(item.vmid) }}"
