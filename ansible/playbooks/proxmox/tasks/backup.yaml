---
# Adds the TrueNAS share as backup storage and sets the scheduled backup job; both are cluster-wide, so they are set once from the first node
# Inventory: proxmox_backup with storage_id, storage_type (nfs or cifs, default nfs), and for nfs: nfs_server, nfs_export, optionally nfs_options (vers=4.2);
#   for cifs: cifs_server, cifs_share, whose username and password are read from Vault (CIFS_USERNAME, CIFS_PASSWORD at vault_proxmox_backup_path,
#   default proxmox-backup) only when the storage has to be created
# Optional: job_id (nightly; set it to adopt a job made in the web UI), schedule (02:00, written as Proxmox stores it, e.g. 1:00), mode (snapshot),
#   compress (zstd), retention (a dict such as {keep-daily: 7, keep-weekly: 4}), vmids (a list; default every guest), exclude (a list),
#   notification_mode (auto, or notification-system to use Proxmox's notification targets), mailto
# Optional: sub_storages, a list of {id, subdir}: extra backup storages in folders of the same share, each only used while the share is mounted
# Optional: jobs, a list of jobs, each {job_id, schedule, retention, storage_id (default storage_id)} plus any of the job settings above;
#   when set it replaces the single job. A job's retention prunes every backup of a guest on its storage, so rotating jobs each need their own storage
# Unset skips this step; the share must already be exported to the Proxmox nodes on TrueNAS

# Nothing to do without backup settings
- name: Configure backups
  when: proxmox_backup is defined
  block:
    # The values this step works with, with the defaults filled in
    - name: Work out the backup settings
      ansible.builtin.set_fact:
        proxmox_bk: >-
          {{ {'storage_type': 'nfs', 'nfs_options': 'vers=4.2', 'job_id': 'nightly', 'schedule': '02:00', 'mode': 'snapshot', 'compress': 'zstd',
              'retention': {'keep-daily': 7, 'keep-weekly': 4, 'keep-monthly': 3}, 'vmids': [], 'exclude': [], 'notification_mode': '', 'mailto': '',
              'sub_storages': [], 'jobs': []}
             | combine(proxmox_backup) }}
      run_once: true

    # The storage and the job both need these
    - name: Require the share details
      ansible.builtin.assert:
        that:
          - proxmox_bk.storage_id | default('') | length > 0
          - proxmox_bk.storage_type in ['nfs', 'cifs']
          - (proxmox_bk.nfs_server | default('') | length > 0 and proxmox_bk.nfs_export | default('') | length > 0)
            if proxmox_bk.storage_type == 'nfs'
            else (proxmox_bk.cifs_server | default('') | length > 0 and proxmox_bk.cifs_share | default('') | length > 0)
        fail_msg: "proxmox_backup needs storage_id and either nfs_server and nfs_export, or storage_type cifs with cifs_server and cifs_share."
      run_once: true

    # Proxmox's storage list, to decide between adding and updating
    - name: Read the configured storage
      ansible.builtin.command:
        argv: [pvesh, get, /storage, --output-format, json]
      register: proxmox_bk_storage_list
      changed_when: false
      check_mode: false
      run_once: true

    # The existing entry for this id, or an empty one
    - name: Find the existing backup storage entry
      ansible.builtin.set_fact:
        proxmox_bk_storage: "{{ proxmox_bk_storage_list.stdout | from_json | selectattr('storage', 'equalto', proxmox_bk.storage_id) | first | default({}) }}"
      run_once: true

    # A name already used for something else is a conflict for a person to resolve
    - name: Refuse to repoint an existing storage entry
      ansible.builtin.assert:
        that:
          - >-
            proxmox_bk_storage == {}
            or (proxmox_bk.storage_type == 'nfs' and proxmox_bk_storage.type == 'nfs'
                and proxmox_bk_storage.server == proxmox_bk.nfs_server and proxmox_bk_storage.export == proxmox_bk.nfs_export)
            or (proxmox_bk.storage_type == 'cifs' and proxmox_bk_storage.type == 'cifs'
                and proxmox_bk_storage.server == proxmox_bk.cifs_server and proxmox_bk_storage.share == proxmox_bk.cifs_share)
        fail_msg: >-
          Storage {{ proxmox_bk.storage_id }} already exists as {{ proxmox_bk_storage.type | default('?') }} on
          {{ proxmox_bk_storage.server | default('?') }}; change it by hand, or pick another id.
      run_once: true

    # The share's login is only needed to create a CIFS storage entry; an existing one keeps the login Proxmox already holds
    - name: Load the CIFS share login from Vault
      ansible.builtin.include_tasks: ../../../tasks/var_lookup.yaml
      vars:
        vault_secrets:
          - { path: "{{ vault_proxmox_backup_path | default('proxmox-backup') }}", field: CIFS_USERNAME, var: proxmox_bk_cifs_username }
          - { path: "{{ vault_proxmox_backup_path | default('proxmox-backup') }}", field: CIFS_PASSWORD, var: proxmox_bk_cifs_password }
      when: proxmox_bk.storage_type == 'cifs' and proxmox_bk_storage == {}
      run_once: true

    # Backups only, so nobody places VM disks on the share by mistake; the password goes on pvesm's command line, so the task is hidden
    - name: Add the CIFS backup storage
      ansible.builtin.command:
        argv:
          - pvesm
          - add
          - cifs
          - "{{ proxmox_bk.storage_id }}"
          - --server
          - "{{ proxmox_bk.cifs_server }}"
          - --share
          - "{{ proxmox_bk.cifs_share }}"
          - --username
          - "{{ proxmox_bk_cifs_username }}"
          - --password
          - "{{ proxmox_bk_cifs_password }}"
          - --content
          - backup
      when: proxmox_bk.storage_type == 'cifs' and proxmox_bk_storage == {}
      changed_when: true
      no_log: true
      run_once: true

    # Backups only, so nobody places VM disks on the share by mistake
    - name: Add the NFS backup storage
      ansible.builtin.command:
        argv:
          - pvesm
          - add
          - nfs
          - "{{ proxmox_bk.storage_id }}"
          - --server
          - "{{ proxmox_bk.nfs_server }}"
          - --export
          - "{{ proxmox_bk.nfs_export }}"
          - --content
          - backup
          - --options
          - "{{ proxmox_bk.nfs_options }}"
      when: proxmox_bk.storage_type == 'nfs' and proxmox_bk_storage == {}
      run_once: true

    # Only the mount options and content can change on an existing entry
    - name: Update the NFS backup storage
      ansible.builtin.command:
        argv: [pvesm, set, "{{ proxmox_bk.storage_id }}", --content, backup, --options, "{{ proxmox_bk.nfs_options }}"]
      when:
        - proxmox_bk.storage_type == 'nfs'
        - proxmox_bk_storage != {}
        - proxmox_bk_storage.content | default('') != 'backup' or proxmox_bk_storage.options | default('') != proxmox_bk.nfs_options
      run_once: true

    # Each node mounts the share itself, so each one is checked; a node that cannot reach TrueNAS would fail its backups
    - name: Check each node has the share mounted
      ansible.builtin.command:
        argv: [pvesm, status, --storage, "{{ proxmox_bk.storage_id }}"]
      register: proxmox_bk_status
      changed_when: false
      failed_when: false
      retries: 3
      delay: 5
      until: proxmox_bk_status.stdout is search('\\sactive\\s')
      check_mode: false

    # Says which node cannot reach the share, rather than letting its backups fail later
    - name: Report a node that cannot mount the share
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ ansible_facts.hostname }} cannot mount backup storage {{ proxmox_bk.storage_id }};
          check TrueNAS shares it with this node's address.
      when: proxmox_bk_status.stdout is not search('\\sactive\\s')

    # Each extra storage is a folder inside the mounted share; Proxmox treats it as offline whenever the share is not mounted, so it never fills a local disk
    - name: Add the backup folders inside the share
      ansible.builtin.command:
        argv:
          - pvesm
          - add
          - dir
          - "{{ item.id }}"
          - --path
          - "/mnt/pve/{{ proxmox_bk.storage_id }}/{{ item.subdir }}"
          - --is_mountpoint
          - "/mnt/pve/{{ proxmox_bk.storage_id }}"
          - --create-base-path
          - "1"
          - --shared
          - "1"
          - --content
          - backup
      loop: "{{ proxmox_bk.sub_storages }}"
      loop_control:
        label: "{{ item.id }}"
      when: item.id not in (proxmox_bk_storage_list.stdout | from_json | map(attribute='storage') | list)
      changed_when: true
      run_once: true

    # An existing entry with the same name must be the same folder, or it is a conflict for a person to resolve
    - name: Refuse to repoint an existing backup folder entry
      ansible.builtin.assert:
        that:
          - existing == {} or (existing.type == 'dir' and existing.path == '/mnt/pve/' ~ proxmox_bk.storage_id ~ '/' ~ item.subdir)
        fail_msg: "Storage {{ item.id }} already exists as {{ existing.type | default('?') }} at {{ existing.path | default('?') }}; change it by hand, or pick another id."
        quiet: true
      loop: "{{ proxmox_bk.sub_storages }}"
      loop_control:
        label: "{{ item.id }}"
      vars:
        existing: "{{ proxmox_bk_storage_list.stdout | from_json | selectattr('storage', 'equalto', item.id) | first | default({}) }}"
      run_once: true

    # The scheduled jobs, to decide between creating and updating
    - name: Read the backup jobs
      ansible.builtin.command:
        argv: [pvesh, get, /cluster/backup, --output-format, json]
      register: proxmox_bk_jobs
      changed_when: false
      check_mode: false
      run_once: true

    # The jobs list, or the single job described by the top-level settings
    - name: Create or update each backup job
      ansible.builtin.include_tasks: backup_job.yaml
      loop: >-
        {{ proxmox_bk.jobs if proxmox_bk.jobs | length > 0
           else [{'job_id': proxmox_bk.job_id, 'schedule': proxmox_bk.schedule, 'retention': proxmox_bk.retention}] }}
      loop_control:
        loop_var: proxmox_bk_job_item
        label: "{{ proxmox_bk_job_item.job_id }}"
