---
# Switches Proxmox to its no-subscription repositories and turns the enterprise ones off, which fail without a subscription
# Handles Proxmox 9 (Debian trixie, .sources files) and Proxmox 8 (bookworm, .list files)
# Inventory: proxmox_ceph_repo=true also adds Ceph's no-subscription repository (default false)

# The file layout differs between Proxmox releases
- name: Require a supported Proxmox release
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution_release in ['bookworm', 'trixie']
    fail_msg: "Supported on Proxmox 8 (bookworm) and 9 (trixie), not {{ ansible_facts.distribution_release }}."

# Which enterprise repository files exist on this node, checked on the node itself
- name: Find the enterprise repository files
  ansible.builtin.stat:
    path: "/etc/apt/sources.list.d/{{ item }}"
  loop: "{{ ['pve-enterprise.sources', 'ceph.sources'] if ansible_facts.distribution_release == 'trixie' else ['pve-enterprise.list', 'ceph.list'] }}"
  register: proxmox_enterprise_files

# Proxmox 9: the enterprise sources stay in place but disabled, so an upgrade that restores them does not leave two copies
- name: Disable the enterprise repositories (Proxmox 9)
  ansible.builtin.lineinfile:
    path: "/etc/apt/sources.list.d/{{ item }}"
    regexp: '^Enabled:'
    line: 'Enabled: false'
    insertafter: EOF
  loop: "{{ proxmox_enterprise_files.results | selectattr('stat.exists') | map(attribute='item') | list }}"
  when: ansible_facts.distribution_release == 'trixie'

# Proxmox 9: the no-subscription repository, signed with the key Proxmox installs
- name: Add the no-subscription repository (Proxmox 9)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    mode: "0644"
    content: |
      # Managed by ansible/playbooks/proxmox/configure-proxmox.yaml
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: trixie
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
  when: ansible_facts.distribution_release == 'trixie'

# Proxmox 9: Ceph's no-subscription repository, only where Ceph is used
- name: Add Ceph's no-subscription repository (Proxmox 9)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ceph-no-subscription.sources
    mode: "0644"
    content: |
      # Managed by ansible/playbooks/proxmox/configure-proxmox.yaml
      Types: deb
      URIs: http://download.proxmox.com/debian/ceph-squid
      Suites: trixie
      Components: no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
  when:
    - ansible_facts.distribution_release == 'trixie'
    - proxmox_ceph_repo | default(false) | bool

# Proxmox 8: the enterprise lists are commented out rather than deleted, for the same reason
- name: Disable the enterprise repositories (Proxmox 8)
  ansible.builtin.replace:
    path: "/etc/apt/sources.list.d/{{ item }}"
    regexp: '^(deb .*enterprise.*)$'
    replace: '# \1'
  loop: "{{ proxmox_enterprise_files.results | selectattr('stat.exists') | map(attribute='item') | list }}"
  when: ansible_facts.distribution_release == 'bookworm'

# Proxmox 8: the no-subscription repository
- name: Add the no-subscription repository (Proxmox 8)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-no-subscription.list
    mode: "0644"
    content: |
      # Managed by ansible/playbooks/proxmox/configure-proxmox.yaml
      deb http://download.proxmox.com/debian/pve bookworm pve-no-subscription
  when: ansible_facts.distribution_release == 'bookworm'

# Proves the repositories now resolve, so an upgrade later does not fail on them
- name: Refresh the package lists
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
