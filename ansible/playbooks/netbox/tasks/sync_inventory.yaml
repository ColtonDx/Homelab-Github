---
# Task file: records every inventory host's address in NetBox, so addresses are defined once, in the inventory; needs connect_netbox.yaml first
# A host counts when its ansible_host is an IPv4 address; hosts reached by DNS name are skipped, and netbox_ip: false leaves one out
# Optional per host, netbox_ip with dns_name, description and status (default active); without a description the host name is used
# A new address gets its mask from the narrowest NetBox prefix holding it, else /32; an existing one only gets the fields the host sets, so its assignment and anything curated in NetBox stay

# One record per host with an IPv4 ansible_host, carrying only the fields the host sets
- name: Collect the inventory addresses
  ansible.builtin.set_fact:
    nis_records: "{{ nis_records | default([]) + [{'host': item, 'ip': nis_addr} | combine(nis_extra | dict2items | selectattr('key', 'in', ['dns_name', 'description', 'status']) | items2dict)] }}"
  loop: "{{ groups['all'] | sort }}"
  vars:
    nis_addr: "{{ hostvars[item].ansible_host | default('') | string }}"
    nis_raw: "{{ hostvars[item].netbox_ip | default({}) }}"
    nis_extra: "{{ nis_raw if nis_raw is mapping else {} }}"
  when:
    - nis_addr is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
    - hostvars[item].netbox_ip | default(true) is not sameas false

# NetBox matches an address here whatever its mask
- name: Look up each inventory address
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/ipam/ip-addresses/?address={{ item.ip }}"
    headers: "{{ netbox_headers }}"
  loop: "{{ nis_records | default([]) }}"
  loop_control:
    label: "{{ item.host }} {{ item.ip }}"
  register: nis_found

# Only addresses NetBox does not hold yet need a prefix
- name: Find each new address's prefix
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/ipam/prefixes/?contains={{ item.item.ip }}"
    headers: "{{ netbox_headers }}"
  loop: "{{ nis_found.results }}"
  loop_control:
    label: "{{ item.item.host }} {{ item.item.ip }}"
  when: item.json.count == 0
  register: nis_prefixes

# The narrowest prefix gives the mask; without a description the host name says where the address came from
- name: Create the new inventory addresses
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/ipam/ip-addresses/"
    method: POST
    headers: "{{ netbox_headers }}"
    body_format: json
    body: >-
      {{ {'address': item.item.item.ip ~ '/' ~ (item.json.results | map(attribute='prefix') | map('regex_replace', '^.*/', '') | map('int') | max | default(32)),
          'status': item.item.item.status | default('active'),
          'description': item.item.item.description | default(item.item.item.host)}
         | combine({'dns_name': item.item.item.dns_name} if item.item.item.dns_name is defined else {}) }}
    status_code: [201]
  loop: "{{ nis_prefixes.results }}"
  loop_control:
    label: "{{ item.item.item.host }} {{ item.item.item.ip }}"
  when: item.json is defined
  register: nis_created

# Only the fields the host sets, and only when they differ, so curated records are otherwise left as they are
- name: Update the existing inventory addresses
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/ipam/ip-addresses/{{ nis_have.id }}/"
    method: PATCH
    headers: "{{ netbox_headers }}"
    body_format: json
    body: "{{ nis_wanted }}"
  loop: "{{ nis_found.results }}"
  loop_control:
    label: "{{ item.item.host }} {{ item.item.ip }}"
  vars:
    nis_have: "{{ item.json.results | first }}"
    nis_wanted: "{{ item.item | dict2items | selectattr('key', 'in', ['dns_name', 'description', 'status']) | items2dict }}"
    nis_current: "{{ {'dns_name': nis_have.dns_name | default(''), 'description': nis_have.description | default(''), 'status': nis_have.status.value} }}"
    nis_current_same_keys: "{{ dict(nis_wanted | list | zip(nis_wanted | list | map('extract', nis_current))) }}"
  when:
    - item.json.count > 0
    - nis_wanted | length > 0
    - nis_wanted != nis_current_same_keys
  changed_when: true
  register: nis_updated

# Shown so the run log says how many addresses the inventory supplies
- name: Report the inventory sync
  ansible.builtin.debug:
    msg: >-
      Inventory: {{ nis_records | default([]) | length }} addresses checked,
      {{ nis_created.results | default([]) | selectattr('json', 'defined') | list | length }} created,
      {{ nis_updated.results | default([]) | selectattr('json', 'defined') | list | length }} updated
