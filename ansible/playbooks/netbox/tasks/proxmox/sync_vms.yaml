---
# Splits the guests against what NetBox holds, then creates and updates the VMs

# Three buckets: a name differing only in case is reported rather than created, since NetBox names are case-sensitive and a duplicate would appear
- name: Bucket each Proxmox guest against NetBox
  ansible.builtin.set_fact:
    guests_to_create: >-
      {{ proxmox_guests | rejectattr('name', 'in', nb_names)
         | rejectattr('name', 'in', nb_names_ci) | list }}
    guests_to_update: "{{ proxmox_guests | selectattr('name', 'in', nb_names) | list }}"
    guests_name_mismatch: >-
      {{ proxmox_guests | rejectattr('name', 'in', nb_names)
         | selectattr('name', 'in', nb_names_ci) | list }}
    # Compared case-insensitively, so a NetBox name that differs only in case is not read as orphaned
    netbox_orphans: >-
      {{ nb_lower_map | dict2items | rejectattr('key', 'in', px_lower)
         | map(attribute='value') | list }}
  vars:
    nb_names: "{{ netbox_existing_vms.json.results | default([]) | map(attribute='name') | list }}"
    nb_lower_map: "{{ dict(nb_names | map('lower') | zip(nb_names)) }}"
    px_lower: "{{ proxmox_guests | map(attribute='name') | map('lower') | list }}"
    nb_names_ci: >-
      {{ proxmox_guests | map(attribute='name')
         | select('in', netbox_existing_vms.json.results | default([])
                        | map(attribute='name') | map('lower') | list)
         | list }}

# New VMs are tagged Dynamic and marked in their comments, which is how later runs recognise them
- name: Create virtual machines that NetBox does not have
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/virtualization/virtual-machines/"
    method: POST
    headers: "{{ netbox_headers }}"
    body_format: json
    body:
      name: "{{ item.name }}"
      cluster: "{{ netbox_cluster_id | int }}"
      virtual_machine_type: "{{ netbox_vm_type_id | int }}"
      device: "{{ netbox_device_by_node.get(item.node | lower) | default(omit, true) }}"
      status: "{{ 'active' if item.status == 'running' else 'offline' }}"
      start_on_boot: "{{ onboot_by_vmid.get(item.vmid | string) | default(omit, true) }}"
      vcpus: "{{ item.maxcpu | default(item.cpus) | default(omit) }}"
      memory: "{{ ((item.maxmem | default(0)) / 1048576) | round | int }}"
      # Set only at creation, as a placeholder: maxdisk is the boot disk alone, and the disk sync records the real volumes
      disk: "{{ ((item.maxdisk | default(0)) / 1048576) | round | int }}"
      tags: ["{{ netbox_dynamic_tag_id | int }}"]
      description: "VMID {{ item.vmid }}"
      comments: "Discovered by proxmox-vms-to-netbox.yaml."
    status_code: [201]
  loop: "{{ guests_to_create }}"
  loop_control:
    label: "{{ item.name }} (vmid {{ item.vmid }})"

# PATCH only the fields Proxmox owns; comments, role and tenancy stay curated, and disk is left out because NetBox derives it from the virtual disks
- name: Update the fields Proxmox is authoritative for
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/virtualization/virtual-machines/{{ netbox_vm_id_by_name[item.name] }}/"
    method: PATCH
    headers: "{{ netbox_headers }}"
    body_format: json
    body:
      cluster: "{{ netbox_cluster_id | int }}"
      virtual_machine_type: "{{ netbox_vm_type_id | int }}"
      device: "{{ netbox_device_by_node.get(item.node | lower) | default(omit, true) }}"
      status: "{{ 'active' if item.status == 'running' else 'offline' }}"
      start_on_boot: "{{ onboot_by_vmid.get(item.vmid | string) | default(omit, true) }}"
      vcpus: "{{ item.maxcpu | default(item.cpus) | default(omit) }}"
      memory: "{{ ((item.maxmem | default(0)) / 1048576) | round | int }}"
    status_code: [200]
  loop: "{{ guests_to_update }}"
  loop_control:
    label: "{{ item.name }} (vmid {{ item.vmid }})"

# Records from runs before the tag existed are found by the comment marker and tagged once
- name: Backfill the Dynamic tag onto VMs the Proxmox sync created earlier
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/virtualization/virtual-machines/{{ item.id }}/"
    method: PATCH
    headers: "{{ netbox_headers }}"
    body_format: json
    body:
      tags: "{{ (item.tags | map(attribute='id') | list) + [netbox_dynamic_tag_id | int] }}"
    status_code: [200]
  loop: >-
    {{ netbox_existing_vms.json.results | default([])
       | selectattr('comments', 'defined')
       | selectattr('comments', 'search', 'proxmox-vms-to-netbox')
       | list }}
  loop_control:
    label: "{{ item.name }}"
  when:
    - netbox_dynamic_tag_id is defined
    - "'dynamic' not in (item.tags | map(attribute='slug') | list)"
  register: nb_tag_backfill
