---
# Resolves the cluster name and loads the Proxmox API credentials from Vault; fails fast when anything is missing

# Read through hostvars, since a bare netbox_cluster_name here would refer to the fact being set; an unset env lookup is '', so default(x, true) falls through it
- name: Resolve the NetBox cluster name
  ansible.builtin.set_fact:
    netbox_cluster_name: >-
      {{ lookup('ansible.builtin.env', 'NETBOX_CLUSTER_NAME')
         | default(hostvars[inventory_hostname]['netbox_cluster_name'] if 'netbox_cluster_name' in hostvars[inventory_hostname] else '', true)
         | default('PVE-Cluster', true) }}

# Proxmox's API token from the proxmox path; vault_proxmox_path renames it
- name: Load the Proxmox credentials
  ansible.builtin.include_tasks: ../../../../tasks/var_lookup.yaml
  vars:
    vault_secrets:
      - { path: "{{ vault_proxmox_path | default('proxmox') }}", field: PROXMOX_API_URL, var: proxmox_api_url }
      - { path: "{{ vault_proxmox_path | default('proxmox') }}", field: PROXMOX_API_TOKEN_ID, var: proxmox_api_token_id }
      - { path: "{{ vault_proxmox_path | default('proxmox') }}", field: PROXMOX_API_TOKEN_SECRET, var: proxmox_api_token_secret }

# Stop before calling Proxmox when a setting is missing
- name: Validate the Proxmox settings
  ansible.builtin.assert:
    that:
      - netbox_cluster_name | length > 0
      - proxmox_api_url | length > 0
      - proxmox_api_token_id | length > 0
      - proxmox_api_token_secret | length > 0
    fail_msg: "The Proxmox fields PROXMOX_API_URL, PROXMOX_API_TOKEN_ID and PROXMOX_API_TOKEN_SECRET belong at {{ vault_proxmox_path | default('proxmox') }} in Vault."
    quiet: true

# Built once as facts, so every Proxmox step can reuse them
- name: Build the Proxmox headers and base URL
  ansible.builtin.set_fact:
    proxmox_headers:
      Authorization: "PVEAPIToken={{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
      Accept: application/json
    proxmox_api_base: "{{ proxmox_api_url | regex_replace('/+$', '') }}"
  no_log: true
