---
# Syncs Proxmox VMs and LXCs into NetBox (VMs, interfaces, MACs, IPs and disks), then removes Dynamic-tagged records for guests Proxmox no longer reports; safe to re-run
# Environment: VAULT_ADDR, VAULT_TOKEN, VAULT_KV_MOUNT, NETBOX_URL (or netbox_url), and optionally NETBOX_CLUSTER_NAME (or netbox_cluster_name, default PVE-Cluster)
# Vault: PROXMOX_API_URL, PROXMOX_API_TOKEN_ID and PROXMOX_API_TOKEN_SECRET at proxmox, NETBOX_TOKEN at netbox; vault_proxmox_path and vault_netbox_path rename them
# Extra vars: include_lxc (default true), validate_certs for the Proxmox API (default true)
- name: Sync Proxmox VMs into NetBox
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    include_lxc: true

  tasks:
    - ansible.builtin.import_tasks: tasks/01-set-vars.yaml
    - ansible.builtin.import_tasks: tasks/02-connect-netbox.yaml
    - ansible.builtin.import_tasks: tasks/03-connect-proxmox.yaml
    - ansible.builtin.import_tasks: tasks/04-gather-proxmox.yaml
    - ansible.builtin.import_tasks: tasks/05-sync-vms.yaml
    - ansible.builtin.import_tasks: tasks/06-sync-interfaces.yaml
    - ansible.builtin.import_tasks: tasks/07-sync-macs.yaml
    - ansible.builtin.import_tasks: tasks/08-sync-ips.yaml
    - ansible.builtin.import_tasks: tasks/09-sync-disks.yaml
    - ansible.builtin.import_tasks: tasks/10-reclaim.yaml
    - ansible.builtin.import_tasks: tasks/11-results.yaml
