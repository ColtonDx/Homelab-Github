---
# Task file: reserves addresses in OPNsense Dnsmasq, one host record per entry giving both the DNS name and the DHCP reservation; called after Terraform applies and by dnsmasq-reserve-ip.yaml
# Needs opnsense_reservations, a list of {name, ip, mac}; an empty list does nothing; domain (from the inventory) is the record's domain unless opnsense_domain is set
# Records are matched by their description, which is the full name, so a re-run updates the record in place, including a new IP or MAC
# Firewall: opnsense_firewall, else the firewalls group's first host's ansible_host; opnsense_ssl_verify (default true)
# Vault: FIREWALL_KEY and FIREWALL_SECRET at opnsense (vault_opnsense_path renames it); reads Vault through VAULT_ADDR and VAULT_TOKEN
# Needs the oxlorg.opnsense collection and the httpx package on the runner

# Everything below needs at least one entry
- name: Reserve the addresses in OPNsense
  when: opnsense_reservations | default([]) | length > 0
  # Every call in here runs from the controller without privilege escalation
  delegate_to: localhost
  become: false
  block:
    # A bad entry would otherwise reach the firewall as a broken record
    - name: Validate the reservations
      ansible.builtin.assert:
        that:
          - item.name | default('') is match('^[A-Za-z0-9][A-Za-z0-9-]*$')
          - item.ip | default('') is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
          - item.mac | default('') is match('^([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$')
        fail_msg: "Reservation {{ item.name | default('(no name)') }}: needs a host name (letters, digits and dashes), an IPv4 ip and a MAC address."
        quiet: true
      loop: "{{ opnsense_reservations }}"
      loop_control:
        label: "{{ item.name | default('(no name)') }}"


    # The same API key the DHCP-to-NetBox sync uses
    - name: Load the OPNsense API key
      ansible.builtin.include_tasks: ../../../tasks/var_lookup.yaml
      vars:
        vault_secrets:
          - path: "{{ vault_opnsense_path | default('opnsense') }}"
            field: FIREWALL_KEY
            var: opnsense_api_key
          - path: "{{ vault_opnsense_path | default('opnsense') }}"
            field: FIREWALL_SECRET
            var: opnsense_api_secret

    # The firewall the inventory already describes, unless the caller names another
    - name: Find the firewall
      ansible.builtin.set_fact:
        opnsense_target: "{{ opnsense_firewall | default(hostvars[groups['firewalls'][0]].ansible_host if groups['firewalls'] | default([]) | length > 0 else '', true) }}"

    # Without a firewall there is nowhere to write the records
    - name: Require the firewall
      ansible.builtin.assert:
        that:
          - opnsense_target | length > 0
        fail_msg: "Set opnsense_firewall, or put the firewall in the inventory's firewalls group with an ansible_host."
        quiet: true

    # Written without a reload each, so Dnsmasq restarts once for the whole batch below
    - name: Write the host records
      oxlorg.opnsense.dnsmasq_host:
        firewall: "{{ opnsense_target }}"
        api_key: "{{ opnsense_api_key }}"
        api_secret: "{{ opnsense_api_secret }}"
        ssl_verify: "{{ opnsense_ssl_verify | default(true) | bool }}"
        description: "{{ item.name }}.{{ opnsense_domain | default(domain) }}"
        host: "{{ item.name }}"
        domain: "{{ opnsense_domain | default(domain) }}"
        ip: ["{{ item.ip }}"]
        hardware_addr: ["{{ item.mac | lower | replace('-', ':') }}"]
        comments: "Managed by Ansible after a Terraform build"
        state: present
        reload: false
      loop: "{{ opnsense_reservations }}"
      loop_control:
        label: "{{ item.name }} {{ item.ip }}"
      register: opnsense_records

    # Applies every change at once; skipped when nothing changed
    - name: Reload Dnsmasq
      oxlorg.opnsense.reload:
        firewall: "{{ opnsense_target }}"
        api_key: "{{ opnsense_api_key }}"
        api_secret: "{{ opnsense_api_secret }}"
        ssl_verify: "{{ opnsense_ssl_verify | default(true) | bool }}"
        target: dnsmasq
      when: opnsense_records is changed

    # Shown so the run log says what was reserved
    - name: Report the reservations
      ansible.builtin.debug:
        msg: "Reserved in OPNsense: {{ opnsense_reservations | map(attribute='name') | zip(opnsense_reservations | map(attribute='ip')) | map('join', ' = ') | join(', ') }}"
