---
# Renews the acme.sh certificates on the ACME hosts now instead of waiting for the nightly cron; the hosts' TLS playbooks issue them first
# acme.sh reuses the Cloudflare token and reload command it saved at issue, so the service reloads on its own and nothing comes from Vault
# Optional: target_hosts (default acme), acme_domain to renew one domain, acme_force=false to renew only certificates that are due
# Forced renewals count toward Let's Encrypt's limit of 5 identical certificates a week, so avoid repeated forced runs
- name: Renew ACME certificates
  hosts: "{{ target_hosts | default('acme') }}"
  become: true
  gather_facts: false

  vars:
    acme_sh: /root/.acme.sh/acme.sh

  tasks:
    # A host without acme.sh has never had a certificate issued, so it is skipped rather than failed
    - name: Check acme.sh is installed
      ansible.builtin.stat:
        path: "{{ acme_sh }}"
      register: renew_acme_sh

    # Points at the TLS playbook that sets the host up
    - name: Skip hosts without acme.sh
      ansible.builtin.debug:
        msg: "acme.sh is not installed on {{ inventory_hostname }}; run its TLS playbook under tls/ first."
      when: not renew_acme_sh.stat.exists

    # Ends this host's run only; other hosts carry on
    - name: Stop for hosts without acme.sh
      ansible.builtin.meta: end_host
      when: not renew_acme_sh.stat.exists

    # Every certificate acme.sh manages here, as a header line plus one pipe-separated line each
    - name: List the certificates on the host
      ansible.builtin.command:
        argv: ["{{ acme_sh }}", --list, --listraw]
      register: renew_list
      changed_when: false

    # Columns are matched by header name, since newer acme.sh versions add columns
    - name: Read the certificate list
      ansible.builtin.set_fact:
        renew_certs: "{{ renew_certs | default([]) + [dict(renew_header | zip(item.split('|')))] }}"
      loop: "{{ renew_list.stdout_lines[1:] | select | list }}"
      vars:
        renew_header: "{{ renew_list.stdout_lines[0].split('|') }}"

    # One domain when acme_domain is set, otherwise all of them
    - name: Pick the certificates to renew
      ansible.builtin.set_fact:
        renew_targets: "{{ renew_certs | default([]) | selectattr('Main_Domain', 'equalto', acme_domain) | list if acme_domain | default('') | length > 0 else renew_certs | default([]) }}"

    # A named domain that is not on the host is almost always a typo or the wrong host
    - name: Require the named domain on this host
      ansible.builtin.assert:
        that:
          - renew_targets | length > 0
        fail_msg: "{{ acme_domain | default('No certificate') }} is not managed by acme.sh on {{ inventory_hostname }}."
      when: acme_domain | default('') | length > 0

    # Force renews now; without it acme.sh renews only certificates past their renewal date and exits 2 for the rest
    - name: Renew the certificates
      ansible.builtin.command:
        argv: "{{ [acme_sh, '--renew', '-d', item.Main_Domain] + (['--ecc'] if 'ec' in item.KeyLength else []) + (['--force'] if acme_force | default(true) | bool else []) }}"
      loop: "{{ renew_targets }}"
      loop_control:
        label: "{{ item.Main_Domain }}"
      register: renew_result
      changed_when: renew_result.rc == 0
      failed_when: renew_result.rc not in [0, 2]

    # The saved reload command ran during the renewal, so this is the certificate the service now serves
    - name: Read the new expiry dates
      ansible.builtin.command:
        argv: [openssl, x509, -noout, -enddate, -in, "{{ acme_sh | dirname }}/{{ item.Main_Domain }}{{ '_ecc' if 'ec' in item.KeyLength else '' }}/fullchain.cer"]
      loop: "{{ renew_targets }}"
      loop_control:
        label: "{{ item.Main_Domain }}"
      register: renew_expiry
      changed_when: false

    # One line per certificate in the run log
    - name: Report the certificates
      ansible.builtin.debug:
        msg: "{{ item.item.Main_Domain }}: {{ 'renewed' if item.item.Main_Domain in (renew_result.results | selectattr('rc', 'equalto', 0) | map(attribute='item.Main_Domain')) else 'not due' }}, expires {{ item.stdout | regex_replace('^notAfter=', '') }}"
      loop: "{{ renew_expiry.results }}"
      loop_control:
        label: "{{ item.item.Main_Domain }}"
