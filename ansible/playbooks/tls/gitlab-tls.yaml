---
# Issues and renews GitLab's TLS certificate with acme.sh and switches GitLab to HTTPS; deployment/app-gitlab.yaml runs it, and it can run alone; safe to re-run
# Inventory: gitlab_domain (required); Vault fields at cloudflare: CF_API and CF_EMAIL, used by acme_cert.yaml for the DNS challenge
# Renewals run from acme.sh's cron and reload nginx only, so GitLab stays up
- name: Configure GitLab TLS certificate
  hosts: gitlab
  become: true
  gather_facts: true

  vars:
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') }}"
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    vault_kv_mount: "{{ lookup('env', 'VAULT_KV_MOUNT') | default('secret', true) }}"
    vault_secrets:
      - path: "{{ vault_cloudflare_path | default('cloudflare') }}"
        field: CF_API
        var: cloudflare_api_token
      - path: "{{ vault_cloudflare_path | default('cloudflare') }}"
        field: CF_EMAIL
        var: acme_email

  pre_tasks:
    # Stop before touching the host when the domain is missing
    - name: Validate the GitLab inputs
      ansible.builtin.assert:
        that:
          - gitlab_domain | default('') | length > 0
        fail_msg: "gitlab_domain must be set in the inventory."

    # The reload command and the URL block both need an installed GitLab
    - name: Check GitLab is installed
      ansible.builtin.stat:
        path: "{{ gitlab_rb_path | default('/etc/gitlab/gitlab.rb') }}"
      register: gitlab_rb_stat

    # Fail with a clear next step rather than partway through
    - name: Require app-gitlab.yaml to have run
      ansible.builtin.assert:
        that:
          - gitlab_rb_stat.stat.exists
        fail_msg: "GitLab's gitlab.rb was not found; run deployment/app-gitlab.yaml first."

    # Read the Cloudflare credentials acme_cert.yaml needs
    - name: Load Vault secrets
      ansible.builtin.include_tasks: ../../tasks/var_lookup.yaml

  tasks:
    # One place for every path, so the certificate lands where the URL block points
    - name: Set GitLab config and certificate paths
      ansible.builtin.set_fact:
        gitlab_rb_file: "{{ gitlab_rb_path | default('/etc/gitlab/gitlab.rb') }}"
        gitlab_ssl_path: "{{ gitlab_ssl_dir | default('/etc/gitlab/ssl') }}"
        gitlab_cert_file: "{{ gitlab_ssl_dir | default('/etc/gitlab/ssl') }}/{{ gitlab_domain }}.crt"
        gitlab_key_file: "{{ gitlab_ssl_dir | default('/etc/gitlab/ssl') }}/{{ gitlab_domain }}.key"

    # acme_cert.yaml installs the certificate at the paths the URL block expects and reloads nginx on every renewal
    - name: Set ACME vars for GitLab
      ansible.builtin.set_fact:
        acme_domain: "{{ gitlab_domain }}"
        acme_ssl_dir: "{{ gitlab_ssl_path }}"
        acme_key_path: "{{ gitlab_key_file }}"
        acme_fullchain_path: "{{ gitlab_cert_file }}"
        acme_reloadcmd: "gitlab-ctl hup nginx"

    # Issue or renew the certificate over a Cloudflare DNS challenge, which needs nothing from GitLab itself
    - name: Issue and install ACME certificate
      ansible.builtin.include_tasks: tasks/acme_cert.yaml

    # Earlier versions wrote TLS settings in a separate block, which the managed block below replaces
    - name: Remove the TLS block written by earlier versions
      ansible.builtin.blockinfile:
        path: "{{ gitlab_rb_file }}"
        marker: "# {mark} ANSIBLE MANAGED SSL CONFIG"
        state: absent
      notify: Reconfigure GitLab

    # This playbook owns the URL once it has run; written at the end of gitlab.rb so it overrides any earlier external_url
    - name: Switch GitLab to HTTPS
      ansible.builtin.blockinfile:
        path: "{{ gitlab_rb_file }}"
        marker: "# {mark} ANSIBLE MANAGED URL AND TLS CONFIG"
        block: |
          external_url "https://{{ gitlab_domain }}"
          letsencrypt['enable'] = false
          nginx['ssl_certificate'] = "{{ gitlab_cert_file }}"
          nginx['ssl_certificate_key'] = "{{ gitlab_key_file }}"
      notify: Reconfigure GitLab

    # Comment out any other external_url so gitlab.rb has exactly one; the before match keeps the managed block untouched
    - name: Disable external_url lines outside the managed block
      ansible.builtin.replace:
        path: "{{ gitlab_rb_file }}"
        regexp: '^(external_url\s.*)$'
        replace: '# \1  # superseded by the managed block below'
        before: "# BEGIN ANSIBLE MANAGED URL AND TLS CONFIG"
      notify: Reconfigure GitLab

  handlers:
    # Applies gitlab.rb changes; runs once at the end of the play if anything changed
    - name: Reconfigure GitLab
      ansible.builtin.command: gitlab-ctl reconfigure
      changed_when: true
