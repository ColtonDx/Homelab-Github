---
# Issues and renews HashiCorp Vault's TLS certificate with acme.sh, reloading Vault on renewal so it is never restarted and sealed
# Inventory: vault_domain (required); Vault fields at cloudflare: CF_API and CF_EMAIL, used by acme_cert.yaml for the DNS challenge
# Bootstrap: the Cloudflare token is read from this same Vault, so it must be running and unsealed; cron renewals do not need it
- name: Configure HashiCorp Vault TLS certificate
  hosts: vault
  become: true
  gather_facts: true

  vars:
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') }}"
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    vault_kv_mount: "{{ lookup('env', 'VAULT_KV_MOUNT') | default('secret', true) }}"
    vault_tls_dir: /opt/vault/tls
    vault_secrets:
      - path: "{{ vault_cloudflare_path | default('cloudflare') }}"
        field: CF_API
        var: cloudflare_api_token
      - path: "{{ vault_cloudflare_path | default('cloudflare') }}"
        field: CF_EMAIL
        var: acme_email

  pre_tasks:
    # Stop before touching the host when the domain is missing
    - name: Validate the Vault inputs
      ansible.builtin.assert:
        that:
          - vault_domain | default('') | length > 0
        fail_msg: "vault_domain must be set in the inventory."

    # Read the Cloudflare credentials acme_cert.yaml needs
    - name: Load Vault secrets
      ansible.builtin.include_tasks: ../../tasks/var_lookup.yaml

  tasks:
    # A reload re-reads the certificate through SIGHUP, but only if the service defines it; a restart would seal Vault
    - name: Read how the Vault service handles reload
      ansible.builtin.command: systemctl show vault --property=ExecReload --value
      register: vault_exec_reload
      changed_when: false

    # Refuse to install a reload command that would do nothing on this host
    - name: Check the Vault service supports reload
      ansible.builtin.assert:
        that:
          - vault_exec_reload.stdout | trim | length > 0
        fail_msg: >-
          The vault service has no ExecReload, so systemctl reload vault would not load a renewed certificate.
          Add ExecReload=/bin/kill --signal HUP $MAINPID to the unit, as HashiCorp's packaged unit does.

    # acme.sh writes as root, so the reload command hands the files back to Vault on every install and renewal before reloading
    - name: Set ACME vars for HashiCorp Vault
      ansible.builtin.set_fact:
        acme_domain: "{{ vault_domain }}"
        acme_ssl_dir: "{{ vault_tls_dir }}"
        acme_key_path: "{{ vault_tls_dir }}/tls.key"
        acme_fullchain_path: "{{ vault_tls_dir }}/tls.crt"
        acme_reloadcmd: >-
          chown vault:vault {{ vault_tls_dir }}/tls.key {{ vault_tls_dir }}/tls.crt
          && chmod 0600 {{ vault_tls_dir }}/tls.key
          && systemctl reload vault
        acme_ssl_owner: vault
        acme_ssl_group: vault

    # Issue or renew the certificate over a Cloudflare DNS challenge and install it with the reload command above
    - name: Issue and install ACME certificate
      ansible.builtin.include_tasks: tasks/acme_cert.yaml
