---
# Task file: issues, renews and installs one ACME (Let's Encrypt) certificate with acme.sh over a Cloudflare DNS-01 challenge; each app playbook includes it with its own settings
# Required: cloudflare_api_token and acme_email (from Vault), acme_domain, acme_ssl_dir, acme_key_path, acme_fullchain_path, acme_reloadcmd (from the app playbook)
# Optional: acme_ssl_owner and acme_ssl_group (default root), acme_renew_days (default 30), acme_force (default false) to renew whatever the expiry
# Issues when acme.sh holds no certificate, renews when it expires within acme_renew_days or when forced, and installs whenever the service's copy differs
# acme.sh saves the paths and reload command, so later renewals need only renew-certificates.yaml or its nightly cron

# Stop early if the app playbook did not set everything this needs
- name: Validate required ACME variables
  ansible.builtin.assert:
    that:
      - acme_domain is defined and acme_domain | length > 0
      - acme_ssl_dir is defined
      - acme_key_path is defined
      - acme_fullchain_path is defined
      - acme_reloadcmd is defined
      - cloudflare_api_token is defined
      - acme_email is defined
    quiet: true

# acme.sh renews through cron, so Debian hosts need the cron package
- name: Ensure cron daemon is installed (Debian)
  ansible.builtin.apt:
    name: cron
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
  when: ansible_facts.os_family == 'Debian'

# Red Hat hosts get cron from the cronie package
- name: Ensure cron daemon is installed (RedHat)
  ansible.builtin.package:
    name: cronie
    state: present
  when: ansible_facts.os_family == 'RedHat'

# Keep cron running so scheduled renewals actually happen
- name: Ensure cron daemon is enabled and running
  ansible.builtin.service:
    name: "{{ 'crond' if ansible_facts.os_family == 'RedHat' else 'cron' }}"
    state: started
    enabled: true

# Create the folder the service reads its certificate from
- name: Ensure SSL directory exists
  ansible.builtin.file:
    path: "{{ acme_ssl_dir }}"
    state: directory
    owner: "{{ acme_ssl_owner | default('root') }}"
    group: "{{ acme_ssl_group | default('root') }}"
    mode: "0750"

# Skip the download and install steps when acme.sh is already present
- name: Check if acme.sh is installed
  ansible.builtin.stat:
    path: /root/.acme.sh/acme.sh
  register: acme_sh_stat

# acme.sh lives in root's home, readable only by root
- name: Ensure acme.sh directory exists
  ansible.builtin.file:
    path: /root/.acme.sh
    state: directory
    owner: root
    group: root
    mode: "0700"

# Fetch acme.sh on first run only
- name: Download acme.sh source archive
  ansible.builtin.get_url:
    url: https://github.com/acmesh-official/acme.sh/archive/master.tar.gz
    dest: /root/.acme.sh/acme.tar.gz
    mode: "0600"
  when: not acme_sh_stat.stat.exists

# Unpack the download into the acme.sh folder
- name: Extract acme.sh
  ansible.builtin.unarchive:
    src: /root/.acme.sh/acme.tar.gz
    dest: /root/.acme.sh
    remote_src: true
    extra_opts: [--strip-components=1]
  when: not acme_sh_stat.stat.exists

# Run acme.sh's own installer, which is skipped once acme.sh exists
- name: Install acme.sh
  ansible.builtin.shell: |
    cd /root/.acme.sh
    ./acme.sh --install --home /root/.acme.sh
  args:
    creates: /root/.acme.sh/acme.sh
  when: not acme_sh_stat.stat.exists

# acme.sh takes the token from the environment below and saves it itself, so remove the extra copy older runs wrote
- name: Remove the unused Cloudflare credentials file
  ansible.builtin.file:
    path: /root/.acme.sh/cloudflare.env
    state: absent

# acme.sh defaults to ZeroSSL, so point it at Let's Encrypt
- name: Set default CA to Let's Encrypt
  ansible.builtin.command: /root/.acme.sh/acme.sh --set-default-ca --server letsencrypt
  changed_when: false

# Check for due renewals every night at midnight, so certificates renew between runs of this playbook
- name: Ensure acme.sh cron job is installed
  ansible.builtin.cron:
    name: "acme.sh auto-renew"
    minute: "0"
    hour: "0"
    job: '"/root/.acme.sh"/acme.sh --cron --home "/root/.acme.sh" > /dev/null'
    user: root

# Where acme.sh keeps this domain's certificate
- name: Set the acme.sh store paths
  ansible.builtin.set_fact:
    acme_store_dir: "/root/.acme.sh/{{ acme_domain }}_ecc"
    acme_store_fullchain: "/root/.acme.sh/{{ acme_domain }}_ecc/fullchain.cer"

# Request the certificate through a Cloudflare DNS challenge; skipped once a key exists for the domain
- name: Issue certificate using Cloudflare DNS
  ansible.builtin.shell: |
    export CF_Token="{{ cloudflare_api_token }}"
    export CF_Email="{{ acme_email }}"
    /root/.acme.sh/acme.sh --issue \
      --dns dns_cf \
      -d "{{ acme_domain }}" \
      --keylength ec-256
  args:
    creates: "{{ acme_store_dir }}/{{ acme_domain }}.key"
  register: acme_issue
  no_log: true

# Exits 1 when the certificate expires within acme_renew_days, which includes one already expired
- name: Check the certificate's expiry
  ansible.builtin.command:
    argv: [openssl, x509, -noout, -in, "{{ acme_store_fullchain }}", -checkend, "{{ (acme_renew_days | default(30) | int) * 86400 }}"]
  register: acme_expiry_check
  changed_when: false
  failed_when: acme_expiry_check.rc not in [0, 1]
  check_mode: false
  when: acme_issue is not changed

# Renews now when forced or close to expiry; otherwise acme.sh's nightly cron keeps its own schedule
- name: Renew the certificate
  ansible.builtin.shell: |
    export CF_Token="{{ cloudflare_api_token }}"
    export CF_Email="{{ acme_email }}"
    /root/.acme.sh/acme.sh --renew --force \
      --dns dns_cf \
      -d "{{ acme_domain }}" \
      --ecc
  register: acme_renew
  when:
    - acme_issue is not changed
    - (acme_force | default(false) | bool) or (acme_expiry_check.rc | default(0)) == 1
  no_log: true

# Compared with acme.sh's copy below, so a service left on an old certificate is caught even when acme.sh itself is current
- name: Check installed key
  ansible.builtin.stat:
    path: "{{ acme_key_path }}"
  register: acme_key_stat

# Checksummed against acme.sh's copy to tell whether the service has the current certificate
- name: Check installed fullchain
  ansible.builtin.stat:
    path: "{{ acme_fullchain_path }}"
    checksum_algorithm: sha256
  register: acme_fullchain_stat

# The certificate acme.sh holds now, after any issue or renewal above
- name: Check acme.sh's fullchain
  ansible.builtin.stat:
    path: "{{ acme_store_fullchain }}"
    checksum_algorithm: sha256
  register: acme_store_stat

# acme.sh saves the reload command at install time and cron renewals reuse it, so check the saved one is still current
- name: Read acme.sh's saved settings for this domain
  ansible.builtin.slurp:
    src: "{{ acme_store_dir }}/{{ acme_domain }}.conf"
  register: acme_domain_conf
  failed_when: false

# acme.sh stores the command base64-encoded between these markers
- name: Check whether the saved reload command matches
  ansible.builtin.set_fact:
    acme_reloadcmd_saved: >-
      {{ ('__ACME_BASE64__START_' ~ (acme_reloadcmd | b64encode) ~ '__ACME_BASE64__END_')
         in (acme_domain_conf.content | default('') | b64decode) }}

# Copy the certificate to the service and reload it when it is missing, differs from acme.sh's, or the saved reload command is out of date
- name: Install certificate into target directory and reload service
  ansible.builtin.shell: |
    /root/.acme.sh/acme.sh --install-cert -d "{{ acme_domain }}" \
      --ecc \
      --key-file       {{ acme_key_path }} \
      --fullchain-file {{ acme_fullchain_path }} \
      --reloadcmd      "{{ acme_reloadcmd }}"
  register: acme_install
  when: >-
    (not acme_key_stat.stat.exists)
    or (not acme_fullchain_stat.stat.exists)
    or acme_fullchain_stat.stat.checksum | default('') != acme_store_stat.stat.checksum | default('-')
    or (not acme_reloadcmd_saved | bool)

# The certificate the service now has, for the report
- name: Read the installed expiry date
  ansible.builtin.command:
    argv: [openssl, x509, -noout, -enddate, -in, "{{ acme_fullchain_path }}"]
  register: acme_enddate
  changed_when: false
  check_mode: false
  failed_when: false

# One line per host in the run log
- name: Report the certificate
  ansible.builtin.debug:
    msg: "{{ acme_domain }}: {{ acme_action }}{{ ', installed' if acme_install is changed else '' }}; expires {{ acme_expires }}"
  vars:
    acme_action: >-
      {{ 'issued' if acme_issue is changed
         else 'renewed (forced)' if acme_renew is changed and acme_force | default(false) | bool
         else 'renewed (expiring within ' ~ (acme_renew_days | default(30)) ~ ' days)' if acme_renew is changed
         else 'current' }}
    acme_expires: "{{ acme_enddate.stdout | default('') | regex_replace('^notAfter=', '') | default('unknown', true) }}"
