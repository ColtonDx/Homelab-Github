---
# Task file: gives this switch the password network/login.yaml loaded from Vault, which network_cli logs in with
- name: Use the password loaded from Vault
  ansible.builtin.set_fact:
    ansible_password: "{{ hostvars['localhost']['switch_password_' ~ (inventory_hostname | regex_replace('[^A-Za-z0-9_]', '_'))] }}"
  no_log: true
