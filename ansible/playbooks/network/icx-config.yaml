---
# Compares each ICX switch's running config with the config its inventory defines and reports every difference; with apply=true it also sends
# the lines the switch is missing (never removes anything) and saves the config when it changed
# The inventory describes the switch with fastiron_* variables (host_vars): fastiron_global (top-level lines, or {line, children} blocks),
# fastiron_vlans ({id, name, tagged ('all' or a port list), untagged, router_interface}), fastiron_all_ports (the port list 'all' means),
# fastiron_port_groups ({prefix like 1/1, first, last, settings}), fastiron_port_overrides (per port, e.g. '1/1/36': {name, dual_mode, speed, poe})
# and fastiron_router_interfaces ({name like 've 100', lines}); templates/fastiron-config.j2 renders them
# Left out of the comparison: user accounts, SNMP communities and the version line (fastiron_ignore adds more patterns)
# Extra vars: target_hosts (default switches), fail_on_drift (default false; true fails the run when they differ, for scheduled checks),
# apply (default false; without it the run only lists the commands it would send), allow_protected (default false)
# Inventory: fastiron_protected lists patterns for blocks or lines a run may not change unless allow_protected=true, such as the management interface
# Needs community.network on the runner; logs in through login.yaml like the other network playbooks

- name: Load the switch passwords
  ansible.builtin.import_playbook: login.yaml

- name: Compare each switch's config with the inventory
  hosts: "{{ target_hosts | default('switches') }}"
  gather_facts: false

  vars:
    # Lines that are not compared or reported: the version banner, and anything that can carry a password, key or community string,
    # since lines found only on the switch are printed in the run log
    fastiron_ignore_default:
      - '^ver '
      - '^Current configuration'
      - '^end$'
      - '^username '
      - '^snmp-server (community|user|group) '
      - '^enable .*password'
      - '^(radius|tacacs)-server '
      - '(password|secret|key-string)'

  tasks:
    - name: Use the password loaded from Vault
      ansible.builtin.include_tasks: tasks/use_password.yaml

    # The output holds password hashes and SNMP communities, so it stays out of the log
    - name: Read the running config
      community.network.icx_command:
        commands: ["show running-config"]
      register: fastiron_running
      no_log: true

    - name: Compare it with the inventory's config
      ansible.builtin.set_fact:
        fastiron_missing: "{{ fastiron_wanted | difference(fastiron_have) }}"
        fastiron_extra: "{{ fastiron_have | difference(fastiron_wanted) }}"
      vars:
        fastiron_patterns: "{{ fastiron_ignore_default + fastiron_ignore | default([]) }}"
        fastiron_wanted: "{{ lookup('ansible.builtin.template', 'templates/fastiron-config.j2') | fastiron_lines(fastiron_patterns) }}"
        fastiron_have: "{{ fastiron_running.stdout[0] | fastiron_lines(fastiron_patterns) }}"

    - name: Report the differences
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }}: {{ 'matches the inventory' if (fastiron_missing + fastiron_extra) | length == 0 else 'differs from the inventory' }}"
          - "In the inventory but not on the switch: {{ fastiron_missing }}"
          - "On the switch but not in the inventory: {{ fastiron_extra }}"

    - name: Fail when the switch has drifted
      ansible.builtin.assert:
        that: (fastiron_missing + fastiron_extra) | length == 0
        fail_msg: "{{ inventory_hostname }}'s running config differs from the inventory; see the report above."
      when: fail_on_drift | default(false) | bool

    # What apply would send: each missing line inside its block; lines only on the switch are reported above, never removed
    - name: Work out the commands for the missing lines
      ansible.builtin.set_fact:
        fastiron_pushes: "{{ fastiron_missing | fastiron_commands }}"
        fastiron_blocked: >-
          {{ fastiron_missing | select('search', fastiron_protected | join('|')) | list if fastiron_protected | default([]) | length > 0 else [] }}

    - name: Show the commands
      ansible.builtin.debug:
        msg: "{{ ['Nothing to send'] if fastiron_pushes | length == 0 else fastiron_pushes }}"

    # The management interface and its VLAN carry this very connection, so a bad push there cuts off Ansible and everyone else
    - name: Refuse to change protected config
      ansible.builtin.assert:
        that: fastiron_blocked | length == 0 or allow_protected | default(false) | bool
        fail_msg: "These changes touch protected config and need allow_protected=true: {{ fastiron_blocked }}"
      when: apply | default(false) | bool

    # One push per block; match none sends exactly these lines, since the comparison above already chose them
    - name: Send the missing lines
      community.network.icx_config:
        parents: "{{ item.parents if item.parents | length > 0 else omit }}"
        lines: "{{ item.lines }}"
        match: none
      loop: "{{ fastiron_pushes }}"
      loop_control:
        label: "{{ item.parents | first | default('top level') }}"
      when: apply | default(false) | bool

    # Kept to runs that changed something, so a clean run never writes the switch's flash
    - name: Save the config
      community.network.icx_command:
        commands: ["write memory"]
      when:
        - apply | default(false) | bool
        - fastiron_pushes | length > 0
      changed_when: true
