---
# Service: External Secrets Operator, syncing Vault KV2 into cluster Secrets
# Requires Vault-side setup first, see the assertions below; safe to re-run

# The Helm chart and the Vault store are both applied from the first server
- name: Deploy External Secrets Operator
  hosts: k3s_nodes[0]
  become: true
  gather_facts: false
  any_errors_fatal: true

  vars:
    eso_namespace: external-secrets
    eso_repo: https://charts.external-secrets.io
    # Unset takes the newest chart; set to pin a version
    eso_chart_version: ""
    # Vault role bound to the ESO ServiceAccount, created by the operator docs below.
    eso_vault_role: eso
    eso_vault_mount: kubernetes
    vault_addr: "{{ lookup('ansible.builtin.env', 'VAULT_ADDR') }}"
    vault_kv_mount: "{{ lookup('ansible.builtin.env', 'VAULT_KV_MOUNT') | default('kv', true) }}"
    k3s_manifest_dir: /var/lib/rancher/k3s/server/manifests

  tasks:
    # ESO reaches Vault from inside the cluster, so the address must be set
    - name: Validate the Vault address
      ansible.builtin.assert:
        that:
          - vault_addr | string | length > 0
        fail_msg: "VAULT_ADDR must be set; ESO connects to Vault directly from the cluster."

    # Fails early when K3s is not up on this node
    - name: Confirm the cluster is reachable
      ansible.builtin.command: k3s kubectl get nodes --no-headers
      changed_when: false

    # A K3s HelmChart, so no helm binary is needed on the node
    - name: Install External Secrets Operator
      ansible.builtin.copy:
        dest: "{{ k3s_manifest_dir }}/external-secrets.yaml"
        mode: "0600"
        content: |
          apiVersion: helm.cattle.io/v1
          kind: HelmChart
          metadata:
            name: external-secrets
            namespace: kube-system
          spec:
            chart: external-secrets
            repo: {{ eso_repo }}
            version: "{{ eso_chart_version }}"
            targetNamespace: {{ eso_namespace }}
            createNamespace: true
            valuesContent: |-
              installCRDs: true

    # Applied now rather than waiting on the addon manager's poll
    - name: Apply the External Secrets chart
      ansible.builtin.command: k3s kubectl apply -f {{ k3s_manifest_dir }}/external-secrets.yaml
      register: eso_apply
      changed_when: "'created' in eso_apply.stdout or 'configured' in eso_apply.stdout"

    # Check the install Job rather than waiting on a Deployment a failed install will never create
    - name: Wait for the helm install job to finish
      ansible.builtin.command: >-
        k3s kubectl -n kube-system get job helm-install-external-secrets
        -o jsonpath={.status.succeeded}
      register: eso_job
      changed_when: false
      failed_when: false
      retries: 20
      delay: 15
      until: eso_job.stdout | trim == "1"

    # Only runs when the Job did not succeed, to surface helm's own error
    - name: Report the helm install failure
      block:
        # The tail of the Job log carries helm's error
        - name: Read the helm install log
          ansible.builtin.command: >-
            k3s kubectl -n kube-system logs job/helm-install-external-secrets --tail=20
          register: eso_job_log
          changed_when: false
          failed_when: false

        # Stops the run with that log attached
        - name: Fail with the helm error
          ansible.builtin.fail:
            msg:
              - "The External Secrets helm install job did not succeed."
              - "{{ eso_job_log.stdout_lines | default(['<no log>']) }}"
      when: eso_job.stdout | trim != "1"

    # The webhook must be serving before the store can be created
    - name: Wait for the webhook to become available
      ansible.builtin.command: >-
        k3s kubectl -n {{ eso_namespace }} rollout status
        deployment/external-secrets-webhook --timeout=180s
      register: eso_webhook
      changed_when: false
      retries: 10
      delay: 15
      until: eso_webhook.rc == 0

    # ClusterSecretStore, not SecretStore: usable from any namespace, so each app does not need its own copy
    - name: Define the Vault cluster secret store
      ansible.builtin.copy:
        dest: "{{ k3s_manifest_dir }}/vault-secret-store.yaml"
        mode: "0600"
        content: |
          apiVersion: external-secrets.io/v1
          kind: ClusterSecretStore
          metadata:
            name: vault
          spec:
            provider:
              vault:
                server: {{ vault_addr }}
                path: {{ vault_kv_mount }}
                version: v2
                auth:
                  kubernetes:
                    mountPath: {{ eso_vault_mount }}
                    role: {{ eso_vault_role }}
                    serviceAccountRef:
                      name: external-secrets
                      namespace: {{ eso_namespace }}

    # Retried because the webhook can still be settling right after rollout
    - name: Apply the cluster secret store
      ansible.builtin.command: k3s kubectl apply -f {{ k3s_manifest_dir }}/vault-secret-store.yaml
      register: eso_store_apply
      changed_when: "'created' in eso_store_apply.stdout or 'configured' in eso_store_apply.stdout"
      retries: 5
      delay: 10
      until: eso_store_apply.rc == 0

    # Ready=False here almost always means the Vault role or policy is missing
    - name: Wait for the store to report ready
      ansible.builtin.command: >-
        k3s kubectl get clustersecretstore vault
        -o jsonpath={.status.conditions[?(@.type=="Ready")].status}
      register: eso_store_ready
      changed_when: false
      failed_when: false
      retries: 12
      delay: 10
      until: eso_store_ready.stdout | trim == "True"

    # Not fatal; points at the Vault role when the store is not Ready
    - name: Report the store state
      ansible.builtin.debug:
        msg: >-
          {{ 'ClusterSecretStore vault is Ready; ExternalSecrets can now sync.'
             if eso_store_ready.stdout | trim == 'True'
             else 'Store is NOT ready - check the Vault kubernetes auth role with:
                   kubectl describe clustersecretstore vault' }}
