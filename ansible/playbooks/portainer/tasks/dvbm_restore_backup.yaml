---
# Restores a stack's volumes from a DVBMv3 backup record; destructive, so it only runs with dvbm_restore_confirmed=true and the containers stopped
# Needs: dvbm_url, dvbm_password, dvbm_backup_id, dvbm_restore_confirmed; optional dvbm_validate_certs (default false)

# Stop early with a clear message when the inputs are missing
- name: Ensure DVBMv3 restore inputs are provided
  ansible.builtin.assert:
    that:
      - dvbm_url | default('') | length > 0
      - dvbm_backup_id | default('') | string | length > 0
      - dvbm_password | default('') | length > 0
    fail_msg: "dvbm_url, dvbm_backup_id and dvbm_password must be set before including dvbm_restore_backup.yaml."

# A second guard, so a restore can never fire by accident
- name: Warn when a restore is available but not confirmed
  ansible.builtin.debug:
    msg: >-
      SKIPPING restore of backup ID {{ dvbm_backup_id }}: dvbm_restore_confirmed is not true.
      To restore, stop the affected containers, then re-run with
      -e dvbm_restore_confirmed=true -e dvbm_backup_id={{ dvbm_backup_id }}
  when: not (dvbm_restore_confirmed | default(false) | bool)

# Everything below only runs once the restore is confirmed
- name: Restore volumes from the backup record
  when: dvbm_restore_confirmed | default(false) | bool
  block:
    # Log in with the app password to get a bearer token
    - name: Authenticate with DVBMv3
      ansible.builtin.uri:
        url: "{{ dvbm_url }}/api/auth/login"
        method: POST
        body_format: json
        body:
          password: "{{ dvbm_password }}"
        status_code: 200
        validate_certs: "{{ dvbm_validate_certs | default(false) }}"
      register: dvbm_restore_auth
      retries: 5
      delay: 3
      until: dvbm_restore_auth is not failed
      no_log: true

    # Kept for the API calls below
    - name: Set DVBMv3 bearer token fact
      ansible.builtin.set_fact:
        dvbm_token: "{{ dvbm_restore_auth.json.token }}"
      no_log: true

    # Look the record up before restoring anything from it
    - name: Verify the backup record is restorable
      ansible.builtin.uri:
        url: "{{ dvbm_url }}/api/backups/{{ dvbm_backup_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ dvbm_token }}"
        status_code: 200
        validate_certs: "{{ dvbm_validate_certs | default(false) }}"
      register: dvbm_restore_record

    # Never restore from a partial or failed backup
    - name: Fail if the backup did not succeed
      ansible.builtin.fail:
        msg: >-
          Backup ID {{ dvbm_backup_id }} has status '{{ dvbm_restore_record.json.status }}';
          only successful backups can be restored.
      when: dvbm_restore_record.json.status != 'success'

    # Overwrites the live volumes with the backup's contents
    - name: Trigger the restore
      ansible.builtin.uri:
        url: "{{ dvbm_url }}/api/backups/{{ dvbm_backup_id }}/restore"
        method: POST
        headers:
          Authorization: "Bearer {{ dvbm_token }}"
        status_code: 200
        validate_certs: "{{ dvbm_validate_certs | default(false) }}"
      register: dvbm_restore_result

    # Name the job and volumes that were restored
    - name: Report restore initiation
      ansible.builtin.debug:
        msg: >-
          Restore initiated from backup ID {{ dvbm_backup_id }}
          (job '{{ dvbm_restore_record.json.job_name }}',
          volumes: {{ dvbm_restore_record.json.volumes_backed_up | default([]) | join(', ') }}).
          Start the containers once it completes.
