---
# Restores a stack's volumes from a DVBMv3 backup; destructive and manual, and leaves the stack stopped so the image can be pinned back first
# Connection settings and Vault fields are listed in tasks/setup.yaml; DVBM_URL and DVBM3_PASSWORD at dvbm are required here
# Required: app_name, portainer_endpoint, dvbm_backup_id (from update-stack.yaml or backups/dvbm-backup.yaml), dvbm_restore_confirmed=true
# Optional: dvbm_validate_certs (default false)
- name: Restore a Portainer stack's volumes from DVBMv3
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    # Refuse before touching anything unless the backup and the confirmation are both given
    - name: Require a backup ID and explicit confirmation
      ansible.builtin.assert:
        that:
          - dvbm_backup_id | default('') | string | length > 0
          - dvbm_restore_confirmed | default(false) | bool
        fail_msg: >-
          Restoring overwrites live volume data. Pass dvbm_backup_id and
          -e dvbm_restore_confirmed=true once you are sure.

  tasks:
    # The compose file is not needed to restore, only the environment and stack
    - name: Prepare the stack
      ansible.builtin.include_tasks: tasks/setup.yaml
      vars:
        stack_reads_compose: false

    # Restoring needs a deployed stack to stop
    - name: Fail if the stack does not exist
      ansible.builtin.fail:
        msg: "Stack '{{ stack_name }}' not found on environment '{{ portainer_endpoint }}'."
      when: existing_stack == {}

    # DVBM is optional elsewhere but a restore cannot run without it
    - name: Require DVBMv3
      ansible.builtin.assert:
        that:
          - dvbm_url | length > 0
          - dvbm_password | length > 0
        fail_msg: "Restoring needs DVBM_URL in the environment and DVBM3_PASSWORD at {{ vault_dvbm_path | default('dvbm') }} in Vault."

    # Log in with the app password to get a bearer token
    - name: Authenticate with DVBMv3
      ansible.builtin.uri:
        url: "{{ dvbm_url }}/api/auth/login"
        method: POST
        body_format: json
        body:
          password: "{{ dvbm_password }}"
        status_code: 200
        validate_certs: "{{ dvbm_validate_certs | default(false) }}"
      register: dvbm_restore_auth
      retries: 5
      delay: 3
      until: dvbm_restore_auth is not failed
      no_log: true

    # Kept for the API calls below
    - name: Set DVBMv3 bearer token fact
      ansible.builtin.set_fact:
        dvbm_token: "{{ dvbm_restore_auth.json.token }}"
      no_log: true

    # Checked before the stack is stopped, so a bad ID leaves it running
    - name: Look up the backup record
      ansible.builtin.uri:
        url: "{{ dvbm_url }}/api/backups/{{ dvbm_backup_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ dvbm_token }}"
        status_code: [200, 404]
        validate_certs: "{{ dvbm_validate_certs | default(false) }}"
      register: dvbm_restore_record

    # Never restore from a missing, partial or failed backup
    - name: Fail if the backup is missing or did not succeed
      ansible.builtin.fail:
        msg: >-
          {{ ('DVBMv3 has no backup with ID ' ~ dvbm_backup_id) if dvbm_restore_record.status == 404
             else ('Backup ID ' ~ dvbm_backup_id ~ ' has status ' ~ dvbm_restore_record.json.status ~ '; only successful backups can be restored') }}. The stack was left running.
      when: dvbm_restore_record.status == 404 or dvbm_restore_record.json.status != 'success'

    # Restoring underneath running containers corrupts their state; 409 means it was already stopped
    - name: Stop the stack before restoring
      ansible.builtin.uri:
        url: "{{ portainer_url }}/api/stacks/{{ existing_stack.Id }}/stop?endpointId={{ portainer_endpoint_id }}"
        method: POST
        headers:
          X-API-Key: "{{ portainer_token }}"
        status_code: [200, 204, 409]
        validate_certs: "{{ portainer_validate_certs }}"
      register: stop_result

    # Say which backup is being restored
    - name: Report stack stopped
      ansible.builtin.debug:
        msg: "Stack '{{ stack_name }}' stopped, restoring backup ID {{ dvbm_backup_id }} (job '{{ dvbm_restore_record.json.job_name }}')"

    # Overwrites the live volumes with the backup's contents
    - name: Trigger the restore
      ansible.builtin.uri:
        url: "{{ dvbm_url }}/api/backups/{{ dvbm_backup_id }}/restore"
        method: POST
        headers:
          Authorization: "Bearer {{ dvbm_token }}"
        status_code: 200
        validate_certs: "{{ dvbm_validate_certs | default(false) }}"
      register: dvbm_restore_result

    # The stack stays stopped so the old image can be pinned before it starts against the restored data
    - name: Report next steps
      ansible.builtin.debug:
        msg: >-
          Restore of backup ID {{ dvbm_backup_id }} initiated
          (volumes: {{ dvbm_restore_record.json.volumes_backed_up | default([]) | join(', ') }}).
          Stack '{{ stack_name }}' is left STOPPED on purpose. Pin the compose file back to the previous image,
          commit, then run deploy-stack.yaml so the old version starts against the restored data.
