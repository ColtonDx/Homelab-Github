---
# Updates packages on Linux hosts, one host at a time; hosts with update_stop_services in the inventory have those services stopped first and restored afterwards
# A host with nothing to install, and no pending reboot when reboot=true, is only checked: no services stop and no maintenance window opens
# Extra vars: target_hosts (default linux), distro_upgrade (default false), reboot (default false)
# Inventory: update_stop_services on a host or group lists services to stop (bare names get .service); an extra var of the same name overrides it
# Hosts with kuma_monitor get an Uptime Kuma maintenance window while services are stopped or the host reboots; patch_window_minutes (default 30) sets its length, skip_maintenance_window=true turns it off
- hosts: "{{ target_hosts | default('linux') }}"
  serial: 1
  ignore_unreachable: true
  gather_facts: false
  vars:
    reboot_requested: "{{ reboot | default(false) | bool }}"
    distro_upgrade_requested: "{{ distro_upgrade | default(false) | bool }}"
    # Accept a list, a single name, or a comma-separated string
    service_list: >-
      {{ (update_stop_services.split(',') if update_stop_services is string else update_stop_services)
         | map('trim') | reject('equalto', '') | map('regex_replace', '^([^.]+)$', '\1.service') | list
         if update_stop_services | default('') | length > 0 else [] }}
  tasks:
    # Find out which hosts are reachable, so the rest can be skipped rather than failed
    - name: Check host connectivity
      ansible.builtin.ping:
      register: ping_result
      ignore_unreachable: true
      failed_when: false

    - name: Update a reachable host
      when: ping_result is defined and ping_result.ping is defined
      become: true
      block:
        # Detect the distribution so the right package manager is used
        - name: Check distribution type
          ansible.builtin.setup:

        # Refreshed with apt-get rather than the apt module, whose cache errors come back empty; any source that fails stops the host with apt's own message
        - name: Refresh the package index (Debian-based)
          ansible.builtin.command: apt-get update -q
          register: apt_refresh
          changed_when: false
          check_mode: false
          failed_when: apt_refresh.rc != 0 or apt_refresh_problems | length > 0
          retries: 3
          delay: 10
          until: apt_refresh is not failed
          vars:
            apt_refresh_problems: "{{ (apt_refresh.stdout_lines | default([]) + apt_refresh.stderr_lines | default([])) | select('match', '^(E:|Err:|W: (Failed to fetch|Some index files failed))') | list }}"
          when: ansible_facts['os_family'] == "Debian"

        # A dry run of the same upgrade the apt step below performs; each Inst line is a package it would install or upgrade
        - name: Count pending updates (Debian-based)
          ansible.builtin.command: "apt-get -s -q {{ 'dist-upgrade' if distro_upgrade_requested else 'upgrade --with-new-pkgs' }}"
          register: apt_pending
          changed_when: false
          check_mode: false
          when: ansible_facts['os_family'] == "Debian"

        # Exits 100 when updates are available and 0 when there are none
        - name: Count pending updates (Red Hat-based)
          ansible.builtin.command: dnf check-update -q
          register: dnf_pending
          changed_when: false
          check_mode: false
          failed_when: dnf_pending.rc not in [0, 100]
          when: ansible_facts['os_family'] in ["RedHat", "Fedora"]

        # Debian flags a pending reboot with this file
        - name: Check for a pending reboot (Debian-based)
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: reboot_required_file
          when: ansible_facts['os_family'] == "Debian"

        # needs-restarting exits 1 when a reboot is needed; a host without it is treated as not needing one
        - name: Check for a pending reboot (Red Hat-based)
          ansible.builtin.shell: command -v needs-restarting >/dev/null || exit 0; needs-restarting -r
          register: reboot_required_cmd
          changed_when: false
          check_mode: false
          failed_when: reboot_required_cmd.rc not in [0, 1]
          when: ansible_facts['os_family'] in ["RedHat", "Fedora"]

        # Services, the maintenance window, the upgrade and the reboot all wait on this, so a host with nothing to do is left alone
        - name: Decide whether the host needs patching
          ansible.builtin.set_fact:
            pending_updates: "{{ apt_pending.stdout_lines | default([]) | select('match', '^Inst ') | list | length
                                 if apt_pending.stdout_lines is defined else (1 if (dnf_pending.rc | default(0)) == 100 else 0) }}"
            patch_needed: >-
              {{ (apt_pending.stdout_lines | default([]) | select('match', '^Inst ') | list | length > 0)
                 or (dnf_pending.rc | default(0)) == 100
                 or (reboot_requested and ((reboot_required_file.stat.exists | default(false)) or (reboot_required_cmd.rc | default(0)) == 1)) }}

        # Shown so the run log says why a host was skipped or patched
        - name: Report what the host needs
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}:
              {{ ('nothing to install' if pending_updates | int == 0 else (pending_updates ~ ' package(s) to update' if apt_pending.stdout_lines is defined else 'updates available')) }}{{
                 ', reboot pending' if (reboot_required_file.stat.exists | default(false)) or (reboot_required_cmd.rc | default(0)) == 1 else '' }}{{
                 '; services and the host are left alone' if not patch_needed | bool else '' }}

        # Read every listed service's current state so it can be restored exactly
        - name: Gather service facts
          ansible.builtin.service_facts:
          when: service_list | length > 0

        # Stop early on a misspelled name or a service not installed on this host
        - name: Check every service to stop exists
          ansible.builtin.assert:
            that:
              - item in ansible_facts.services
            fail_msg: "Service '{{ item }}' in update_stop_services was not found on {{ inventory_hostname }}."
          loop: "{{ service_list }}"

        # Remember which services were running and enabled before the update
        - name: Record the services' starting state
          ansible.builtin.set_fact:
            services_running: "{{ service_list | select('in', running_names) | list }}"
            services_enabled: "{{ service_list | select('in', enabled_names) | list }}"
          vars:
            running_names: "{{ ansible_facts.services | default({}) | dict2items | selectattr('value.state', 'defined') | selectattr('value.state', 'equalto', 'running') | map(attribute='key') | list }}"
            enabled_names: "{{ ansible_facts.services | default({}) | dict2items | selectattr('value.status', 'defined') | selectattr('value.status', 'equalto', 'enabled') | map(attribute='key') | list }}"

        # Opened before anything stops, so stopped services and the reboot raise no alerts; a Kuma problem only warns, so patching never waits on monitoring
        - name: Open an Uptime Kuma maintenance window
          when:
            - patch_needed | bool
            - reboot_requested or service_list | length > 0
            - not (skip_maintenance_window | default(false) | bool)
          become: false
          block:
            # The same monitors the inventory sync creates for this host
            - name: Find this host's monitors
              ansible.builtin.include_tasks:
                file: ../uptime-kuma/tasks/read_host_monitors.yaml
                apply:
                  become: false
              vars:
                kuma_hosts: ["{{ inventory_hostname }}"]

            # Ends by itself after patch_window_minutes, so a run that dies here never leaves the host silenced
            - name: Start the maintenance window
              ansible.builtin.include_tasks:
                file: ../uptime-kuma/tasks/set_maintenance_window.yaml
                apply:
                  become: false
              vars:
                kuma_maintenance_title: "Patching {{ inventory_hostname }}"
                kuma_maintenance_monitors: "{{ kuma_host_monitors | map(attribute='name') | list }}"
                kuma_maintenance_minutes: "{{ patch_window_minutes | default(30) }}"
                kuma_maintenance_description: "Linux patching by update-linux.yaml"
              when: kuma_host_monitors | length > 0

            # Only a window that was really opened is closed at the end
            - name: Record the open window
              ansible.builtin.set_fact:
                patch_window_open: "{{ (kuma_connected | default(false)) and (kuma_mw_found | default([]) | length > 0) }}"
          rescue:
            # Alerts may fire during the reboot, but the host still gets patched
            - name: Warn that no window was opened
              ansible.builtin.debug:
                msg: "Could not open an Uptime Kuma maintenance window for {{ inventory_hostname }}, so its monitors may alert while it is patched."

        - name: Stop services, update and reboot if needed
          when: patch_needed | bool
          block:
            # Stop in the order given, so dependents can be listed before what they depend on
            - name: Stop services
              ansible.builtin.systemd:
                name: "{{ item }}"
                state: stopped
              loop: "{{ service_list }}"

            # Keep them from starting on their own if the host reboots mid-update
            - name: Disable services for the update
              ansible.builtin.systemd:
                name: "{{ item }}"
                enabled: false
              loop: "{{ services_enabled }}"

            # Upgrade everything on Debian-family hosts from the index refreshed above
            - name: Upgrade packages (Debian-based)
              ansible.builtin.apt:
                upgrade: "{{ 'dist' if distro_upgrade_requested else 'yes' }}"
              when: ansible_facts['os_family'] == "Debian"

            # Upgrade everything on Red Hat-family hosts
            - name: Upgrade packages (Red Hat-based)
              ansible.builtin.dnf:
                name: "*"
                state: latest
                update_cache: true
              when: ansible_facts['os_family'] in ["RedHat", "Fedora"]

            # Debian flags a pending reboot with this file
            - name: Check whether a reboot is required (Debian-based)
              ansible.builtin.stat:
                path: /var/run/reboot-required
              register: reboot_required_file
              when: ansible_facts['os_family'] == "Debian"

            # needs-restarting exits 1 when a reboot is needed; a host without it is treated as not needing one
            - name: Check whether a reboot is required (Red Hat-based)
              ansible.builtin.shell: command -v needs-restarting >/dev/null || exit 0; needs-restarting -r
              register: reboot_required_cmd
              changed_when: false
              failed_when: reboot_required_cmd.rc not in [0, 1]
              when: ansible_facts['os_family'] in ["RedHat", "Fedora"]

            # Reboot only when the update asked for it and the run allows reboots
            - name: Reboot the host
              ansible.builtin.reboot:
                msg: "Reboot initiated by Ansible because updates were installed."
                test_command: whoami
              when:
                - reboot_requested
                - (reboot_required_file.stat.exists | default(false)) or (reboot_required_cmd.rc | default(0)) == 1

          always:
            # Re-enable only what was enabled before, so services disabled on purpose stay that way
            - name: Re-enable services
              ansible.builtin.systemd:
                name: "{{ item }}"
                enabled: true
              loop: "{{ services_enabled | default([]) }}"

            # Start in reverse order so dependencies come up first, and only what was running before
            - name: Start services
              ansible.builtin.systemd:
                name: "{{ item }}"
                state: started
              loop: "{{ services_running | default([]) | reverse | list }}"

            # The host and its services are back, so alerting resumes now rather than when the window would expire
            - name: Close the Uptime Kuma maintenance window
              when: patch_window_open | default(false) | bool
              become: false
              block:
                # Removes the window by the title it was opened with
                - name: End the maintenance window
                  ansible.builtin.include_tasks:
                    file: ../uptime-kuma/tasks/set_maintenance_window.yaml
                    apply:
                      become: false
                  vars:
                    kuma_maintenance_title: "Patching {{ inventory_hostname }}"
                    kuma_maintenance_state: absent
              rescue:
                # Harmless, since the window expires by itself
                - name: Warn that the window stays open
                  ansible.builtin.debug:
                    msg: "Could not end the Uptime Kuma window for {{ inventory_hostname }}; it ends by itself after {{ patch_window_minutes | default(30) }} minutes."
