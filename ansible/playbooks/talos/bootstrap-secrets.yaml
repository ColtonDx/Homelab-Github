---
# Gives the Talos cluster access to Vault and hands it to Flux: Vault's Kubernetes auth and role for External Secrets, the cluster-bootstrap Secret, then Flux itself
# Run by init-cluster.yaml at the end, or on its own against a running cluster; safe to re-run
# Needs a Vault token that can manage auth methods and policies, not just read secrets
# Inventory, in the group's talos dict: eso_vault_paths, the Vault paths External Secrets may read (default the cluster's flux path, flux-talos)
# Optional in the talos dict: vault_auth_mount (kubernetes-<name>), vault_role (external-secrets), cluster_vault_addr when the cluster reaches Vault at another address, flux_path (kubernetes/clusters/talos-cluster)
- name: Bootstrap the Talos cluster's secrets and Flux
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    talos_vault_mount: "{{ talos_cfg.vault_auth_mount | default('kubernetes-' ~ talos_cfg.name) }}"
    talos_vault_role: "{{ talos_cfg.vault_role | default('external-secrets') }}"
    talos_vault_policy: "external-secrets-{{ talos_cfg.name }}"
    talos_flux_dir: "{{ (playbook_dir ~ '/../../../' ~ talos_cfg.flux_path | default('kubernetes/clusters/talos-cluster')) | realpath }}/flux-system"

  tasks:
    # The work folder holds the secrets bundle and an admin kubeconfig, so it is removed however the run ends
    - name: Bootstrap secrets and Flux
      block:
        # Loads the bundle and writes a talosconfig
        - name: Prepare access to the cluster
          ansible.builtin.include_tasks: tasks/talos_access.yaml

        # An admin kubeconfig for the steps below, made fresh from the bundle rather than stored anywhere
        - name: Fetch a kubeconfig
          ansible.builtin.command:
            argv: [talosctl, --talosconfig, "{{ talos_work }}/talosconfig", --nodes, "{{ talos_first_address }}", kubeconfig, "{{ talos_work }}/kubeconfig", --force]
          changed_when: false

        # Vault checks External Secrets' tokens against the cluster's API, so it needs the address and CA
        - name: Read the cluster's API address and CA
          ansible.builtin.slurp:
            src: "{{ talos_work }}/kubeconfig"
          register: talos_kubeconfig
          no_log: true

        # Taken from the kubeconfig Talos generated, so it always matches the running cluster
        - name: Record the API address and CA
          ansible.builtin.set_fact:
            talos_api: "{{ (talos_kubeconfig.content | b64decode | from_yaml).clusters[0].cluster }}"
          no_log: true

        # Auth methods already enabled, so enabling is skipped when this one exists
        - name: List Vault's auth methods
          ansible.builtin.uri:
            url: "{{ vault_addr | regex_replace('/+$', '') }}/v1/sys/auth"
            headers:
              X-Vault-Token: "{{ vault_token }}"
          register: talos_vault_auths
          no_log: true

        # One Kubernetes auth mount per cluster, so each cluster's tokens are checked against its own API
        - name: Enable Kubernetes auth for this cluster
          ansible.builtin.uri:
            url: "{{ vault_addr | regex_replace('/+$', '') }}/v1/sys/auth/{{ talos_vault_mount }}"
            method: POST
            headers:
              X-Vault-Token: "{{ vault_token }}"
            body_format: json
            body:
              type: kubernetes
              description: "Talos cluster {{ talos_cfg.name }}"
            status_code: [200, 204]
          when: (talos_vault_mount ~ '/') not in talos_vault_auths.json.data
          no_log: true

        # No reviewer token is set, so Vault reviews each login with the caller's own token; the auth-delegator binding in the repo allows that
        - name: Point the auth method at the cluster
          ansible.builtin.uri:
            url: "{{ vault_addr | regex_replace('/+$', '') }}/v1/auth/{{ talos_vault_mount }}/config"
            method: POST
            headers:
              X-Vault-Token: "{{ vault_token }}"
            body_format: json
            body:
              kubernetes_host: "{{ talos_api.server }}"
              kubernetes_ca_cert: "{{ talos_api['certificate-authority-data'] | b64decode }}"
              disable_local_ca_jwt: true
            status_code: [200, 204]
          no_log: true

        # Read-only, and only the paths the cluster is meant to see
        - name: Write the External Secrets policy
          ansible.builtin.uri:
            url: "{{ vault_addr | regex_replace('/+$', '') }}/v1/sys/policies/acl/{{ talos_vault_policy }}"
            method: PUT
            headers:
              X-Vault-Token: "{{ vault_token }}"
            body_format: json
            body:
              policy: |
                {% for p in talos_cfg.eso_vault_paths | default(['flux-talos']) %}
                path "{{ vault_kv_mount }}/data/{{ p }}" {
                  capabilities = ["read"]
                }
                {% endfor %}
            status_code: [200, 204]
          no_log: true

        # Only External Secrets' own service account can log in with this role
        - name: Write the External Secrets role
          ansible.builtin.uri:
            url: "{{ vault_addr | regex_replace('/+$', '') }}/v1/auth/{{ talos_vault_mount }}/role/{{ talos_vault_role }}"
            method: POST
            headers:
              X-Vault-Token: "{{ vault_token }}"
            body_format: json
            body:
              bound_service_account_names: [external-secrets]
              bound_service_account_namespaces: [external-secrets]
              token_policies: ["{{ talos_vault_policy }}"]
              token_ttl: 3600
            status_code: [200, 204]
          no_log: true

        # Flux reads cluster-bootstrap from here, so the namespace has to exist before Flux does
        - name: Create the flux-system namespace
          ansible.builtin.shell:
            cmd: set -o pipefail && kubectl create namespace flux-system --dry-run=client -o yaml | kubectl apply -f -
            executable: /bin/bash
          environment:
            KUBECONFIG: "{{ talos_work }}/kubeconfig"
          register: talos_ns
          changed_when: "'created' in talos_ns.stdout or 'configured' in talos_ns.stdout"

        # The one Secret Flux cannot get from Vault, since it says how to reach Vault; applied from stdin so the values never touch disk
        - name: Create the cluster-bootstrap Secret
          ansible.builtin.command:
            argv: [kubectl, apply, -f, "-"]
            stdin: "{{ talos_bootstrap_secret | to_json }}"
          environment:
            KUBECONFIG: "{{ talos_work }}/kubeconfig"
          vars:
            talos_bootstrap_secret:
              apiVersion: v1
              kind: Secret
              metadata:
                name: cluster-bootstrap
                namespace: flux-system
              type: Opaque
              stringData:
                VAULT_ADDR: "{{ talos_cfg.cluster_vault_addr | default(vault_addr) }}"
                VAULT_KV_MOUNT: "{{ vault_kv_mount }}"
                VAULT_AUTH_MOUNT: "{{ talos_vault_mount }}"
                VAULT_ROLE: "{{ talos_vault_role }}"
          register: talos_secret_apply
          changed_when: "'unchanged' not in talos_secret_apply.stdout"
          no_log: true

        # Server-side, since Flux's CRDs are too large for a client-side apply's annotation
        - name: Install Flux
          ansible.builtin.command:
            argv: [kubectl, apply, --server-side, --force-conflicts, -f, "{{ talos_flux_dir }}/gotk-components.yaml"]
          environment:
            KUBECONFIG: "{{ talos_work }}/kubeconfig"
          register: talos_flux_install
          changed_when: "'serverside-applied' in talos_flux_install.stdout and ' unchanged' not in talos_flux_install.stdout"

        # The sync objects below are Flux resources, so their CRDs must be registered first
        - name: Wait for Flux's CRDs
          ansible.builtin.command:
            argv: [kubectl, wait, --for=condition=established, --timeout=120s, crd/gitrepositories.source.toolkit.fluxcd.io, crd/kustomizations.kustomize.toolkit.fluxcd.io]
          environment:
            KUBECONFIG: "{{ talos_work }}/kubeconfig"
          changed_when: false

        # Points Flux at this repo's cluster folder; from here on Flux applies everything else, including its own upgrades
        - name: Point Flux at the repository
          ansible.builtin.command:
            argv: [kubectl, apply, --server-side, -f, "{{ talos_flux_dir }}/gotk-sync.yaml"]
          environment:
            KUBECONFIG: "{{ talos_work }}/kubeconfig"
          register: talos_flux_sync
          changed_when: "' unchanged' not in talos_flux_sync.stdout"

        # A first sync that fails usually means the repo URL, branch or path is wrong
        - name: Wait for Flux's first sync
          ansible.builtin.command:
            argv: [kubectl, -n, flux-system, wait, kustomization/flux-system, --for=condition=Ready, --timeout=5m]
          environment:
            KUBECONFIG: "{{ talos_work }}/kubeconfig"
          changed_when: false

        # The rest happens inside the cluster, in the order kubernetes/README.md describes
        - name: Report the bootstrap
          ansible.builtin.debug:
            msg: >-
              Flux is syncing {{ talos_flux_dir | dirname | basename }}. External Secrets logs in to Vault at
              auth/{{ talos_vault_mount }} as {{ talos_vault_role }}, reading {{ talos_cfg.eso_vault_paths | default(['flux-talos']) | join(', ') }}.
              Follow the rollout with flux get kustomizations.

      always:
        # The secrets bundle and admin kubeconfig never outlive the run
        - name: Remove the work folder
          ansible.builtin.file:
            path: "{{ talos_work }}"
            state: absent
          when: talos_work is defined
