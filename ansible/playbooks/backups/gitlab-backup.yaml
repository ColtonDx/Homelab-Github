---
# Archives GitLab's configuration directory, which holds gitlab-secrets.json; pair it with GitLab's own data backup, which leaves those secrets out
# Extra vars: target_hosts (default gitlab)
# Inventory: gitlab_config_dir (default /etc/gitlab) and gitlab_backup_dest (default /backups) override the paths
# Inventory: backup_age_recipients (required) lists the age public keys the archive is encrypted to; gitlab_config_backup_keep (default 8) is how many archives to keep
- name: Back up GitLab configuration
  hosts: "{{ target_hosts | default('gitlab') }}"
  become: true
  gather_facts: true

  vars:
    config_dir: "{{ gitlab_config_dir | default('/etc/gitlab') }}"
    backup_dest: "{{ gitlab_backup_dest | default('/backups') }}"
    backup_archive: "{{ backup_dest }}/gitlab_config_{{ ansible_facts.date_time.iso8601_basic_short }}.tar.gz.age"
    # Weekly runs, so the default keeps about two months
    backup_keep: "{{ gitlab_config_backup_keep | default(8) | int }}"

  tasks:
    # gitlab-secrets.json decrypts GitLab's database secrets, so the archive is never written unencrypted
    - name: Require the age recipients
      ansible.builtin.assert:
        that: backup_age_recipients | default([]) | length > 0
        fail_msg: Set backup_age_recipients (age public keys) in the inventory; GitLab configuration backups are always encrypted.
        quiet: true

    # age encrypts to public keys, so this host can write backups but never read them back
    - name: Install age
      ansible.builtin.package:
        name: age
        state: present

    # Only root may read the directory
    - name: Ensure the backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dest }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    # tar streams straight into age, so no plaintext copy touches the disk; umask keeps the file root-only
    - name: Create the encrypted configuration archive
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && umask 077 &&
          tar -czf - -C {{ config_dir | dirname | quote }} {{ config_dir | basename | quote }}
          | age {% for r in backup_age_recipients %}-r {{ r | quote }} {% endfor %}-o {{ backup_archive | quote }}
        executable: /bin/bash
      changed_when: true

    # Earlier versions wrote unencrypted archives; they hold the same secrets, so they go once an encrypted one exists
    - name: Find unencrypted archives from earlier versions
      ansible.builtin.find:
        paths: "{{ backup_dest }}"
        patterns: ["gitlab_config_*.tar.gz"]
      register: gitlab_plain_archives

    - name: Remove unencrypted archives from earlier versions
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ gitlab_plain_archives.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    # Keep the newest archives only
    - name: Find the encrypted archives
      ansible.builtin.find:
        paths: "{{ backup_dest }}"
        patterns: ["gitlab_config_*.tar.gz.age"]
      register: gitlab_archives

    - name: Remove archives beyond the ones kept
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ (gitlab_archives.files | sort(attribute='mtime', reverse=true))[backup_keep | int :] }}"
      loop_control:
        label: "{{ item.path | basename }}"

    # Show where the backup landed so it can be collected or restored
    - name: Report where the backup was written
      ansible.builtin.debug:
        msg: "GitLab configuration archived and encrypted to {{ backup_archive }} on {{ inventory_hostname }}; {{ [gitlab_archives.matched, backup_keep | int] | min }} kept."
