---
# Backs up GitLab: its own data backup (repositories, database, uploads) and its configuration directory, which holds gitlab-secrets.json
# and is left out of the data backup; both are encrypted with age, then copied to the backup server (tasks/push_backup.yaml, folder Gitlab)
# Extra vars: target_hosts (default gitlab)
# Inventory: gitlab_config_dir (default /etc/gitlab) and gitlab_backup_dest (default /backups) override the paths; gitlab_backup_skip
# (default registry,artifacts,builds: container images and CI output that CI rebuilds) lists data GitLab's backup leaves out
# Inventory: backup_age_recipients (required) lists the age public keys the archives are encrypted to; gitlab_backup_keep (default 3) is how
# many of each are kept on the VM, since the history lives in the backup server's snapshots; backup_push_host and backup_push_root (push_backup.yaml)
- name: Back up GitLab configuration
  hosts: "{{ target_hosts | default('gitlab') }}"
  become: true
  gather_facts: true

  vars:
    config_dir: "{{ gitlab_config_dir | default('/etc/gitlab') }}"
    backup_dest: "{{ gitlab_backup_dest | default('/backups') }}"
    backup_stamp: "{{ ansible_facts.date_time.iso8601_basic_short }}"
    backup_archive: "{{ backup_dest }}/gitlab_config_{{ backup_stamp }}.tar.gz.age"
    data_archive: "{{ backup_dest }}/gitlab_data_{{ backup_stamp }}.tar.age"
    # GitLab writes its own backup here, named after the BACKUP value below
    data_plain: "/var/opt/gitlab/backups/{{ backup_stamp }}_gitlab_backup.tar"
    # The backup server's snapshots hold the history, so the VM keeps only the newest few
    backup_keep: "{{ gitlab_backup_keep | default(3) | int }}"

  tasks:
    # gitlab-secrets.json decrypts GitLab's database secrets, so the archive is never written unencrypted
    - name: Require the age recipients
      ansible.builtin.assert:
        that: backup_age_recipients | default([]) | length > 0
        fail_msg: Set backup_age_recipients (age public keys) in the inventory; GitLab configuration backups are always encrypted.
        quiet: true

    # age encrypts to public keys, so this host can write backups but never read them back; rsync copies them to the backup server
    - name: Install age and rsync
      ansible.builtin.package:
        name: [age, rsync]
        state: present

    # Only root may read the directory
    - name: Ensure the backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dest }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    # tar streams straight into age, so no plaintext copy touches the disk; umask keeps the file root-only
    - name: Create the encrypted configuration archive
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && umask 077 &&
          tar -czf - -C {{ config_dir | dirname | quote }} {{ config_dir | basename | quote }}
          | age {% for r in backup_age_recipients %}-r {{ r | quote }} {% endfor %}-o {{ backup_archive | quote }}
        executable: /bin/bash
      changed_when: true

    # GitLab's own backup; copy strategy so repositories keep changing safely while it runs
    - name: Create GitLab's data backup and encrypt it
      block:
        - name: Run GitLab's data backup
          ansible.builtin.command:
            argv: [gitlab-backup, create, "BACKUP={{ backup_stamp }}", "SKIP={{ gitlab_backup_skip | default('registry,artifacts,builds') }}", STRATEGY=copy]
          changed_when: true

        # The unencrypted tar holds every repository and the database, so it only exists until age has read it
        - name: Encrypt the data backup
          ansible.builtin.shell:
            cmd: >-
              set -o pipefail && umask 077 &&
              age {% for r in backup_age_recipients %}-r {{ r | quote }} {% endfor %}-o {{ data_archive | quote }} {{ data_plain | quote }}
            executable: /bin/bash
          changed_when: true
      always:
        - name: Remove GitLab's unencrypted data backup
          ansible.builtin.file:
            path: "{{ data_plain }}"
            state: absent

    # Earlier versions wrote unencrypted archives; they hold the same secrets, so they go once an encrypted one exists
    - name: Find unencrypted archives from earlier versions
      ansible.builtin.find:
        paths: "{{ backup_dest }}"
        patterns: ["gitlab_config_*.tar.gz"]
      register: gitlab_plain_archives

    - name: Remove unencrypted archives from earlier versions
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ gitlab_plain_archives.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    # Off the VM to the backup server, which replicates offsite and to the cloud
    - name: Copy the backups to the backup server
      ansible.builtin.include_tasks: ../../tasks/push_backup.yaml
      vars:
        backup_push_folder: Gitlab
        backup_push_files: ["{{ data_archive }}", "{{ backup_archive }}"]

    # Keep the newest of each kind only, once this run's copies are safely on the server
    - name: Find the encrypted archives
      ansible.builtin.find:
        paths: "{{ backup_dest }}"
        patterns: ["gitlab_config_*.tar.gz.age", "gitlab_data_*.tar.age"]
      register: gitlab_archives

    - name: Remove archives beyond the ones kept
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: >-
        {{ (gitlab_archives.files | selectattr('path', 'search', 'gitlab_config_') | sort(attribute='mtime', reverse=true))[backup_keep | int :]
           + (gitlab_archives.files | selectattr('path', 'search', 'gitlab_data_') | sort(attribute='mtime', reverse=true))[backup_keep | int :] }}
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Report the backup
      ansible.builtin.debug:
        msg: "GitLab data and configuration encrypted to {{ data_archive | basename }} and {{ backup_archive | basename }} and copied to the backup server; the VM keeps the newest {{ backup_keep }} of each."
