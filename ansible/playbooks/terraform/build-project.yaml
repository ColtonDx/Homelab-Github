---
# Plans or applies any Terraform project, filling its variables from overrides, the inventory, NetBox and Vault as its sources.yaml describes
# Required: tf_project, the project folder relative to the repo root (e.g. terraform/proxmox/gitlab); optional tf_action (plan, default, or apply)
# Optional: tf_vars, a dict that overrides any variable; tf_backend=local to run on local state when Garage is not available yet
# Inventory: sources.yaml's host (one VM) or group (a cluster) supplies values from terraform_defaults, ansible_host and each host's terraform dict
# Optional: tf_migrate_state=true on an s3 run copies state left by a local run into Garage
# After an apply it reserves each VM's address in OPNsense Dnsmasq from the project's dns_reservations output (tf_reserve_ip=false skips it)
# It then records each VM in NetBox: the VM in sources.yaml's netbox_cluster, its eth0 and MAC, and its address with a DNS name (tf_netbox=false skips it)
# It then waits for the VM and runs the install playbook named by sources.yaml's install entry, which then runs its own TLS; tf_install=false skips that
# Environment: VAULT_ADDR, VAULT_TOKEN, VAULT_KV_MOUNT; GARAGE_URL (or garage_url) for the s3 backend; NETBOX_URL only when a lookup needs NetBox
# Vault: GARAGE_ACCESS_KEY and GARAGE_SECRET_KEY at garage for the s3 backend (vault_garage_path renames it), NETBOX_TOKEN at netbox when a lookup runs
- name: Build a Terraform project
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    tf_action_resolved: "{{ tf_action | default('plan') }}"
    tf_backend_resolved: "{{ tf_backend | default('s3') }}"
    tf_overrides: "{{ tf_vars | default({}) }}"

  tasks:
    # Stop before anything runs when the project or the action is not usable
    - name: Validate the inputs
      ansible.builtin.assert:
        that:
          - tf_project | default('') | length > 0
          - tf_action_resolved in ['plan', 'apply']
          - tf_backend_resolved in ['s3', 'local']
          - tf_overrides is mapping
        fail_msg: "Pass tf_project; tf_action must be plan or apply, tf_backend s3 or local, and tf_vars a dict."

    # A relative project path is taken from the repo root, which sits three levels above this playbook
    - name: Resolve the project folder
      ansible.builtin.set_fact:
        tf_dir: "{{ tf_project if tf_project is abs else (playbook_dir ~ '/../../../' ~ tf_project) | realpath }}"

    # The project needs its Terraform files and the manifest describing its inputs
    - name: Check the project has a sources.yaml
      ansible.builtin.stat:
        path: "{{ tf_dir }}/sources.yaml"
      register: tf_sources_stat

    # Name the path so a typo in tf_project is obvious
    - name: Fail when the project or its manifest is missing
      ansible.builtin.fail:
        msg: "No sources.yaml in {{ tf_dir }}; check tf_project."
      when: not tf_sources_stat.stat.exists

    # Loaded as variables, so templates in it such as {{ domain }} resolve from the inventory
    - name: Load the project's sources.yaml
      ansible.builtin.include_vars:
        file: "{{ tf_dir }}/sources.yaml"
        name: tf_sources

    # A wrong install entry would only show up after the apply, so check it now
    - name: Validate the install entry
      ansible.builtin.assert:
        that:
          - tf_sources.install.hosts | default('') | length > 0
          - (install_path if install_path is abs else playbook_dir ~ '/../../../' ~ install_path) is file
        fail_msg: "sources.yaml's install entry needs hosts and a playbook path (relative to the repo root, or absolute) that exists."
      vars:
        install_path: "{{ tf_sources.install.playbook | default('') }}"
      when: tf_sources.install is defined

    # Terraform rejects -var for an undeclared variable, so only declared names are ever passed
    - name: Read the variables the project declares
      ansible.builtin.set_fact:
        tf_declared: "{{ (tf_declared | default([]) + (lookup('ansible.builtin.file', item) | regex_findall('variable\\s+\"([^\"]+)\"'))) | unique }}"
      loop: "{{ query('ansible.builtin.fileglob', tf_dir ~ '/*.tf') }}"
      loop_control:
        label: "{{ item | basename }}"

    # Secrets an override supplies are not fetched, so a bootstrap run can work without them in Vault
    - name: List the secrets to fetch
      ansible.builtin.set_fact:
        tf_secret_entries: "{{ tf_sources.vault | default([]) | rejectattr('var', 'in', tf_overrides.keys() | list) | list }}"
        tf_backend_entries: >-
          {{ [{'path': vault_garage_path | default('garage'), 'field': 'GARAGE_ACCESS_KEY', 'var': 'tf_garage_access_key'},
              {'path': vault_garage_path | default('garage'), 'field': 'GARAGE_SECRET_KEY', 'var': 'tf_garage_secret_key'}]
             if tf_backend_resolved == 's3' else [] }}

    # One lookup for the project's secrets and, on the s3 backend, Garage's credentials
    - name: Request the secrets from Vault
      ansible.builtin.set_fact:
        vault_secrets: "{{ tf_secret_entries + tf_backend_entries }}"
      when: (tf_secret_entries + tf_backend_entries) | length > 0

    # Fails naming every missing path or field at once
    - name: Load the secrets from Vault
      ansible.builtin.include_tasks: ../../tasks/var_lookup.yaml
      when: (tf_secret_entries + tf_backend_entries) | length > 0

    # Site values from the inventory dict the manifest names; keys the project does not declare are ignored
    - name: Read the inventory values
      ansible.builtin.set_fact:
        tf_from_inventory: >-
          {{ (lookup('ansible.builtin.vars', tf_sources.inventory, default={}) if tf_sources.inventory is defined else {})
             | dict2items | selectattr('key', 'in', tf_declared) | items2dict }}
        tf_from_host: {}

    # A project for one VM names its inventory host; the host's platform defaults, its address and its own terraform dict fill the variables, in that order
    - name: Read the VM's settings from its inventory host
      ansible.builtin.set_fact:
        tf_from_host: >-
          {{ (hv.terraform_defaults | default({}))
             | combine({'ip_address': hv.ansible_host} if (hv.ansible_host | default('') | string) is match('^[0-9.]+$') else {})
             | combine(hv.terraform | default({}))
             | dict2items | selectattr('key', 'in', tf_declared) | items2dict }}
      vars:
        hv: "{{ hostvars[tf_sources.host] }}"
      when: tf_sources.host is defined

    # A host missing from the inventory would otherwise leave every value unset without saying why
    - name: Require the VM's inventory host
      ansible.builtin.assert:
        that:
          - tf_sources.host in hostvars
        fail_msg: "sources.yaml names host '{{ tf_sources.host }}', which is not in the inventory."
      when: tf_sources.host is defined

    # A project for a cluster names its inventory group; each host becomes one entry in the node list, built the same way
    - name: Build the node list from the inventory group
      ansible.builtin.set_fact:
        tf_group_nodes: >-
          {{ tf_group_nodes | default([]) + [{'name': item}
             | combine(hostvars[item].terraform_defaults | default({}))
             | combine({'address': hostvars[item].ansible_host} if (hostvars[item].ansible_host | default('') | string) is match('^[0-9.]+$') else {})
             | combine(hostvars[item].terraform | default({}))] }}
      loop: "{{ groups[tf_sources.group] | default([]) }}"
      when: tf_sources.group is defined

    # Project-wide values such as the storage pool come from the platform defaults too, read from the group's first host
    - name: Read the cluster's settings from its inventory group
      ansible.builtin.set_fact:
        tf_from_host: >-
          {{ (hostvars[groups[tf_sources.group][0]].terraform_defaults | default({}))
             | combine({tf_sources.nodes_var | default('nodes'): tf_group_nodes})
             | dict2items | selectattr('key', 'in', tf_declared) | items2dict }}
      when:
        - tf_sources.group is defined
        - groups[tf_sources.group] | default([]) | length > 0

    # An empty or misspelt group would build nothing
    - name: Require the cluster's inventory group
      ansible.builtin.assert:
        that:
          - groups[tf_sources.group] | default([]) | length > 0
        fail_msg: "sources.yaml names group '{{ tf_sources.group }}', which has no hosts in the inventory."
      when: tf_sources.group is defined

    # NetBox is only asked for variables no override or inventory value covers, so a project whose inventory sets them never needs it
    - name: Start with no NetBox lookups
      ansible.builtin.set_fact:
        netbox_lookups: []
        tf_from_netbox: {}

    # Each manifest entry becomes a netbox_lookups entry named by its variable
    - name: List the NetBox lookups still needed
      ansible.builtin.set_fact:
        netbox_lookups: "{{ netbox_lookups + [item.value | combine({'var': item.key})] }}"
      loop: >-
        {{ (tf_sources.netbox | default({})) | dict2items
           | rejectattr('key', 'in', (tf_overrides.keys() | list) + (tf_from_inventory.keys() | list) + (tf_from_host.keys() | list)) | list }}
      loop_control:
        label: "{{ item.key }}"

    # Fails naming every lookup that has no single match
    - name: Look the remaining values up in NetBox
      ansible.builtin.include_tasks: ../../tasks/netbox_lookup.yaml
      when: netbox_lookups | length > 0

    # The shared task returns every result by variable name
    - name: Keep the NetBox results
      ansible.builtin.set_fact:
        tf_from_netbox: "{{ netbox_values }}"
      when: netbox_lookups | length > 0

    # Lowest to highest precedence: NetBox, an inventory dict, the host or group, overrides; the project's own defaults cover anything left
    # Secret variables are kept out of this merge, so even an overridden secret never becomes a logged -var
    - name: Merge the variable sources
      ansible.builtin.set_fact:
        tf_variables: >-
          {{ tf_from_netbox | combine(tf_from_inventory, tf_from_host, tf_overrides)
             | dict2items | selectattr('key', 'in', tf_declared) | rejectattr('key', 'in', tf_secret_names) | items2dict }}
      vars:
        tf_secret_names: "{{ tf_sources.vault | default([]) | map(attribute='var') | list }}"

    # Secrets from Vault, plus any secret an override supplied, all as TF_VAR_* environment variables
    - name: Collect the secret variables
      ansible.builtin.set_fact:
        tf_secret_env: "{{ tf_secret_env | default({}) | combine({'TF_VAR_' ~ item.var: value}) }}"
      loop: "{{ tf_sources.vault | default([]) }}"
      loop_control:
        label: "{{ item.var }}"
      vars:
        value: "{{ tf_overrides[item.var] if item.var in tf_overrides else lookup('ansible.builtin.vars', item.var) }}"
      no_log: true

    # Names and sources only, never values
    - name: Record where each variable comes from
      ansible.builtin.set_fact:
        tf_var_sources: "{{ tf_var_sources | default({}) | combine({item: source}) }}"
      loop: "{{ (tf_variables.keys() | list) + (tf_sources.vault | default([]) | map(attribute='var') | list) }}"
      vars:
        source: >-
          {{ 'override' if item in tf_overrides else 'host' if item in tf_from_host else 'inventory' if item in tf_from_inventory
             else 'netbox' if item in tf_from_netbox else 'vault' }}

    # Shows the source of every value this run passes to Terraform; anything unlisted uses the project's default
    - name: Report where each variable comes from
      ansible.builtin.debug:
        msg: "{{ tf_var_sources | default({}) }}"

    # Garage's endpoint and credentials reach the s3 backend through the standard AWS variables
    - name: Build the Terraform environment
      ansible.builtin.set_fact:
        tf_env: >-
          {{ tf_secret_env | default({}) | combine({'TF_IN_AUTOMATION': '1'})
             | combine({'AWS_ACCESS_KEY_ID': tf_garage_access_key, 'AWS_SECRET_ACCESS_KEY': tf_garage_secret_key,
                        'AWS_ENDPOINT_URL_S3': garage_url | default(lookup('ansible.builtin.env', 'GARAGE_URL'), true)}
                       if tf_backend_resolved == 's3' else {}) }}
      no_log: true

    # The s3 backend needs somewhere to find Garage
    - name: Require the Garage endpoint for the s3 backend
      ansible.builtin.assert:
        that:
          - tf_env.AWS_ENDPOINT_URL_S3 | default('') | length > 0
        fail_msg: "Set GARAGE_URL (or pass garage_url), or run with tf_backend=local."
      when: tf_backend_resolved == 's3'

    # A local-state run swaps the backend with an override file; a normal run makes sure no leftover override remains
    - name: Set the backend override for a local-state run
      ansible.builtin.copy:
        dest: "{{ tf_dir }}/backend_override.tf"
        content: |
          # Written by build-project.yaml for tf_backend=local; removed on the next s3 run
          terraform {
            backend "local" {}
          }
        mode: "0644"
      when: tf_backend_resolved == 'local'

    # Without this, a file left by an earlier local run would keep state out of Garage
    - name: Remove a leftover backend override
      ansible.builtin.file:
        path: "{{ tf_dir }}/backend_override.tf"
        state: absent
      when: tf_backend_resolved == 's3'

    # State left by a local bootstrap run must be moved into Garage deliberately, never silently ignored
    - name: Check for state left by a local run
      ansible.builtin.stat:
        path: "{{ tf_dir }}/terraform.tfstate"
      register: tf_local_state
      when: tf_backend_resolved == 's3'

    # Ignoring it would lose track of whatever the local run built, so stop and say how to move it
    - name: Stop when local state is waiting to be migrated
      ansible.builtin.fail:
        msg: >-
          {{ tf_dir }}/terraform.tfstate is left from a tf_backend=local run. Re-run with -e tf_migrate_state=true
          to copy it into Garage at {{ tf_sources.state_key }}.
      when:
        - tf_backend_resolved == 's3'
        - tf_local_state.stat.exists
        - not (tf_migrate_state | default(false) | bool)

    # The state key comes from the manifest; reconfigure because the backend may differ from the last run, or migrate when asked
    - name: Initialise Terraform
      ansible.builtin.command:
        argv: >-
          {{ ['terraform', 'init', '-input=false']
             + (['-migrate-state', '-force-copy'] if migrating else ['-reconfigure'])
             + (['-backend-config=key=' ~ tf_sources.state_key] if tf_backend_resolved == 's3' else []) }}
        chdir: "{{ tf_dir }}"
      environment: "{{ tf_env }}"
      changed_when: migrating
      vars:
        migrating: "{{ tf_backend_resolved == 's3' and (tf_local_state.stat.exists | default(false)) and (tf_migrate_state | default(false) | bool) }}"

    # The state now lives in Garage, so move the local copy aside where it cannot trigger another migration
    - name: Set the migrated local state aside
      ansible.builtin.command:
        argv: [mv, terraform.tfstate, terraform.tfstate.migrated]
        chdir: "{{ tf_dir }}"
        removes: "{{ tf_dir }}/terraform.tfstate"
      when:
        - tf_backend_resolved == 's3'
        - tf_local_state.stat.exists | default(false)
        - tf_migrate_state | default(false) | bool

    # Plan shows the changes without making them; apply makes them
    - name: Run Terraform
      community.general.terraform:
        project_path: "{{ tf_dir }}"
        state: "{{ 'planned' if tf_action_resolved == 'plan' else 'present' }}"
        plan_file: "{{ tf_dir ~ '/tfplan' if tf_action_resolved == 'plan' else omit }}"
        variables: "{{ tf_variables }}"
        # Lists and maps, such as a node list, need HCL formatting; plain values are unaffected
        complex_vars: true
      environment: "{{ tf_env }}"
      register: tf_result

    # Terraform masks sensitive values in its own output, so the plan is safe to show
    - name: Show Terraform's output
      ansible.builtin.debug:
        msg: "{{ tf_result.stdout_lines | default([]) }}"

    # Static VMs get their DNS name and DHCP reservation before anything connects to them; projects without a dns_reservations output reserve nothing
    - name: Reserve the VMs' addresses in OPNsense
      ansible.builtin.include_tasks: ../opnsense/dnsmasq_reserve_ip.yaml
      vars:
        opnsense_reservations: "{{ tf_result.outputs.dns_reservations.value | default([]) }}"
      when:
        - tf_action_resolved == 'apply'
        - tf_reserve_ip | default(true) | bool

    # Read by the NetBox plays below, which only run after an apply
    - name: Hand the built VMs over to NetBox
      ansible.builtin.set_fact:
        tf_netbox_records: "{{ tf_result.outputs.dns_reservations.value | default([]) if tf_action_resolved == 'apply' and tf_netbox | default(true) | bool else [] }}"

    # A reminder that local state has to be moved into Garage once it is running
    - name: Remind to migrate local state
      ansible.builtin.debug:
        msg: >-
          This run used local state in {{ tf_dir }}. Once Garage is up, re-run without tf_backend and with
          -e tf_migrate_state=true to move it into Garage at {{ tf_sources.state_key }}.
      when: tf_backend_resolved == 'local'

    # Only a successful apply leads on to the install; a plan, or tf_install=false, stops here
    - name: Hand the install over to the plays below
      ansible.builtin.set_fact:
        tf_install_hosts: >-
          {{ tf_sources.install.hosts if tf_action_resolved == 'apply' and tf_sources.install is defined
             and tf_install | default(true) | bool else '' }}

# Straight from the Terraform output, so it works for any provider; provider syncs such as the hourly Proxmox one add their own details later
- name: Record the built VMs in NetBox
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    # The VM, its eth0 and MAC, and its address with a DNS name; skipped unless an apply produced static addresses
    - name: Record the VMs
      ansible.builtin.include_tasks: ../netbox/record_vms.yaml
      vars:
        netbox_vm_records: "{{ tf_netbox_records | default([]) }}"
        netbox_vm_cluster: "{{ tf_sources.netbox_cluster | default('') }}"

# A new VM needs time to boot and run cloud-init before SSH answers; matches no hosts unless an install follows
- name: Wait for the built VM
  hosts: "{{ hostvars['localhost'].tf_install_hosts | default('', true) or 'localhost:!localhost' }}"
  gather_facts: false

  tasks:
    # Ten minutes covers a full clone and first boot; an existing VM answers at once
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 600

# Imports have to be known before the run starts, so the playbook is read from sources.yaml here; skipped, facts included, unless the apply led on to it
- name: Install or update what runs on the VM
  ansible.builtin.import_playbook: >-
    {% set root = playbook_dir ~ '/../../../' %}{% set project = tf_project | default('') %}{%
       set install = ((lookup('ansible.builtin.file', (project if project is abs else root ~ project) ~ '/sources.yaml', errors='ignore')
                       | default('', true) | from_yaml or {}).install.playbook | default('ansible/playbooks/terraform/no-install.yaml')) %}{{
       install if install is abs else root ~ install }}
  when: hostvars['localhost'].tf_install_hosts | default('') | length > 0
