---
# Task file: copies encrypted backup files to the backup server over SSH (rsync), into one folder only, with this host's own key
# The first run makes the key; the server must hold its public key behind a restriction (rrsync -wo -no-del <folder>), so this key can only
# write into its own folder: it cannot read or delete anything, or reach any other app's backups. Until that line is added, the run fails and prints it.
# Expects: backup_push_files (local paths), backup_push_folder (the folder under backup_push_root, e.g. Gitlab)
# Inventory: backup_push_host (the backup server), backup_push_user (default backup), backup_push_root (the backups dataset),
# backup_push_key (default ~/.ssh/backup_push_<folder>_ed25519 of the user running this: one key per folder, since the server limits each key to one)

- name: Require the backup server settings
  ansible.builtin.assert:
    that:
      - backup_push_host | default('') | length > 0
      - backup_push_root | default('') | length > 0
      - backup_push_folder | default('') | length > 0
      - backup_push_files | default([]) | length > 0
    fail_msg: Set backup_push_host and backup_push_root in the inventory; the job sets backup_push_folder and backup_push_files.
    quiet: true

- name: Work out the key's location
  ansible.builtin.set_fact:
    backup_push_key_path: >-
      {{ backup_push_key | default((lookup('ansible.builtin.env', 'HOME') if inventory_hostname == 'localhost' else '/root')
         ~ '/.ssh/backup_push_' ~ (backup_push_folder | lower) ~ '_ed25519') }}

- name: Ensure the key's folder exists
  ansible.builtin.file:
    path: "{{ backup_push_key_path | dirname }}"
    state: directory
    mode: "0700"

# The private key never leaves this host; only its public half goes to the backup server
- name: Make this host's backup key
  ansible.builtin.command:
    argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, "backup-push {{ inventory_hostname }} {{ backup_push_folder }}", -f, "{{ backup_push_key_path }}"]
    creates: "{{ backup_push_key_path }}"

- name: Read the public key
  ansible.builtin.slurp:
    src: "{{ backup_push_key_path }}.pub"
  register: backup_push_pub

# The exact line for the backup user's SSH keys: rrsync -wo -no-del limits this key to adding files to its one folder
- name: Work out the line the backup server needs
  ansible.builtin.set_fact:
    backup_push_authorized: >-
      command="rrsync -wo -no-del {{ backup_push_root }}/{{ backup_push_folder }}",restrict {{ backup_push_pub.content | b64decode | trim }}

# Its own known_hosts, so the first connection records the server's key and later ones must match it
- name: Copy the backups to the server
  ansible.builtin.command:
    argv: "{{ ['rsync', '--times', '--partial',
               '-e', 'ssh -i ' ~ backup_push_key_path ~ ' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
                     ~ ' -o UserKnownHostsFile=' ~ (backup_push_key_path | dirname) ~ '/backup_push_known_hosts']
             + backup_push_files
             + [(backup_push_user | default('backup')) ~ '@' ~ backup_push_host ~ ':./'] }}"
  register: backup_push_result
  changed_when: backup_push_result.rc == 0
  failed_when: false

- name: Stop when the server refused the copy
  ansible.builtin.fail:
    msg: >-
      The copy to the backup server failed ({{ (backup_push_result.stderr | default('') | trim) or (backup_push_result.msg | default('') | trim) or 'rsync exited ' ~ backup_push_result.rc }}).
      If this host's key is new, add this line
      to the {{ backup_push_user | default('backup') }} user's SSH public keys on {{ backup_push_host }}, then re-run:
      {{ backup_push_authorized }}
  when: backup_push_result.rc != 0

- name: Report the copy
  ansible.builtin.debug:
    msg: "Copied {{ backup_push_files | map('basename') | join(', ') }} to {{ backup_push_host }}:{{ backup_push_root }}/{{ backup_push_folder }}"
