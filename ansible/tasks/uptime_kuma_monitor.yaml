---
# Adds or updates an Uptime Kuma HTTP monitor; called at the end of install and deploy playbooks so every service they set up is watched
# Needs: kuma_monitor_name, kuma_monitor_url; optional kuma_monitor_group (default Applications, empty for none), kuma_monitor_interval (60), kuma_monitor_accepted_codes (['200-299']), kuma_monitor_ignore_tls (false)
# Connection: uptime_kuma_url in the inventory or UPTIME_KUMA_URL in the environment; when neither is set the monitor is skipped, so Kuma stays optional
# Vault: KUMA_USERNAME and KUMA_PASSWORD at uptime-kuma (vault_uptime_kuma_path renames it); needs VAULT_ADDR and VAULT_TOKEN unless the calling play already set vault_addr and vault_token
# Optional: uptime_kuma_notifications in the inventory, names of Kuma notifications attached to every monitor
# Every Kuma call runs from the controller, so this works from plays on any host; needs the lucasheld.uptime_kuma collection with the uptime-kuma-api2 package (Kuma 1.21.3 to 2.5.0) in place of its unmaintained uptime-kuma-api

# The inventory wins over the environment, the same as the other service URLs
- name: Find the Uptime Kuma address
  ansible.builtin.set_fact:
    kuma_api_url: "{{ (uptime_kuma_url | default(lookup('ansible.builtin.env', 'UPTIME_KUMA_URL'), true) | default('', true)) | regex_replace('/+$', '') }}"

# Says why nothing happened rather than failing, since Kuma is optional
- name: Skip the monitor when Uptime Kuma is not configured
  ansible.builtin.debug:
    msg: "No uptime_kuma_url or UPTIME_KUMA_URL is set, so no Uptime Kuma monitor was added for {{ kuma_monitor_name | default('this service') }}."
  when: kuma_api_url | length == 0

# Everything below needs Kuma
- name: Add the Uptime Kuma monitor
  when: kuma_api_url | length > 0
  block:
    # A missing name or URL is a bug in the calling playbook
    - name: Validate the monitor inputs
      ansible.builtin.assert:
        that:
          - kuma_monitor_name | default('') | length > 0
          - kuma_monitor_url | default('') is match('^https?://')
        fail_msg: "kuma_monitor_name and an http(s) kuma_monitor_url must be set by the calling playbook."

    # Plays that never read Vault themselves still need the connection details for var_lookup.yaml
    - name: Read the Vault connection settings
      ansible.builtin.set_fact:
        vault_addr: "{{ vault_addr | default(lookup('ansible.builtin.env', 'VAULT_ADDR'), true) }}"
        vault_token: "{{ vault_token | default(lookup('ansible.builtin.env', 'VAULT_TOKEN'), true) }}"
        vault_kv_mount: "{{ vault_kv_mount | default(lookup('ansible.builtin.env', 'VAULT_KV_MOUNT'), true) | default('secret', true) }}"
      no_log: true

    # Kuma's login, from its own Vault path
    - name: Load the Uptime Kuma credentials
      ansible.builtin.include_tasks: var_lookup.yaml
      vars:
        vault_secrets:
          - path: "{{ vault_uptime_kuma_path | default('uptime-kuma') }}"
            field: KUMA_USERNAME
            var: kuma_username
          - path: "{{ vault_uptime_kuma_path | default('uptime-kuma') }}"
            field: KUMA_PASSWORD
            var: kuma_password

    # One login per run; the token is reused by the calls below
    - name: Log in to Uptime Kuma
      lucasheld.uptime_kuma.login:
        api_url: "{{ kuma_api_url }}"
        api_username: "{{ kuma_username }}"
        api_password: "{{ kuma_password }}"
      register: kuma_login
      delegate_to: localhost
      become: false
      failed_when: false
      no_log: true

    # no_log above has to hide the whole result, since a successful one carries a long-lived token, so the likely causes are listed instead
    - name: Require a successful Uptime Kuma login
      ansible.builtin.assert:
        that:
          - kuma_login.token is defined
        fail_msg: "Uptime Kuma login at {{ kuma_api_url }} failed. Check the runner can reach it, KUMA_USERNAME and KUMA_PASSWORD at {{ vault_uptime_kuma_path | default('uptime-kuma') }}, that 2FA is off for that user, and that the runner has uptime-kuma-api2 (the old uptime-kuma-api is 1.x only)."
        quiet: true

    # Groups keep the dashboard sorted; created the first time a monitor uses one
    - name: Ensure the monitor group exists
      lucasheld.uptime_kuma.monitor:
        api_url: "{{ kuma_api_url }}"
        api_token: "{{ kuma_login.token }}"
        name: "{{ kuma_monitor_group | default('Applications') }}"
        type: group
        state: present
      delegate_to: localhost
      become: false
      when: kuma_monitor_group | default('Applications') | length > 0

    # Matched by name, so re-running updates the monitor instead of adding a second one
    - name: Add or update the monitor
      lucasheld.uptime_kuma.monitor:
        api_url: "{{ kuma_api_url }}"
        api_token: "{{ kuma_login.token }}"
        name: "{{ kuma_monitor_name }}"
        type: http
        url: "{{ kuma_monitor_url }}"
        interval: "{{ kuma_monitor_interval | default(60) | int }}"
        accepted_statuscodes: "{{ kuma_monitor_accepted_codes | default(['200-299']) }}"
        ignoreTls: "{{ kuma_monitor_ignore_tls | default(false) | bool }}"
        expiryNotification: "{{ kuma_monitor_url is match('^https://') }}"
        parent_name: "{{ kuma_monitor_group | default('Applications') if kuma_monitor_group | default('Applications') | length > 0 else omit }}"
        notification_names: "{{ uptime_kuma_notifications | default(omit) }}"
        state: present
      delegate_to: localhost
      become: false

    # Shown so the run log says what is being watched
    - name: Report the monitor
      ansible.builtin.debug:
        msg: "Uptime Kuma is monitoring {{ kuma_monitor_name }} at {{ kuma_monitor_url }}"
