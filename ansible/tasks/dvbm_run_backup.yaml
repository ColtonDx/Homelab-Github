---
# Runs a stack's DVBMv3 backup job on demand and waits for it; used by backups/dvbm-backup.yaml and portainer/update-stack.yaml, and fails the play unless the backup succeeds
# Needs: dvbm_url, dvbm_password, dvbm_backup_name; optional dvbm_backup_timeout (default 1800), dvbm_backup_interval (default 10), dvbm_validate_certs (default false)
# Sets: dvbm_backup_id, the backup record to restore from later

# Stop early with a clear message when the inputs are missing
- name: Ensure DVBMv3 backup inputs are provided
  ansible.builtin.assert:
    that:
      - dvbm_url | default('') | length > 0
      - dvbm_backup_name | default('') | length > 0
      - dvbm_password | default('') | length > 0
    fail_msg: "dvbm_url, dvbm_backup_name and dvbm_password must be set before including dvbm_run_backup.yaml."

# Log in with the app password to get a bearer token
- name: Authenticate with DVBMv3
  ansible.builtin.uri:
    url: "{{ dvbm_url }}/api/auth/login"
    method: POST
    body_format: json
    body:
      password: "{{ dvbm_password }}"
    status_code: 200
    validate_certs: "{{ dvbm_validate_certs | default(false) }}"
  register: dvbm_run_auth
  retries: 5
  delay: 3
  until: dvbm_run_auth is not failed
  no_log: true

# Kept for the API calls below
- name: Set DVBMv3 bearer token fact
  ansible.builtin.set_fact:
    dvbm_token: "{{ dvbm_run_auth.json.token }}"
  no_log: true

# Jobs are matched by name, which is the Backup label value
- name: Get all DVBMv3 backup jobs
  ansible.builtin.uri:
    url: "{{ dvbm_url }}/api/jobs"
    method: GET
    headers:
      Authorization: "Bearer {{ dvbm_token }}"
    status_code: 200
    validate_certs: "{{ dvbm_validate_certs | default(false) }}"
  register: dvbm_run_jobs

# Empty when no job exists for this stack
- name: Find the backup job matching the Backup label value
  ansible.builtin.set_fact:
    dvbm_run_job: >-
      {{ dvbm_run_jobs.json | selectattr('name', 'equalto', dvbm_backup_name) | list | first | default({}) }}

# deploy-stack.yaml registers the job only when run with DVBM_JOB=true, so it can be missing
- name: Fail if no matching backup job exists
  ansible.builtin.fail:
    msg: >-
      No DVBMv3 backup job named '{{ dvbm_backup_name }}'. Deploy the stack with DVBM_JOB=true
      so the job is registered, or create it manually.
  when: dvbm_run_job == {}

# The newest record before triggering, so the new run can be told apart from older ones
- name: Record the newest existing backup for this job
  ansible.builtin.uri:
    url: "{{ dvbm_url }}/api/backups?job_id={{ dvbm_run_job.id }}&limit=1"
    method: GET
    headers:
      Authorization: "Bearer {{ dvbm_token }}"
    status_code: 200
    validate_certs: "{{ dvbm_validate_certs | default(false) }}"
  register: dvbm_prior_backups

# Zero when the job has never run
- name: Set the pre-existing backup ID fact
  ansible.builtin.set_fact:
    dvbm_prior_backup_id: "{{ (dvbm_prior_backups.json | first | default({})).id | default(0) }}"

# Start the backup now rather than waiting for its schedule
- name: Trigger the backup job
  ansible.builtin.uri:
    url: "{{ dvbm_url }}/api/jobs/{{ dvbm_run_job.id }}/run"
    method: POST
    headers:
      Authorization: "Bearer {{ dvbm_token }}"
    status_code: 200
    validate_certs: "{{ dvbm_validate_certs | default(false) }}"
  register: dvbm_trigger_result

# Say what is being waited on
- name: Report backup trigger
  ansible.builtin.debug:
    msg: "Triggered DVBMv3 backup job '{{ dvbm_backup_name }}' (job ID: {{ dvbm_run_job.id }}), waiting for completion"

# Poll until a record newer than the one above exists and has stopped running
- name: Wait for a new backup record to finish
  ansible.builtin.uri:
    url: "{{ dvbm_url }}/api/backups?job_id={{ dvbm_run_job.id }}&limit=1"
    method: GET
    headers:
      Authorization: "Bearer {{ dvbm_token }}"
    status_code: 200
    validate_certs: "{{ dvbm_validate_certs | default(false) }}"
  register: dvbm_poll
  retries: "{{ ((dvbm_backup_timeout | default(1800) | int) / (dvbm_backup_interval | default(10) | int)) | round(0, 'ceil') | int }}"
  delay: "{{ dvbm_backup_interval | default(10) | int }}"
  until: >-
    (dvbm_poll.json | length > 0)
    and ((dvbm_poll.json | first).id | int > dvbm_prior_backup_id | int)
    and ((dvbm_poll.json | first).status != 'running')

# The finished record, checked below
- name: Set the new backup record fact
  ansible.builtin.set_fact:
    dvbm_backup_record: "{{ dvbm_poll.json | first }}"

# A failed backup stops the play, so update-stack.yaml never updates after a failed backup
- name: Fail if the backup did not succeed
  ansible.builtin.fail:
    msg: >-
      DVBMv3 backup '{{ dvbm_backup_name }}' finished with status
      '{{ dvbm_backup_record.status }}': {{ dvbm_backup_record.error_message | default('no error message') }}.
      Stopping here.
  when: dvbm_backup_record.status != 'success'

# Remembered so a failed update can point at the exact backup to restore
- name: Set the backup ID fact for a later restore
  ansible.builtin.set_fact:
    dvbm_backup_id: "{{ dvbm_backup_record.id }}"

# Report which volumes were saved
- name: Report backup completion
  ansible.builtin.debug:
    msg: >-
      DVBMv3 backup '{{ dvbm_backup_name }}' completed (backup ID: {{ dvbm_backup_id }},
      volumes: {{ dvbm_backup_record.volumes_backed_up | default([]) | join(', ') }}).
