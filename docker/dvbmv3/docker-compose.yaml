services:
  docker-volume-backup-manager:
    container_name: dvbmv3
    restart: unless-stopped
    image: coltondx/docker-volume-backup-manager-v3:latest
    networks:
      - reverseproxy-nw
    environment:
      - APP_PASSWORD=${DVBM3_PASSWORD}
      - JWT_SECRET=${DVBM3_JWT}
      - DB_ENCRYPTION_KEY=${DVBM3_ENCRYPTION_KEY}
      - MIGRATE_ENCRYPTED_DB=true

      # ── Allowed hosts / CORS ──────────────────────────────────────────────
      # Restrict which Host header values are accepted (default: any).
      # Include every hostname/IP used to reach this container, e.g.:
      #   ALLOWED_HOSTS=myhost.example.com,localhost
      # - ALLOWED_HOSTS=*
      #
      # Restrict CORS origins (default: any).
      #   ALLOWED_ORIGINS=https://myhost.example.com
      # - ALLOWED_ORIGINS=*

      # ── HTTPS / TLS ───────────────────────────────────────────────────────
      # Enabled by default. A self-signed cert is generated on first start
      # and stored in /data/certs (persisted in the data volume).
      # No ports are published, so reach the UI through the reverse proxy with scheme https to port 8000
      #
      # Disable TLS (plain HTTP):
      # - SSL_ENABLED=false
      #
      # Use a custom cert (e.g. from Let's Encrypt via a bind-mount):
      # - SSL_CERT_FILE=/data/certs/fullchain.pem
      # - SSL_KEY_FILE=/data/certs/privkey.pem
    volumes:
      # Required: Docker socket so we can manage containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent data (SQLite database + auto-generated TLS certs)
      - data:/data
      # Temp directory for building archives before upload
      - temp:/backups
      # Optional: local backup storage directory
      - ./local-backups:/local-backups
      - /mnt/NASPool/Docker/rclone/rclone.conf:/root/.config/rclone/rclone.conf:ro
    labels:
      - "AppPort=8000" # Sets the Application Port for the Reverse Proxy Job
      - "Kuma.Name=DVBMv3" # Uptime Kuma monitor, created by the Uptime Kuma GitOps job
      - "Kuma.Subdomain=dvbm3" # Address checked: https://dvbm3.<docker_domain>
      - "AppScheme=https" # Sets the Reverse Proxy Job to forward over HTTPS

volumes:
  data:
  temp:

networks:
  reverseproxy-nw: # Use the existing Reverse Proxy Network
    external: true
