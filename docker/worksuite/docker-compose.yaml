services:
  web:
    container_name: worksuite
    restart: unless-stopped
    # GITLAB_REGISTRY is the GitLab container registry host, e.g. registry.example.com
    # Tracks latest; Portainer's GitOps update re-pulls it so new releases deploy automatically
    image: ${GITLAB_REGISTRY}/development/worksuite:latest
    networks:
      - reverseproxy-nw
#    ports:
#      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/printerpricer.db
    volumes:
      - data:/data
#      - app:/app/app
    security_opt:
      - no-new-privileges:true # No process can gain more privileges than it started with (blocks setuid tricks)
    # hardening: cap_drop skipped: our own image, whose capabilities are set with the project
    # hardening: healthcheck skipped until the image documents one; Kuma's HTTP check covers it
    mem_limit: 1g # A runaway process cannot take the host's memory
    pids_limit: 512 # Nor fork without limit
    logging: # Rotate container logs so they cannot fill the disk
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "Backup=worksuite" # Sets the DVBM Backup Job Label
      - "AppPort=8000" # Sets the Application Port for the Reverse Proxy Job
      - "Kuma.Name=Worksuite" # Uptime Kuma monitor, created by the Uptime Kuma GitOps job
      - "Kuma.DockerHost=truenas-scale" # Uptime Kuma container check on this Docker host (inventory name)

volumes:
  data:
  app:

networks:
  reverseproxy-nw: # Use the existing Reverse Proxy Network
    external: true
