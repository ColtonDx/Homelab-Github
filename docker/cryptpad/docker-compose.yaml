services:
  cryptpad:
    container_name: cryptpad
    hostname: cryptpad
    restart: unless-stopped
    # Pinned by digest; 2026 releases move the domains into config/infra.js, so upgrading is its own change
    image: "cryptpad/cryptpad:version-2025.3.0@sha256:81da8210f93f7caa124bd6554115570898d7f6b5579e63ae65953615d66a9e1a"
    networks:
      - reverseproxy-nw
    environment:
      - CPAD_MAIN_DOMAIN=https://cryptpad.${DOCKER_DOMAIN}
      - CPAD_SANDBOX_DOMAIN=https://sandbox-cryptpad.${DOCKER_DOMAIN}
      - CPAD_CONF=/cryptpad/config/config.js

      # Read and accept the license before uncommenting the following line:
      # https://github.com/ONLYOFFICE/web-apps/blob/master/LICENSE.txt
      # - CPAD_INSTALL_ONLYOFFICE=yes
    # Only the data folders are volumes, as upstream does; a volume over all of /cryptpad would keep the old app files after an image upgrade
    # config.js is not kept: the image rebuilds it from the two domains above at every start
    volumes:
      - blob:/cryptpad/blob
      - block:/cryptpad/block
      - customize:/cryptpad/customize
      - data:/cryptpad/data
      - datastore:/cryptpad/datastore
      - onlyoffice-dist:/cryptpad/www/common/onlyoffice/dist
      - onlyoffice-conf:/cryptpad/onlyoffice-conf
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    labels:
      - "Backup=cryptpad" # Sets the DVBM Backup Job Label
      - "AppPort=3000" # Sets the Application Port for the Reverse Proxy Job
      - "Kuma.Name=CryptPad" # Uptime Kuma monitor, created by the Uptime Kuma GitOps job
      - "Kuma.DockerHost=truenas-scale" # Uptime Kuma container check on this Docker host (inventory name)

networks:
  reverseproxy-nw: # Use the existing Reverse Proxy Network
    external: true

volumes:
  blob:
  block:
  customize:
  data:
  datastore:
  onlyoffice-dist:
  onlyoffice-conf:
