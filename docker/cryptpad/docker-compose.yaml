services:
  cryptpad:
    container_name: cryptpad
    hostname: cryptpad
    restart: unless-stopped
    # Pinned by digest so upgrades arrive as reviewed changes; laid out like upstream's own compose file for this release
    image: "cryptpad/cryptpad:version-2026.10.1@sha256:b1129d954692e9b8a7d198e79d3080d3627051c95137bbf41a7d2683aa53305d"
    # Upstream runs the app read-only: everything it writes goes to the volumes below or /tmp
    read_only: true
    networks:
      - reverseproxy-nw
    environment:
      # With these set, CryptPad builds its config from them and listens on all interfaces; both domains are proxied to port 3000
      - CPAD_MAIN_DOMAIN=https://cryptpad.${DOCKER_DOMAIN}
      - CPAD_SANDBOX_DOMAIN=https://sandbox-cryptpad.${DOCKER_DOMAIN}

      # Read and accept the license before uncommenting the following line:
      # https://github.com/Euro-Office/web-apps/raw/refs/heads/main/LICENSE.txt
      # - CPAD_INSTALL_OFFICE=yes
    # Only data and settings are volumes, as upstream does, so an image upgrade always runs the new app files
    volumes:
      - blob:/cryptpad/blob
      - block:/cryptpad/block
      - customize:/cryptpad/customize
      - data:/cryptpad/data
      - datastore:/cryptpad/datastore
      - onlyoffice-dist:/cryptpad/www/common/onlyoffice/dist
      - onlyoffice-conf:/cryptpad/onlyoffice-conf
      # config.js and infra.js; created from the image's examples on the first start
      - config:/cryptpad/config
      - type: tmpfs
        target: /tmp
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    labels:
      - "Backup=cryptpad" # Sets the DVBM Backup Job Label
      - "AppPort=3000" # Sets the Application Port for the Reverse Proxy Job
      - "Kuma.Name=CryptPad" # Uptime Kuma monitor, created by the Uptime Kuma GitOps job
      - "Kuma.DockerHost=truenas-scale" # Uptime Kuma container check on this Docker host (inventory name)

networks:
  reverseproxy-nw: # Use the existing Reverse Proxy Network
    external: true

volumes:
  blob:
  block:
  customize:
  data:
  datastore:
  onlyoffice-dist:
  onlyoffice-conf:
  config:
