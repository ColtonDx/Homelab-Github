services:
  omni-tools:
    container_name: omnitools
    restart: unless-stopped
    image: iib0011/omni-tools:latest
    networks:
      - reverseproxy-nw
    labels:
      - "AppPort=80" # Sets the Application Port for the Reverse Proxy Job
      - "Kuma.Name=Omnitools" # Uptime Kuma monitor, created by the Uptime Kuma GitOps job

networks:
  reverseproxy-nw: # Use the existing Reverse Proxy Network
    external: true
