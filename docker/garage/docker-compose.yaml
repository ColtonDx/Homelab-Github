services:
  garage:
    container_name: garage
    restart: unless-stopped
    # Pinned by digest to the version that was running; updates arrive as reviewed changes
    image: dxflrs/garage:v2.2.0@sha256:45a61ce3f7c9c24fc23d9ed2b09b27ed560ab87b34605d175d5c588f539c24e4
    networks:
      - reverseproxy-nw
    environment:
      # From Vault (garage); these override the same settings in garage.toml, so the file needs no secrets
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - data:/var/lib/garage
      - etc:/etc
    labels:
      - "Backup=garage" # Sets the DVBM Backup Job Label
      - "Kuma.DockerHost=truenas-scale" # Uptime Kuma container check on this Docker host (inventory name)

  webui:
    container_name: garage-webui
    restart: unless-stopped
    # Pinned by digest so a moved tag cannot change what runs; updates come as reviewed changes
    image: khairul169/garage-webui:1.1.0@sha256:17c793551873155065bf9a022dabcde874de808a1f26e648d4b82e168806439c
    networks:
      - reverseproxy-nw
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
      # Web UI login as username:bcrypt-hash, from Vault (garage / GARAGE_AUTH_PASS); without it the UI is open
      AUTH_USER_PASS: ${GARAGE_AUTH_PASS}
      # The admin token and region the UI would otherwise read from garage.toml, which it no longer mounts
      API_ADMIN_KEY: ${GARAGE_ADMIN_TOKEN}
      S3_REGION: ${GARAGE_S3_REGION:-garage}
    labels:
      - "Backup=garage" # Sets the DVBM Backup Job Label
      - "AppPort=3909" # Sets the Application Port for the Reverse Proxy Job
      - "Kuma.Name=Garage" # Uptime Kuma monitor, created by the Uptime Kuma GitOps job
      - "Kuma.Subdomain=garageui" # Address checked: https://garageui.<docker_domain>
      - "Kuma.DockerHost=truenas-scale" # Uptime Kuma container check on this Docker host (inventory name)


networks:
  reverseproxy-nw: # Use the existing Reverse Proxy Network
    external: true

volumes:
  data:
  etc:
