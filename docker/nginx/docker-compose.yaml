services:
  nginx:
    container_name: nginx
    restart: unless-stopped
    image: 'jc21/nginx-proxy-manager:latest'
    networks:
      - reverseproxy-nw
    ports:
      - '80:80' # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '81:81' # Admin Web Port
    environment:
      DISABLE_IPV6: 'true'
    volumes:
      - data:/data
      - letsencrypt:/etc/letsencrypt
      # TrueNAS path to the theme-park script (https://docs.theme-park.dev/themes/nginx-proxy-manager/), still in the old proxy_data volume; change for other hosts
      - /mnt/.ix-apps/docker/volumes/nginx_data/_data/98-themepark:/etc/cont-init.d/99-themepark
    security_opt:
      - no-new-privileges:true # No process can gain more privileges than it started with (blocks setuid tricks)
    cap_drop:
      - ALL # Start with no Linux capabilities at all
    cap_add: # What its init needs to hand its folders to the app's user and drop to it:
      - CHOWN # give its folders to that user
      - DAC_OVERRIDE # read and fix files it does not own yet
      - FOWNER # change permissions on them
      - SETUID # switch to the app's user
      - SETGID # and its group
      - NET_BIND_SERVICE # listen on ports 80, 443 and 81
    # Not read-only: its init writes service files and it keeps its database and certificates in its volumes
    healthcheck: # The image's own health script, which checks the admin API answers
      test: ["CMD", "/usr/bin/check-health"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 1m
    mem_limit: 1g # A runaway process cannot take the host's memory
    pids_limit: 1024 # Nor fork without limit; the limit counts threads
    logging: # Rotate container logs so they cannot fill the disk
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "Backup=nginx" # Sets the DVBM Backup Job Label
      - "Kuma.DockerHost=truenas-scale" # Uptime Kuma container check on this Docker host (inventory name)

networks:
  reverseproxy-nw: # Use the existing Reverse Proxy Network
    external: true

volumes:
  data:
  letsencrypt:
