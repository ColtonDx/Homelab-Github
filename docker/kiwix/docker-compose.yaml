services:
  kiwix:
    container_name: kiwix
    restart: unless-stopped
    image: ghcr.io/kiwix/kiwix-serve
    # The image runs as uid 1001, which cannot read the ZIM files (owned 3000:0, mode 770), so it runs as their owner
    user: "3000:0"
    networks:
      - reverseproxy-nw
    volumes:
      - data:/data
    command: "*.zim"
    labels:
      - "Backup=kiwix" # Sets the DVBM Backup Job Label
      - "AppPort=8080" # Sets the Application Port for the Reverse Proxy Job
      - "Kuma.Name=Kiwix" # Uptime Kuma monitor, created by the Uptime Kuma GitOps job
      - "Kuma.DockerHost=truenas-scale" # Uptime Kuma container check on this Docker host (inventory name)

networks:
  reverseproxy-nw: # Use the existing Reverse Proxy Network
    external: true

volumes:
  data:
