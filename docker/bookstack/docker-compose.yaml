services:
  bookstack:
    container_name: bookstack
    restart: unless-stopped
    # Pinned by digest to the version that was running; updates arrive as reviewed changes
    image: lscr.io/linuxserver/bookstack:v26.09.3-ls300@sha256:5e44313f320a8a6f92f171b1beca4748f3e0a5110a4f4c19047cb4b4e43695a2
    depends_on:
      - mariadb
    networks:
      - default
      - reverseproxy-nw
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - APP_URL=https://bookstack.${DOCKER_DOMAIN}
      - APP_KEY=${BOOKSTACK_APP_KEY}
      - DB_HOST=bookstack_mariadb
      - DB_PORT=3306
      - DB_USERNAME=Bookstack
      - DB_PASSWORD=${BOOKSTACK_DB_PASSWORD}
      - DB_DATABASE=Bookstack
    volumes:
      - data:/config
    security_opt:
      - no-new-privileges:true # No process can gain more privileges than it started with (blocks setuid tricks)
    cap_drop:
      - ALL # Start with no Linux capabilities at all
    cap_add: # What its init needs to hand its folders to the app's user and drop to it:
      - CHOWN # give its folders to that user
      - DAC_OVERRIDE # read and fix files it does not own yet
      - FOWNER # change permissions on them
      - SETUID # switch to the app's user
      - SETGID # and its group
      - NET_BIND_SERVICE # listen on port 80
    # Not read-only: linuxserver's init writes its user and service files at start-up
    healthcheck: # Lets Docker and Kuma see a hung app, not just a running container
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/status"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 2m
    mem_limit: 1g # A runaway process cannot take the host's memory
    pids_limit: 512 # Nor fork without limit
    logging: # Rotate container logs so they cannot fill the disk
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "Backup=bookstack" # Sets the DVBM Backup Job Label
      - "AppPort=80" # Sets the Application Port for the Reverse Proxy Job
      - "Kuma.Name=Bookstack" # Uptime Kuma monitor, created by the Uptime Kuma GitOps job
      - "Kuma.DockerHost=truenas-scale" # Uptime Kuma container check on this Docker host (inventory name)

  mariadb:
    container_name: bookstack_mariadb
    restart: unless-stopped
    # Pinned by digest to the version that was running; updates arrive as reviewed changes
    image: lscr.io/linuxserver/mariadb:11.8.10-r0-ls241@sha256:4d9fb8985c06b2099d8421fb4070c4db0f61f3973e3b6828f6607cb0853f292d
    networks:
      - default
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - MYSQL_ROOT_PASSWORD=${BOOKSTACK_MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=Bookstack
      - MYSQL_USER=Bookstack
      - MYSQL_PASSWORD=${BOOKSTACK_DB_PASSWORD}
    volumes:
      - data:/config
    security_opt:
      - no-new-privileges:true # No process can gain more privileges than it started with (blocks setuid tricks)
    cap_drop:
      - ALL # Start with no Linux capabilities at all
    cap_add: # What its init needs to hand its folders to the app's user and drop to it:
      - CHOWN # give its folders to that user
      - DAC_OVERRIDE # read and fix files it does not own yet
      - FOWNER # change permissions on them
      - SETUID # switch to the app's user
      - SETGID # and its group
    # Not read-only: linuxserver's init writes its user and service files at start-up
    healthcheck: # Lets Docker see a database that stopped answering
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 1m
    mem_limit: 1g # A runaway process cannot take the host's memory
    pids_limit: 512 # Nor fork without limit; the limit counts threads
    logging: # Rotate container logs so they cannot fill the disk
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "Backup=bookstack" # Sets the DVBM Backup Job Label
      - "Kuma.DockerHost=truenas-scale" # Uptime Kuma container check on this Docker host (inventory name)

networks:
  default:
  reverseproxy-nw: # Use the existing Reverse Proxy Network
    external: true

volumes:
  data:
