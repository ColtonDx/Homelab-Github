services:
  bookstack:
    container_name: bookstack
    restart: unless-stopped
    # Pinned by digest to the version that was running; updates arrive as reviewed changes
    image: lscr.io/linuxserver/bookstack:v26.09.3-ls300@sha256:5e44313f320a8a6f92f171b1beca4748f3e0a5110a4f4c19047cb4b4e43695a2
    depends_on:
      - mariadb
    networks:
      - default
      - reverseproxy-nw
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - APP_URL=https://bookstack.${DOCKER_DOMAIN}
      - APP_KEY=${BOOKSTACK_APP_KEY}
      - DB_HOST=bookstack_mariadb
      - DB_PORT=3306
      - DB_USERNAME=Bookstack
      - DB_PASSWORD=${BOOKSTACK_DB_PASSWORD}
      - DB_DATABASE=Bookstack
    volumes:
      - data:/config
    labels:
      - "Backup=bookstack" # Sets the DVBM Backup Job Label
      - "AppPort=80" # Sets the Application Port for the Reverse Proxy Job
      - "Kuma.Name=Bookstack" # Uptime Kuma monitor, created by the Uptime Kuma GitOps job
      - "Kuma.DockerHost=truenas-scale" # Uptime Kuma container check on this Docker host (inventory name)

  mariadb:
    container_name: bookstack_mariadb
    restart: unless-stopped
    # Pinned by digest to the version that was running; updates arrive as reviewed changes
    image: lscr.io/linuxserver/mariadb:11.8.10-r0-ls241@sha256:4d9fb8985c06b2099d8421fb4070c4db0f61f3973e3b6828f6607cb0853f292d
    networks:
      - default
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - MYSQL_ROOT_PASSWORD=${BOOKSTACK_MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=Bookstack
      - MYSQL_USER=Bookstack
      - MYSQL_PASSWORD=${BOOKSTACK_DB_PASSWORD}
    volumes:
      - data:/config
    labels:
      - "Backup=bookstack" # Sets the DVBM Backup Job Label
      - "Kuma.DockerHost=truenas-scale" # Uptime Kuma container check on this Docker host (inventory name)

networks:
  default:
  reverseproxy-nw: # Use the existing Reverse Proxy Network
    external: true

volumes:
  data:
