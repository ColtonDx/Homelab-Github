services:
  vaultwarden:
    container_name: vaultwarden
    hostname: Vaultwarden
    restart: unless-stopped
    image: vaultwarden/server
    networks:
      - reverseproxy-nw
    environment:
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      WEBSOCKET_ENABLED: 'true' # Ignored since Vaultwarden 1.29, which serves websockets on the main port
      SIGNUPS_ALLOWED: 'false'   # set to false to disable signups
      LOG_FILE: /data/vaultwarden.log
      LOG_LEVEL: 'warn'
      EXTENDED_LOGGING: 'true'
    volumes:
      - data:/data
    labels:
      - "Backup=vaultwarden" # Sets the DVBM Backup Job Label
      - "AppPort=80" # Sets the Application Port for the Reverse Proxy Job
      - "Kuma.Name=Vaultwarden" # Uptime Kuma monitor, created by the Uptime Kuma GitOps job
      - "Kuma.Subdomain=vault" # Address checked: https://vault.<docker_domain>

volumes:
  data:

networks:
  reverseproxy-nw: # Use the existing Reverse Proxy Network
    external: true
