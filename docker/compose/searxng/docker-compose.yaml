services:
  core:
    container_name: searxng-core
    restart: always
    image: docker.io/searxng/searxng:latest
    networks:
      - searxng
      - reverseproxy-nw
    volumes:
      - config:/etc/searxng/:Z
      - core-data:/var/cache/searxng/
    labels:
      - "Backup=SearxNG"
      - "AppPort=8080"

  valkey:
    container_name: searxng-valkey
    restart: always
    image: docker.io/valkey/valkey:9-alpine
    networks:
      - searxng
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - valkey-data:/data/
    labels:
      - "Backup=SearxNG"

volumes:
  core-data:
  valkey-data:
  config:

networks:
  searxng:
  reverseproxy-nw:
    external: true
