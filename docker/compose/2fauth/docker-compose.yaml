services:
  2fauth:
    container_name: 2fauth
    restart: unless-stopped
    image: 2fauth/2fauth
    networks:
      - reverseproxy-nw
    environment:
      - APP_NAME=2FAuth
      - APP_ENV=local
      # Set to true if you want to see debug information in error screens.
      - APP_DEBUG=false
      - SITE_OWNER=${EMAIL}
      # The encryption key for  our database and sessions. Keep this very secure.
      # If you generate a new one all existing data must be considered LOST.
      # Change it to a string of exactly 32 chars or use command `php artisan key:generate` to generate it
      - APP_KEY=${TWOFA_APPKEY}
      - APP_URL=${TWOFA_URL}
      - ASSET_URL=${TWOFA_URL}
      - IS_DEMO_APP=false
      - LOG_CHANNEL=daily
      - APP_LOG_LEVEL=notice
      - DB_DATABASE="/2fauth/database.sqlite"
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      # Mail settings
      # Refer your email provider documentation to configure your mail settings
      # Set a value for every available setting to avoid issue
      - MAIL_DRIVER=log
      - MAIL_HOST=smtp.mailtrap.io
      - MAIL_PORT=2525
      - MAIL_FROM=changeme@example.com
      - MAIL_USERNAME=null
      - MAIL_PASSWORD=null
      - MAIL_ENCRYPTION=null
      - MAIL_FROM_NAME=null
      - MAIL_FROM_ADDRESS=null
      # Leave the following configuration vars as is.
      # Unless you like to tinker and know what you're doing.
      - BROADCAST_DRIVER=log
      - QUEUE_DRIVER=sync
      - SESSION_LIFETIME=12
      - REDIS_HOST=127.0.0.1
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - PUSHER_APP_ID=
      - PUSHER_APP_KEY=
      - PUSHER_APP_SECRET=
      - PUSHER_APP_CLUSTER=mt1
      #- MIX_PUSHER_APP_KEY="${PUSHER_APP_KEY}"
      #- MIX_PUSHER_APP_CLUSTER="${PUSHER_APP_CLUSTER}"
      - MIX_ENV=local
      - TRUSTED_PROXIES=*
    volumes:
      - data:/2fauth
    labels:
      - "Backup=2fauth" # Sets the DVBM Backup Job Label
      - "AppPort=8000" # Sets the Application Port for the Reverse Proxy Job

networks:
  reverseproxy-nw: # Use the existing Reverse Proxy Network
    external: true

volumes:
    data:
