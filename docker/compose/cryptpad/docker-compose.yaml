services:
  cryptpad:
    container_name: cryptpad
    hostname: cryptpad
    restart: unless-stopped
    image: "cryptpad/cryptpad:version-2025.3.0"
    networks:
      - reverseproxy-nw
    environment:
      - CPAD_MAIN_DOMAIN=https://cryptpad.${DOCKER_DOMAIN}
      - CPAD_SANDBOX_DOMAIN=https://sandbox-cryptpad.${DOCKER_DOMAIN}
      - CPAD_CONF=/cryptpad/config/config.js

      # Read and accept the license before uncommenting the following line:
      # https://github.com/ONLYOFFICE/web-apps/blob/master/LICENSE.txt
      # - CPAD_INSTALL_ONLYOFFICE=yes
    volumes:
      - data:/cryptpad
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    labels:
      - "Backup=Cryptpad"
      - "AppPort=3000"

networks:
  reverseproxy-nw:
    external: true

volumes:
  data:
