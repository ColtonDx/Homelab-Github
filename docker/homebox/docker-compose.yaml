services:
  homebox:
    container_name: homebox
    restart: unless-stopped
    # The original project is archived; this is its maintained continuation, pinned by digest so upgrades arrive as reviewed changes
    image: ghcr.io/sysadminsmedia/homebox:0.27.1@sha256:9d0b64776c694f018c0ca06faf52105a33ca376024f46bb58e6ab0e2b728bb61
    networks:
      - reverseproxy-nw
#    ports:
#      - 3100:7745
    environment:
      - HBOX_LOG_LEVEL=info
      - HBOX_LOG_FORMAT=text
      - HBOX_WEB_MAX_UPLOAD_SIZE=10
      # Accounts already exist, so nobody else can register
      - HBOX_OPTIONS_ALLOW_REGISTRATION=false
      # Required since 0.27: secret used to hash API keys (from Vault); changing it invalidates every issued API key
      - HBOX_AUTH_API_KEY_PEPPER=${HOMEBOX_API_KEY_PEPPER}
    volumes:
      - data:/data/
    labels:
      - "Backup=homebox" # Sets the DVBM Backup Job Label
      - "AppPort=7745" # Sets the Application Port for the Reverse Proxy Job
      - "Kuma.Name=Homebox" # Uptime Kuma monitor, created by the Uptime Kuma GitOps job
      - "Kuma.DockerHost=truenas-scale" # Uptime Kuma container check on this Docker host (inventory name)

networks:
  reverseproxy-nw: # Use the existing Reverse Proxy Network
    external: true

volumes:
  data:
