services:
  changedetection:
    container_name: changedetection
    restart: unless-stopped
    image: lscr.io/linuxserver/changedetection.io:latest
    networks:
      - reverseproxy-nw
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - data:/config
    labels:
      - "Backup=changedetection" # Sets the DVBM Backup Job Label
      - "AppPort=5000" # Sets the Application Port for the Reverse Proxy Job
      - "Kuma.Name=ChangeDetection.io" # Uptime Kuma monitor, created by the Uptime Kuma GitOps job
      - "Kuma.Subdomain=detect" # Address checked: https://detect.<docker_domain>
      - "Kuma.DockerHost=truenas-scale" # Uptime Kuma container check on this Docker host (inventory name)

networks:
  reverseproxy-nw: # Use the existing Reverse Proxy Network
    external: true

volumes:
  data:
