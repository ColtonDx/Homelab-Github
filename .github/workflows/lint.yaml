---
# Checks every push and pull request: YAML style, Ansible syntax, Terraform formatting and validity, Kubernetes manifests, IaC misconfigurations,
# secrets in the new commits, and private values in the files and the new commits
# Actions are pinned to commit SHAs and downloaded tools to checksums, so a moved tag or a swapped release cannot change what runs
name: Lint

on:
  push:
  pull_request:

# Read-only, since no job writes back to the repo
permissions:
  contents: read

# A newer push to the same branch cancels the older run
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Style and syntax for every YAML file, using the rules in .yamllint
  yamllint:
    runs-on: ubuntu-latest
    steps:
      # The repo at the pushed commit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The runner image's system Python refuses pip installs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # Pinned so a new release cannot fail an unchanged repo
      - name: Install yamllint
        run: pip install yamllint==1.38.0

      # GitHub annotations point at the offending line in the diff view
      - name: Run yamllint
        run: yamllint -s -f github .

  # Parses every playbook with the same Ansible and collections the Semaphore runner uses
  ansible:
    runs-on: ubuntu-latest
    steps:
      # The repo at the pushed commit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Same Python the runner playbook targets
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # Versions match runner_python_packages and runner_collection_pins in semaphore-runner.yaml
      - name: Install Ansible and collections
        run: |
          pip install ansible-core==2.21.4 hvac
          ansible-galaxy collection install community.general:==13.4.0 community.hashi_vault:==7.1.0 ansible.posix:==2.2.2 lucasheld.uptime_kuma:==1.2.0 oxlorg.opnsense:==26.1.11 netbox.netbox:==3.23.0

      # Every file under ansible/ whose top level is a list of plays
      - name: Run syntax checks
        run: sh ci/ansible-syntax.sh

  # Formatting and validity of each Terraform project, without a backend or provider credentials
  terraform:
    runs-on: ubuntu-latest
    steps:
      # The repo at the pushed commit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Same version the runner installs
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      # fmt for the whole tree, then init and validate per project
      - name: Check and validate
        run: sh ci/terraform-validate.sh

  # Builds every kustomization and checks the result against the Kubernetes and CRD schemas
  kubernetes:
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: 5.8.1
      KUBECONFORM_VERSION: 0.8.0
      # sha256 of each release archive, from the projects' published checksums; a version bump needs these updated too
      KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      # The repo at the pushed commit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Release binaries, pinned to the versions tested locally; each archive is checked against its recorded sha256 before unpacking
      - name: Install kustomize and kubeconform
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          printf '%s  kustomize.tar.gz\n%s  kubeconform.tar.gz\n' "$KUSTOMIZE_SHA256" "$KUBECONFORM_SHA256" | sha256sum -c -
          tar -xzf kustomize.tar.gz -C "$HOME/bin"
          tar -xzf kubeconform.tar.gz -C "$HOME/bin" kubeconform
          rm kustomize.tar.gz kubeconform.tar.gz
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # Flux, External Secrets and other CRDs come from the community CRD catalog
      - name: Build and validate
        run: sh ci/kubernetes-validate.sh

  # Fails when a tracked file, or a line added or an author in this push's commits, matches a private pattern; the patterns live in the PII_PATTERNS secret
  pii:
    runs-on: ubuntu-latest
    steps:
      # Full history, so every commit in the push can be read
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Prints only file and line, or commit and file, never the match
      - name: Scan for private values
        run: PII_RANGE=$(sh ci/commit-range.sh) sh ci/pii-scan.sh
        env:
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  # Fails when a commit in this push or pull request adds something that looks like a secret; findings are redacted, since CI logs are public
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Full history, so every commit in the push can be read
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The release binary, checked against its recorded sha256 before unpacking
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && rm gitleaks.tar.gz

      # Only the new commits, so a finding points at the change that introduced it
      - name: Scan the new commits for secrets
        run: ./gitleaks git --redact --no-banner --log-opts="$(sh ci/commit-range.sh)" .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  # Fails on high or critical misconfigurations in Terraform, Kubernetes manifests and Dockerfiles, using the checks built into the pinned release
  trivy:
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
    steps:
      # The repo at the pushed commit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The release binary, checked against its recorded sha256 before unpacking
      - name: Install trivy
        run: |
          curl -fsSL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy && rm trivy.tar.gz

      # Accepted findings, each limited to its files and with its reason, live in .trivyignore.yaml
      - name: Scan the infrastructure code
        run: ./trivy config --skip-check-update --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml .
