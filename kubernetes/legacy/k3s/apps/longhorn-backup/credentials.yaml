---
# ESO keeps this in sync with Vault; the values never land in this repo.
# Key names are fixed by Longhorn - see its S3 backupstore docs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-backup-credentials
  namespace: longhorn-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: longhorn-backup-credentials
    creationPolicy: Owner
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_key }}"
        # Longhorn has no separate endpoint setting, so it goes in the credentials; GARAGE_URL must include the scheme
        AWS_ENDPOINTS: "{{ .endpoint }}"
        # Garage serves path-style only, matching force_path_style in the
        # Terraform S3 backend.
        VIRTUAL_HOSTED_STYLE: "false"
  data:
    - secretKey: access_key
      remoteRef:
        key: garage
        property: GARAGE_ACCESS_KEY
    - secretKey: secret_key
      remoteRef:
        key: garage
        property: GARAGE_SECRET_KEY
    - secretKey: endpoint
      remoteRef:
        key: garage
        property: GARAGE_URL
