---
# ESO keeps these in sync with Vault; the values never land in this repo.
# Key names are fixed by the chart - see its README, "Existing secrets".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-superuser
  namespace: netbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: netbox-superuser
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: k3s/netbox
        property: NETBOX_SUPER_USER
    - secretKey: password
      remoteRef:
        key: k3s/netbox
        property: NETBOX_SUPER_PASSWORD
    - secretKey: email
      remoteRef:
        key: k3s/netbox
        property: NETBOX_SUPER_EMAIL
    - secretKey: api_token
      remoteRef:
        key: k3s/netbox
        property: NETBOX_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-config
  namespace: netbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: netbox-config
    creationPolicy: Owner
    # The chart mounts email_password unconditionally, so the key must exist
    # even with no SMTP configured.
    template:
      data:
        secret_key: "{{ .secret_key }}"
        email_password: ""
        api_token_peppers: "{{ .api_token_peppers }}"
  data:
    - secretKey: secret_key
      remoteRef:
        key: k3s/netbox
        property: NETBOX_SECRET_KEY
    - secretKey: api_token_peppers
      remoteRef:
        key: k3s/netbox
        property: NETBOX_API_TOKEN_PEPPERS
---
# Consumed by the bundled PostgreSQL subchart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-postgresql
  namespace: netbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: netbox-postgresql
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: k3s/netbox
        property: NETBOX_DB_PASSWORD
    - secretKey: postgres-password
      remoteRef:
        key: k3s/netbox
        property: NETBOX_DB_ADMIN_PASSWORD
---
# Consumed by the bundled Valkey subchart. Pinned via Vault instead of left to
# the chart's own auth.password generator: under ArgoCD that generator was
# regenerating a new random password on re-render without the running Valkey
# server being restarted to match, causing repeated WRONGPASS liveness/
# readiness probe failures and restart loops. valkey.auth.existingSecret in
# netbox.yaml now points here so the subchart no longer creates or owns this
# Secret itself.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-valkey
  namespace: netbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: netbox-valkey
    creationPolicy: Owner
  data:
    - secretKey: valkey-password
      remoteRef:
        key: k3s/netbox
        property: NETBOX_VALKEY_PASSWORD
