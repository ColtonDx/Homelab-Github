---
# Named vault on every platform, so apps' ExternalSecrets never change between clusters; the values come from the cluster-bootstrap Secret
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: ${VAULT_ADDR}
      path: ${VAULT_KV_MOUNT}
      version: v2
      auth:
        kubernetes:
          mountPath: ${VAULT_AUTH_MOUNT}
          role: ${VAULT_ROLE}
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
